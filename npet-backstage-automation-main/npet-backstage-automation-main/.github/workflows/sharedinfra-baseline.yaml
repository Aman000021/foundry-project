  # Run post-prerequisites terraform to complete infrastructure setup
  terraform_post_prereqs:
    needs: terraform_prereqs
    environment: pr
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Mint registry-token
        id: gh_mod_tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NPET_REGISTRY_APPID }}
          private-key: ${{ secrets.NPET_REGISTRY_PRIVATE_KEY }}
          owner: nestle-it

      - uses: actions/checkout@v4
        with:
          repository: nestle-it/npet-backstage-terraform
          ref: main
          path: terraform-src
          token: ${{ steps.gh_mod_tok.outputs.token }}

      - name: Build tf_input_var.json
        id: tfvars_post
        shell: bash
        env:
          BASE_VARS: "${{ inputs.variables }}"
          TF_JSON_B64: ${{ needs.terraform_prereqs.outputs.tf_json_b64 }}
        run: |
          set -euo pipefail
          ls -la terraform-src/post-prerequisites
          ls -la terraform-src/

          # Prepare input files
          echo "$BASE_VARS"   | jq '.'   > /tmp/base.json
          echo "$TF_JSON_B64" | base64 -d > /tmp/out.json

          echo "### base.json"
          cat /tmp/base.json | jq .

          cat /tmp/out.json  | jq 'keys'

          # Merge terraform outputs with base variables
          jq -s '
            .[0].environments[0] += {
              spn:        { app_sso:       .[1].spn.value.app_sso },
              entra_grp:  { dba_entra_grp: .[1].entra_grp.value.dba_entra_grp },
              sta:        { tf_stf:        .[1].sta.value.tf_stf },
              sta_cont:   [ { tfstate:     .[1].sta_cont.value[0].tfstate } ],
              snet:            .[1].snet.value,
              umi:        { federation:    .[1].umi.value.federation,
                             paas_sql:     .[1].umi.value.paas_sql }
            }
            | .[0]
          ' /tmp/base.json /tmp/out.json \
          > terraform-src/post-prerequisites/tf_input_var.json

          echo "########## tf_input_var.json (post pre requisites) ##########"
          cat terraform-src/post-prerequisites/tf_input_var.json | jq .
          ls -al terraform-src/post-prerequisites

      - id: tfstate_post
        shell: bash
        run: |
          echo "file=${{ inputs.subscriptionName }}_${{ inputs.resourceGroupName }}_post.terraform.tfstate" >> $GITHUB_OUTPUT

      - uses: azure/login@v1
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ inputs.subscriptionId }}
          enable-AzPSSession: true

      - name: terraform init (post)
        working-directory: terraform-src/post-prerequisites
        run: |
          git config --global url."https://x-access-token:${{ steps.gh_mod_tok.outputs.token }}@github.com/nestle-it".insteadOf "https://github.com/nestle-it"
          terraform init \
            -backend-config="subscription_id=${{ env.tfsubscription_id }}" \
            -backend-config="resource_group_name=${{ env.tfstate_rg }}" \
            -backend-config="storage_account_name=${{ env.tfstate_storage_account }}" \
            -backend-config="container_name=${{ env.tfstate_container_name }}" \
            -backend-config="key=${{ env.tfstate_key }}/${{ steps.tfstate_post.outputs.file }}"

      - name: terraform plan (post)
        working-directory: terraform-src/post-prerequisites
        run: |
          terraform plan \
            -var environment='${{ inputs.environmentName }}' \
            -var subscription_id='${{ inputs.subscriptionId }}' \
            -var-file=tf_input_var.json

      - name: terraform apply (post)
        working-directory: terraform-src/post-prerequisites
        run: |
          terraform apply -auto-approve \
            -var environment='${{ inputs.environmentName }}' \
            -var subscription_id='${{ inputs.subscriptionId }}' \
            -var-file=tf_input_var.json
