name: Azure EntraID Group with Enterprise App Assignment
run-name: EntraID Group + Enterprise App - [${{ inputs.UUID }}]

on:
  workflow_dispatch:
    inputs:
      groupNames: 
        description: 'Comma-separated list of group names to create'
        type: string
        required: true
      groupOwners: 
        description: 'Comma-separated list of group owners (email addresses)'
        type: string
        required: true
      dryRun: 
        description: 'Dry run mode - only test group creation without Enterprise App assignment'
        type: boolean
        required: false
        default: false
      enterpriseAppObjectId:
        description: 'Enterprise App Object ID (defaults to ARO app)'
        type: string
        required: false
      appRoleId:
        description: 'App Role ID (defaults to ARO role)'
        type: string
        required: false
      UUID:
        description: 'UUID of the run'
        type: string
        required: false
        default: "00000000-0000-0000-0000-000000000000"

  workflow_call:
    inputs:
      groupNames: { type: string, required: true }
      groupOwners: { type: string, required: true }
      dryRun: { type: boolean, required: false, default: false }
      enterpriseAppObjectId: { type: string, required: false }
      appRoleId: { type: string, required: false }
      UUID: { type: string, required: false, default: "00000000-0000-0000-0000-000000000000" }

permissions:
  id-token: write
  contents: read

jobs:
  # Step 1: Create EntraID Groups using existing workflow
  create_entra_id_groups:
    uses: ./.github/workflows/entra-id-group.yaml
    with:
      groupNames: ${{ inputs.groupNames }}
      groupOwners: ${{ inputs.groupOwners }}
      dryRun: ${{ inputs.dryRun }}
      UUID: ${{ inputs.UUID }}
    secrets: inherit

  # Step 2: Assign groups to Enterprise App (only if not dry run)
  assign_to_enterprise_app:
    needs: create_entra_id_groups
    environment: pr #dv
    runs-on: ubuntu-latest
    name: Assign Groups to Enterprise App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PowerShell module cache
        id: cacher
        uses: actions/cache@v4
        with:
          path: "~/.local/share/powershell/Modules"
          key: ${{ runner.os }}-Microsoft-Entra-AZ-Accounts

      - name: Install PowerShell modules
        if: steps.cacher.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.Entra -RequiredVersion 1.0.6 -ErrorAction Stop
          Install-Module -Name Microsoft.Graph.Applications -ErrorAction Stop
          Install-Module -Name Az.Accounts -RequiredVersion 4.1.0 -ErrorAction Stop
        
      - name: Authenticate to Azure using Service Principal
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Fetch Azure Tenant
        id: set-env
        uses: nestle-it/gha-npet/gha-tenantenv@v0.0.1
        with:
          tenant: NestlePROD

      - name: Assign groups to Enterprise App
        shell: pwsh
        env:
          GROUP_NAMES: ${{ inputs.groupNames }}
          ENTERPRISE_APP_ID: ${{ inputs.enterpriseAppObjectId || secrets.ARO_ENTERPRISE_APP_OBJECT_ID }}
          APP_ROLE_ID: ${{ inputs.appRoleId || secrets.ARO_APP_ROLE_ID }}
        run: |
          Write-Host "=== Starting Enterprise App Assignment ===" -ForegroundColor Cyan
          Write-Host "Enterprise App Object ID: $env:ENTERPRISE_APP_ID" -ForegroundColor Yellow
          Write-Host "App Role ID: $env:APP_ROLE_ID" -ForegroundColor Yellow
          Write-Host ""

          # Parse group names
          $groupList = $env:GROUP_NAMES -split ',' | ForEach-Object { $_.Trim() }
          Write-Host "Processing $($groupList.Count) group(s)" -ForegroundColor Green
          
          foreach ($groupName in $groupList) {
            Write-Host "Getting Group ID for: $groupName" -ForegroundColor Magenta
            
            try {
              # Use the existing script to get group ID
              $groupId = ./.scripts/get-entra-group-id.ps1 -GroupName $groupName
              
              if ($groupId) {
                Write-Host "Found Group ID: $groupId" -ForegroundColor Green
                
                # Call the existing Enterprise App assignment script
                Write-Host "Assigning group to Enterprise App..." -ForegroundColor Yellow
                ./.scripts/add-entra-group-enterprise-app.ps1 `
                  -GroupId $groupId `
                  -EnterpriseAppObjectId $env:ENTERPRISE_APP_ID `
                  -AppRoleId $env:APP_ROLE_ID
                
                Write-Host "✓ Successfully processed group: $groupName" -ForegroundColor Green
              }
              else {
                Write-Host "❌ Could not find Group ID for: $groupName" -ForegroundColor Red
                exit 1
              }
            }
            catch {
              Write-Host "❌ Error processing group '$groupName': $($_.Exception.Message)" -ForegroundColor Red
              exit 1
            }
            
            Write-Host ""
          }
          
          Write-Host "🎉 All groups assigned to Enterprise App successfully!" -ForegroundColor Green