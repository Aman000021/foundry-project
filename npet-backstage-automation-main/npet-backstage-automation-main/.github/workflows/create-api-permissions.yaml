name: Create API Permissions
run-name: API Permissions - [${{ inputs.UUID }}]

on:
  workflow_dispatch:
    inputs:
      app_sso_id:
        description: "App SSO Object ID"
        type: string
        required: true
      umi_paas_id:
        description: "UMI PaaS Principal ID"
        type: string
        required: true
      apm_id:
        description: "APM ID"
        type: string
        required: true
      UUID:
        description: "UUID of the run"
        type: string
        required: false
        default: "00000000-0000-0000-0000-000000000000"

  workflow_call:
    inputs:
      app_sso_id: { type: string, required: true }
      umi_paas_id: { type: string, required: true }
      apm_id: { type: string, required: true }
      UUID:
        {
          type: string,
          required: false,
          default: "00000000-0000-0000-0000-000000000000",
        }

permissions:
  id-token: write
  contents: read

jobs:
  create_api_permission_issues:
    runs-on: [self-hosted, Linux, X64]
    environment: pr

    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub-App token (Backstage federated app)
        id: gh_app_tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTH_GITHUB_ORG_APP_ID }}
          private-key: ${{ secrets.AUTH_GITHUB_ORG_PRIVATE_KEY }}
          owner: nestle-it

      - name: Create API-permission issue (App registration)
        id: create_issue_app
        shell: pwsh
        env:
          ISSUE_REPO: "aad-automation"
          APM_ID: ${{ inputs.apm_id }}
          OBJ_ID: ${{ inputs.app_sso_id }}
        run: |
          # Grant all required permissions for Backstage app registration
          $delegated   = 'Application.Read.All,email,GroupMember.Read.All,offline_access,openid,profile,user.read,User.Read.All,User.ReadBasic.All'
          $application = 'Application.Read.All,GroupMember.Read.All,User.Read.All'
          
          pwsh ./.scripts/create-api-permission-issue.ps1 `
            -Issue_Create_Repo           $env:ISSUE_REPO `
            -Apm_Id                      $env:APM_ID `
            -AAD_Object_Id               $env:OBJ_ID `
            -Id_Type                     'App registration (application)' `
            -Delegated_Permission_List   $delegated `
            -Application_Permission_List $application `
            -Pat                         '${{ steps.gh_app_tok.outputs.token }}'

      - name: Wait issue closure (App registration)
        if: steps.create_issue_app.outputs.fet_issue_number != ''
        id: wait_app
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gh_app_tok.outputs.token }}
          ISSUE_NUM: ${{ steps.create_issue_app.outputs.fet_issue_number }}
          ISSUE_REPO: aad-automation
        run: |
          set -euo pipefail
          echo "Waiting for closure of issue #$ISSUE_NUM in $ISSUE_REPO"
          time_limit_in_sec=600
          while true; do
            state=$(gh issue view "$ISSUE_NUM" -R "nestle-it/$ISSUE_REPO" --json state -q '.state')
            echo "Current state: $state"
            [[ "$state" == "CLOSED" ]] && break
            ((time_limit_in_sec-=10)) || true
            [[ $time_limit_in_sec -le 0 ]] && { echo "Timeout waiting for issue close"; exit 1; }
            sleep 10
          done

      - name: Create API-permission issue (Managed Identity)
        id: create_issue_mi
        shell: pwsh
        env:
          ISSUE_REPO: "aad-automation"
          APM_ID: ${{ inputs.apm_id }}
          OBJ_ID: ${{ inputs.umi_paas_id }}
        run: |
          pwsh ./.scripts/create-api-permission-issue.ps1 `
            -Issue_Create_Repo           $env:ISSUE_REPO `
            -Apm_Id                      $env:APM_ID `
            -AAD_Object_Id               $env:OBJ_ID `
            -Id_Type                     'Enterprise application (service principal or managed identity)' `
            -Delegated_Permission_List   '' `
            -Application_Permission_List 'Application.Read.All,GroupMember.Read.All,User.Read.All' `
            -Pat                         '${{ steps.gh_app_tok.outputs.token }}'

      - name: Wait issue closure (Managed Identity)
        if: steps.create_issue_mi.outputs.fet_issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gh_app_tok.outputs.token }}
          ISSUE_NUM: ${{ steps.create_issue_mi.outputs.fet_issue_number }}
          ISSUE_REPO: aad-automation
        run: |
          set -euo pipefail
          echo "Waiting for closure of issue #$ISSUE_NUM in $ISSUE_REPO"
          time_limit_in_sec=600
          while true; do
            state=$(gh issue view "$ISSUE_NUM" -R "nestle-it/$ISSUE_REPO" --json state -q '.state')
            echo "Current state: $state"
            [[ "$state" == "CLOSED" ]] && break
            ((time_limit_in_sec-=10)) || true
            [[ $time_limit_in_sec -le 0 ]] && { echo "Timeout waiting for issue close"; exit 1; }
            sleep 10
          done