title: Catalog Entity Metadata Parameters
required:
  - name
properties:
  name:
    title: Name
    type: string
  description:
    title: Description
    type: string
  namespace:
    title: Namespace
    type: string
    description: Namespace for your entity.
  annotations:
    title: Annotations
    description: Annotations for your entity.
    type: array
    items:
      type: object
      required:
        - key
        - value
      properties:
        key:
          title: Key
          type: string
        value:
          title: value
          type: string
  tags:
    title: Tags
    description: Tags for your entity.
    type: array
    items:
      type: string
  visibility:
    title: Entity Visibility
    type: string
    description: Visibility of the entity inside Backstage.
    oneOf:
      - title: Internal
        const: internal
      - title: Private
        const: private
