title: Storage Account Configuration
properties:
  storagecontainers:
    title: Add your Containers
    type: array
    default: []
    items:
      type: object
      required:
        - name
        - storageContainerDaysUntilDelete
      properties:
        type:
          type: string
          default: storagecontainer
          ui:widget: hidden
        name:
          title: Container Name
          type: string
        storageContainerDaysUntilDelete:
          title: Days until created files are deleted
          type: number
          description: Set -1 to ignore deletion rule.
          default: -1
          enum:
            - -1
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 10
            - 15
            - 30
            - 60
            - 90

  storagequeues:
    title: Add your Storage Queues
    type: array
    default: []
    items:
      type: object
      required:
        - name
      properties:
        type:
          type: string
          default: storagequeue
          ui:widget: hidden
        name:
          title: Queue Name
          type: string

  storagefileshares:
    title: Add your Storage Fileshares
    type: array
    default: []
    items:
      type: object
      required:
        - name
        - quotaGB
      properties:
        type:
          type: string
          default: storagefileshare
          ui:widget: hidden
        name:
          title: Fileshare Name
          type: string
        quotaGB:
          title: Fileshare Quota (GB)
          type: number
          default: 10
          enum:
            - 10
            - 50
