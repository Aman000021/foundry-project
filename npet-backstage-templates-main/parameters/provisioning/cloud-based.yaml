title: Centralized Provisioning Cloud Parameters
required:
  - dataClassification
properties:
  region:
    title: Azure Region
    type: string
    oneOf:
      - title: East US
        const: usea
      - title: West Europe
        const: euwe
      - title: SouthEast Asia
        const: asse
    ui:widget: radio
    ui:options:
      inline: true
  network:
    title: Network Type
    type: string
    default: internal
    oneOf:
      - title: Internal
        const: internal
      - title: External
        const: external
    ui:widget: radio
    ui:options:
      inline: true
  dataClassification:
    title: Data Classification
    type: string
    oneOf:
      - title: Public
        const: public
      - title: General Use
        const: general use
      - title: Confidential
        const: confidential
      - title: Highly Confidential
        const: highly confidential
  environments:
    title: Environment(s)
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - Development
        - Test
        - Pre-Production
        - Production
        - Integration
        - Run-Time
        - Staging
        - Exploration
        - Non-Production
    uniqueItems: true
    ui:widget: checkboxes
