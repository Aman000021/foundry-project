title: Features
properties:
  coreFeatures:
    title: Core System features
    type: array
    default: []
    uniqueItems: true
    ui:widget: checkboxes
    items:
      type: string
      enum:
        - notification
        - metrics
        - nats
        - content-delivery
  smanagerFeatures:
    title: Smanager System features
    description: The smanager application uses NATS for messaging, so `nats` is selected by default.
    type: array
    default:
      - nats
    uniqueItems: true
    ui:widget: checkboxes
    items:
      type: string
      enum:
        - notification
        - metrics
        - nats
        - content-delivery
