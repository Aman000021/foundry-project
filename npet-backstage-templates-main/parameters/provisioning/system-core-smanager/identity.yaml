title: Solution Identity
required:
  - name
  - coreDescription
  - smanagerDescription
  - scope
  - domain
ui:order:
  - name
  - coreDescription
  - smanagerDescription
  - scope
  - domain
  - generateDomain
  - gitopsAlreadyExists
  - createEntraidGroups
properties:
  name:
    title: Solution Name
    type: string
    description: |
      Solution name, without context. Two Systems are created from it:
      `{name}-core` (AKS cluster, container registry) and `{name}-smanager`
      (CosmosDB, Redis, cto-token).
      Limited to 11 characters because the derived Azure Key Vault name
      `{scope}{env}{name}corekey` must stay within the 24 character Key Vault
      limit (4 + 2 + name + 4 + 3).
    pattern: '^[a-z][a-z0-9]{1,10}$'
    maxLength: 11
    errorMessage: 2 to 11 lowercase alphanumeric characters, starting with a letter (e.g., innoplay, vsa, techprod).
  coreDescription:
    title: Core System Description
    type: string
    description: "Description of the {name}-core System (e.g., Core Innoplay system for AKS instantiation)"
  smanagerDescription:
    title: Smanager System Description
    type: string
    description: "Description of the {name}-smanager System (e.g., Smanager Innoplay system)"
  scope:
    title: Scope
    type: string
    description: "Market scope code — always 4 characters (e.g., nbra, nams, glbl, npxr)"
    pattern: '^[a-z]{4}$'
    errorMessage: Exactly 4 lowercase letters (e.g., nbra, nams, glbl, npxr).
  domain:
    title: Parent Domain
    type: string
    description: Parent domain of both Systems.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [Domain]
  # Both Systems are always private and owned by their own per-system members
  # AAD group (group:default/aad[-devtest]-backstage-<scope>-<name>-{core,smanager}-members).
  # Both are computed server-side in the provisioning steps so they cannot be
  # overridden from the request — see steps/provisioning/system-core-smanager/*.
  generateDomain:
    title: Generate Domain
    type: boolean
    default: true
    description: If enabled, both entities will generate an XDomain in Crossplane.
  gitopsAlreadyExists:
    title: GitOps repos already exist
    type: boolean
    default: false
    description: |
      If disabled, `{scope}-{name}-core-gitops` and `{scope}-{name}-smanager-gitops`
      are created with branch protection on main. If enabled, neither repository is
      created — provide the URLs of the existing ones below.
  createEntraidGroups:
    title: Create EntraID groups
    type: boolean
    default: true
    description: If enabled, dispatches the npet-backstage-automation workflow to create the techleads/members EntraID groups of both Systems.
dependencies:
  gitopsAlreadyExists:
    allOf:
      - if:
          properties:
            gitopsAlreadyExists:
              const: true
        then:
          properties:
            coreGitopsRepoUrl:
              title: Core GitOps Repository URL
              type: string
              description: "URL of the existing GitOps repository of the core System (e.g., https://github.com/nestle-it/nams-innoplay-core-gitops.git)"
              pattern: '^https://github\.com/(nestle-it|nestle-devtest)/[a-z][a-z0-9-]+-gitops\.git$'
            smanagerGitopsRepoUrl:
              title: Smanager GitOps Repository URL
              type: string
              description: "URL of the existing GitOps repository of the smanager System (e.g., https://github.com/nestle-it/nams-innoplay-smanager-gitops.git)"
              pattern: '^https://github\.com/(nestle-it|nestle-devtest)/[a-z][a-z0-9-]+-gitops\.git$'
          required:
            - coreGitopsRepoUrl
            - smanagerGitopsRepoUrl
