title: Redis Cache Configuration
required:
  - redisCache
properties:
  entity:
    title: Redis Cache Resource
    description: The Redis Cache resource being edited (set by the edit button).
    type: string
    ui:disabled: true
    ui:widget: hidden
  redisCache:
    title: Redis Cache Settings
    type: object
    required:
      - skuName
      - family
      - capacity
    properties:
      skuName:
        title: SKU Name
        type: string
        default: Basic
        enum:
          - Basic
          - Standard
          - Premium
    dependencies:
      skuName:
        oneOf:
          - properties:
              skuName:
                const: Basic
              family:
                title: Family
                type: string
                default: C
                enum:
                  - C
                enumNames:
                  - Basic/Standard
          - properties:
              skuName:
                const: Standard
              family:
                title: Family
                type: string
                default: C
                enum:
                  - C
                enumNames:
                  - Basic/Standard
          - properties:
              skuName:
                const: Premium
              family:
                title: Family
                type: string
                default: P
                enum:
                  - P
                enumNames:
                  - Premium
      family:
        oneOf:
          - properties:
              family:
                const: C
              capacity:
                title: Capacity
                type: string
                enum:
                  - '0'
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  - '6'
          - properties:
              family:
                const: P
              capacity:
                title: Capacity
                type: string
                enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
