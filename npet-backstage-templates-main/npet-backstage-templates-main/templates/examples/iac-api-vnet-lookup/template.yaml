---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vnet-lookup-api
  title: IAC-API - VNET Lookup
  description: VNET Metadata Lookup
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: Parameters
      required:
        - subscription
      properties:
        subscription:
          title: Subscription
          type: string

  steps:
    - id: vnet-lookup-api
      action: nestle:vnet-lookup
      name: VNET Lookup API
      input:
        subscription: ${{ parameters.subscription }}
    - action: debug:log
      id: write-debug-line
      name: Output Entity data
      input:
        message: |
          ResourceGroup: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
          VNET: ${{ steps['vnet-lookup-api'].output.vnet }}
          SubscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
          TenantId: ${{ steps['vnet-lookup-api'].output.tenantId }}
