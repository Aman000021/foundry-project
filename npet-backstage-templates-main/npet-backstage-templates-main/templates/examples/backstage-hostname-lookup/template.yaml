---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: backstage-hostname-lookup
  title: Backstage Hostname Lookup
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  steps:
    - action: nestle:backstage-hostname-lookup
      id: lookup
      name: Hostname Lookup
    - action: debug:log
      name: Output Hostname
      input:
        message: |
          hostname: ${{ steps['lookup'].output.hostname }}
