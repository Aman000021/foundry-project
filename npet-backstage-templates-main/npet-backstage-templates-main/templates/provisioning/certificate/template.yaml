---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-pipeline-run-certificate
  title: Run Azure Certificate Creation
  description: Runs the Azure DevOps Pipeline to create a certificate.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - cpw
    - azure
    - acr
    - certificate
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: Parameters
      required:
        - resourceGroupRef
      properties:
        resourceGroupRef:
          title: Parent ResourceGroup
          description: ResourceGroup to associate the Subnet to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: resource-group

  steps:
    - action: catalog:get:entity:data
      id: resource-group-entity
      name: Get ResourceGroup Entity
      input:
        ref: ${{ parameters.resourceGroupRef }}

    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('nestle.com/parent-system') }}

    - id: certificate-run
      name: Trigger Certificate Creation
      action: azure:pipeline:run:certificate
      each: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('umi-federation', true) }}
      input:
        organization: nestle-it
        project: STIG
        branch: "Generate_Certificate_V5_Final"
        pipelineId: 11280
        waitForPipelineCompletion: true
        templateParameters:
          servername: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') | string }}${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('environment-name') | string }}${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') | string }}
          certname: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') | string }}${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('environment-name') | string }}${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') | string }}
          requester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          Subscription_name: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subscription-name') | string }}
          ResourceGroup_Name: ${{ steps['resource-group-entity'].output.annotations| parseEntityAnnotations('resource-group-name') | string}}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') | string }}
          environment: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('environment-name') | string}}
          region: ${{ steps['resource-group-entity'].output.annotations| parseEntityAnnotations('region') | string }}
          appid_UMi: ${{ each.value.principal_id | string }}

  output:
    links:
      - title: Workflow Url
        url: ${{ steps['pipeline-run'].output.workflowUrl }}
