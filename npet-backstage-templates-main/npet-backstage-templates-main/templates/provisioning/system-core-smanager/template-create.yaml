apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-core-smanager-systems-template
  title: Backstage Core & Smanager Systems Creation
  description: |
    Creates the pair of regional Systems a solution needs to run on its own AKS
    cluster — `{name}-core` and `{name}-smanager` — with every Resource of both,
    in a single catalog Pull Request. This is the (vsa-core, vsa-smanager) /
    (innoplay-core, innoplay-smanager) pattern.

    For every environment of the request it creates:

    - `{name}-core`: base, key-vault, user-assigned-managed-identity,
      kubernetes-cluster (the AKS cluster both Systems run on) and registry.
    - `{name}-smanager`: base, key-vault, user-assigned-managed-identity,
      cosmosdb-account (the standard smanager/audit schema), redis-cache and the
      cto-token strongpassword.

    It also creates a GitOps repository, a GitHub write team and the
    techleads/members EntraID groups for each of the two Systems.

    Use the Create Regional System template instead when the solution runs on an
    existing shared cluster and needs a single System.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - entities
    - create
    - regional-admin
    - core
    - smanager
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - $yaml: ../../../parameters/provisioning/system-core-smanager/identity.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/ownership.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/compliance.yaml

    - $yaml: ../../../parameters/provisioning/system-core-smanager/environments.yaml

    - $yaml: ../../../parameters/provisioning/system-core-smanager/cluster.yaml

    - $yaml: ../../../parameters/provisioning/system-core-smanager/smanager-data.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/team.yaml

    - $yaml: ../../../parameters/provisioning/system-core-smanager/features.yaml

  steps:
    - $yaml: ../../../steps/catalog/get-entities-config.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/systems.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-base.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-keyvault.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-managedidentity.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-kubernetescluster.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-registry.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-cosmosdb.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-redis.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/resource-strongpassword.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/gitops-fetch.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/gitops-publish.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/gitops-branch-protection.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/github-team-create.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/github-teams-add-to-gitops.yaml
    - id: publish
      name: GitHub Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
        branchName: entity-creation-${{ parameters.name }}-core-smanager
        title: Entity Creation - ${{ parameters.name }}-core and ${{ parameters.name }}-smanager
        description: Backstage ${{ parameters.name }}-core and ${{ parameters.name }}-smanager Entity Creation (regional systems)
        sourcePath: ./${{ parameters.domain.split('/')[1] }}
        targetPath: ${{ parameters.domain.split('/')[1] }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true
    - $yaml: ../../../steps/provisioning/system-core-smanager/entraid-groups-create.yaml
    - $yaml: ../../../steps/provisioning/system-core-smanager/entraid-groups-populate.yaml
  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Core GitOps Repository
        url: ${{ parameters.coreGitopsRepoUrl if parameters.gitopsAlreadyExists else steps['gitops-publish-core'].output.remoteUrl }}
      - title: Smanager GitOps Repository
        url: ${{ parameters.smanagerGitopsRepoUrl if parameters.gitopsAlreadyExists else steps['gitops-publish-smanager'].output.remoteUrl }}
