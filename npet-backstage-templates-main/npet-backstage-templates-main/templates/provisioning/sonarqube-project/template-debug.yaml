---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-sonarqube-project-debug
  title: Create a SonarQube Project - DEBUG
  description: Creates a SonarQube Project with the Provisioning Process.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - cpw
    - sonarqube
    - debug
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: Parameters
      required:
        - repository
        - admins
      properties:
        organization:
          title: Repository Organization
          default: "nestle-it"
          ui:disabled: true
          ui:widget: hidden
        repository:
          title: Repository Name
          type: string
          description: Name of the repository in GitHub to add SonarQube components.
        admins:
          title: Admin Emails
          description: Comma separated list of admin emails for sonarqube repository project owner
          type: string

  steps:
    - action: nestle:backstage:variablizer
      id: variablizer
      name: Sets Variables
      input:
        variables:
          repoUrl: github.com?owner=${{ parameters.organization }}&repo=${{ parameters.repository }}

    - action: debug:log
      id: debug-log
      name: Debug Log
      input:
        message: |

          Variabiles:
          - repoUrl: ${{ steps['variablizer'].output.repoUrl }}
          - repository: ${{ parameters.repository }}
          - organization: ${{ parameters.organization }}

    - id: github-repo-get
      action: github:repo:get
      name: Get GitHub Repository
      input:
        repoUrl: ${{ steps['variablizer'].output.repoUrl }}

    - id: fail-if-repo-not-found
      action: nestle:error
      name: Fail if Repository Not Found
      if: ${{ steps['github-repo-get'].output.exists == false }}
      input:
        error: |
          Error: GitHub Repository not found: ${{ parameters.repository }}

    - id: fetch-template
      action: fetch:template
      name: Fetch SonarQube Repository Files
      input:
        url: ./content
        targetPath: content
        values:
          repository: ${{ parameters.repository }}
        templateFileExtension: true
        replace: true

    - id: pipeline-run
      action: github:actions:dispatch-with-response
      name: Dispatch Github Action Workflow with inputs
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        workflowId: create-sonarqube-project.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 720
        workflowInputs:
          organization: ${{ parameters.organization }}
          repository: ${{ parameters.repository }}
          admins: ${{ parameters.admins }}

    - id: github-repository-update
      action: publish:github:pull-request
      name: Update GitHub Repository
      input:
        repoUrl: ${{ steps['variablizer'].output.repoUrl }}
        sourcePath: content
        branchName: update-sonarqube-${{ parameters.repository }}
        title: "Backstage SonarQube update - ${{ parameters.repository }}"
        description: "Backstage SonarQube updates of ${{ parameters.repository }}."
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: SonarQube Repository Pull Request
        url: ${{ steps['github-repository-update'].output.remoteUrl }}
      - title: SonarQube Workflow Url
        url: ${{ steps['pipeline-run'].output.workflowUrl }}
      - title: SonarQube Project URL
        url: https://sonar.azure.dsudevops.nestle.biz/dashboard?id=azdo-${{ parameters.repository }}
