---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-mssqlserver-template
  title: Edit MSSQL Server
  description: Adds new databases to an existing MSSQL Server. Provisioning is handled by Crossplane via ArgoCD.
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - mssqlserver
    - azure
    - database
    - edit
    - regional
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - title: MSSQL Server
      required: [ref]
      properties:
        ref:
          title: MSSQL Server Entity
          description: Select the existing MSSQL Server to add databases to.
          type: string
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: mssqlserver

    - $yaml: ../../../parameters/provisioning/mssqlserver.yaml

  steps:
    - id: mssqlserver-entity
      name: Get MSSQL Server Entity
      action: catalog:get:entity:data
      input:
        ref: ${{ parameters.ref }}

    - id: assert-system-techlead
      name: Assert System Tech Lead
      action: nestle:assert:system-techlead
      input:
        systemRef: ${{ steps['mssqlserver-entity'].output.system }}

    - id: system-entity
      name: Get Parent System
      action: catalog:get:entity:data
      input:
        ref: ${{ steps['mssqlserver-entity'].output.system }}

    - $yaml: ../../../steps/provisioning/mssqlserver/resource-edit.yaml

    - $yaml: ../../../steps/catalog/get-entities-config.yaml

    - id: catalog-pr
      name: Catalog Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
        branchName: entity-update-mssql-${{ steps['mssqlserver-entity'].output.name }}-${{ "" | now | replace(":", "-") }}
        title: Entity Update - MSSQL Server (${{ steps['mssqlserver-entity'].output.name }})
        description: Adding databases to MSSQL Server ${{ parameters.ref }}
        sourcePath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}
        targetPath: ${{ steps['system-entity'].output.domain.split('/')[1] }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['catalog-pr'].output.remoteUrl }}
