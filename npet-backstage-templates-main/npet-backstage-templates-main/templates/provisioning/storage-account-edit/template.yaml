---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-storage-account-template
  title: Edit Storage Account
  description: Edit containers, queues and file shares of an existing Azure storage account.
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - azure
    - storageaccount
    - resources
    - edit
    - regional
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - title: Select the storage account to edit
      required:
        - entity
      properties:
        entity:
          title: Storage Account
          description: Select the existing storage account to edit.
          type: string
          # EntityPicker (not OwnedEntityPicker): ownership refs in the GET query
          # string blow past the Akamai request-line limit for users with many
          # groups (silent 400 -> empty dropdown). RBAC read conditions narrow
          # results per user; the techlead guard step enforces execution.
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: storage-account
              - kind: Resource
                spec.type: storageaccount

    - $yaml: ../../../parameters/provisioning/storage-account.yaml

  steps:
    - action: catalog:get:entity:data
      id: entity
      name: Get Storage Account Entity
      input:
        ref: ${{ parameters.entity }}

    - $yaml: ../../../steps/catalog/assert-system-techlead-edit.yaml

    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ steps['entity'].output.system }}

    - id: update-resource-yaml
      name: Update Storage Account Entity
      action: fetch:template:file
      input:
        url: ../../../.templateable-content/catalog/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['entity'].output.name }}.yaml
        values:
          name: ${{ steps['entity'].output.name }}
          namespace: ${{ steps['entity'].output.namespace }}
          description: ${{ steps['entity'].output.description if steps['entity'].output.description else 'storage-account resource owned by system ' + steps['entity'].output.namespace }}
          visibility: ${{ steps['entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: storage-account
          owner: ${{ steps['entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: system:${{ steps['system-entity'].output.namespace }}/${{ steps['system-entity'].output.name }}
          resourceProperties: {}
          resourceTags: {}
          dependsOn: []
          dependencyOf: []
          links: []
          annotations:
            - key: nestle.com/system-type
              value: regional
            - key: nestle.com/resource-type
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('nestle.com/resource-type') }}
            - key: nestle.com/parent-system
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('nestle.com/parent-system') }}
            - key: br.nestle.com/created-at
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/created-at') }}
            - key: br.nestle.com/updated-at
              value: ${{ "" | now }}
            - key: br.nestle.com/environment
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/environment') }}
            - key: br.nestle.com/domain
              value: ${{ steps['entity'].output.namespace.split('-')[0] }}
            - key: br.nestle.com/account-kind
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('account-kind') }}
            - key: br.nestle.com/account-tier
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/account-tier') }}
            - key: br.nestle.com/data-lake-gen2-enabled
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/data-lake-gen2-enabled') }}
            - key: br.nestle.com/specific-subnets
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/specific-subnets') }}
            - key: br.nestle.com/specific-ip-ranges
              value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/specific-ip-ranges') }}
            - key: br.nestle.com/children
              value: ${{ parameters.storagecontainers.concat(parameters.storagequeues).concat(parameters.storagefileshares) | dump }}
          tags:
            - storageaccount

    - $yaml: ../../../steps/catalog/get-entities-config.yaml

    - id: publish-resource
      name: Create PR in catalog repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
        branchName: storageaccount-edit-${{ steps['entity'].output.name }}
        title: "Edit Storage Account - ${{ steps['entity'].output.name }}"
        description: "Backstage Storage Account ${{ steps['entity'].output.name }} update"
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['publish-resource'].output.remoteUrl }}
