---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agentic-foundry-hosted-agent-service
  title: Create ADI MS Foundry Hosted Agent
  description: Creates a template with foundry projects in Azure.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - foundry
    - terraform
    - end-user
    - agent-service
spec:
  owner: group:default/aad-backstage-glbl-agenticplatform-genai
  type: cloud-template

  parameters:
    - title: System Association
      required:
        - ref
      properties:
        ref:
          title: Parent System
          description: System to associate this Resource Group to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
    - title: Template Parameters
      ui:order:
        - environment
        - capability
        - segment
        - location
        - appName
        # - builderAADgroup
        # - readerAADgroup
        # - projectTags
        - request
        - githubreporequired
        - visibility
        - subname
        - subid
        - pepsubnet
        - vnetrg
        - vnetname
        - tenantid
        - rgname
        - objectid
        - devacrname
        - tenant
        - namespace
      properties:
        capability:
          title: Foundry Capability
          type: string
          description: Agent Service deploys the foundry project.
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - title: Hosted Agent
              const: hostedagent
        tenant:
          title: Tenant
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - title: NestlePROD
              const: nestle.onmicrosoft.com
        namespace:
          title: Namespace
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: default
        subname:
          title: Subscription Name
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: emna-np-adi-001-sub
        rgname:
          title: RG Name
          type: string
          description: Resource group name
          # ui:disabled: true
          # ui:widget: hidden
          # oneOf:
          #   - const: glbl-dv-adifoundrydev02-adi-euwe-rgp
        objectid:
          title: RG Object ID
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: b5fc3aeb-10b4-4464-bb62-fd018fea4c2c
        devacrname:
          title: Dev ACR Name
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: glbldvplatform644acr
        pepsubnet:
          title: PEP Subnet Name
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: emna-np-g.4-adi-euwe-001-snt
        subid:
          title: Subscription ID
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: 39e7e4ef-e689-447e-9f75-c3e223f5db9f
        vnetrg:
          title: vNet RG
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: emna-np-network-adi-euwe-001-rgp
        vnetname:
          title: vNet Name
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: emna-np-network-adi-euwe-001-vnt
        tenantid:
          title: Tenant ID
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: 12a3af23-a769-4654-847f-958f3d479f4a
        environment:
          title: Environment
          type: string
          description: Choose an environment.
          oneOf:
            - title: Development
              const: dv
            - title: Pre-Production
              const: pp
            - title: Production
              const: pr        
        segment:
          title: Project segment
          type: string
          description: Maps to the `segment` workflow input.
          default: marketing
          enum:
            - marketing
            - finance
            - it
        location:
          title: Project location
          type: string
          description: Maps to the `location` workflow input.
          default: europe
          enum:
            - europe
        appName:
          title: Application Name
          type: string
          description: Application name (only alphanumeric with 15 charecters length)
          pattern: "^[A-Za-z0-9]{1,15}$"
        request:
          title: Service-now Request Number
          type: string
          description: SNOW RITM Number (for e-g RITM01234567)
          pattern: "^RITM[0-9]{8}$"
        githubreporequired:
          title: Create Github repo
          type: boolean
          default: true
        visibility:
          title: GitHub Repository Visibility
          type: string
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private
      required:
        - environment
        - capability
        - segment
        - location
        - appName
        - githubreporequired
        - visibility

  steps:
    - action: nestle:backstage-hostname-lookup
      id: hostname-lookup
      name: Hostname Lookup

    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    # - id: vnet-lookup-api
    #   action: nestle:vnet-lookup
    #   if: ${{ parameters.capability == 'hostedagent' }}
    #   name: Subscription and Tenant ID Lookup API
    #   input:
    #     subscription: ${{ parameters.subname }}

    - action: nestle:backstage:variablizer
      id: variablizer-repo
      name: Sets Repository Name Variable
      input:
        variables:
          name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ parameters.appName }}
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}
          createdSourceRepo: https://github.com/${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ parameters.appName }}

    - id: fetch-payload
      action: fetch:template:file
      name: Template Payload
      input:
        url: ./content/request-payload.njk
        targetPath: ./tmp/request-payload.njk
        values:
          apmId: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billingContact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ parameters.appName }}
          costCenter: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          costPlan: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-plan') }}
          dataClassification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financialOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functionalOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          sharedCost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solutionName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technicalOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          locationFullName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}
          region: ${{ 'westeurope' if parameters.location == "europe" }}
          tenant: ${{ parameters.tenant }}
          uRequester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          environmentName: ${{ parameters.environment }}
          resourceGroupName: ${{ parameters.rgname }}
          subscriptionName: ${{ parameters.subname }}
          subscriptionId: ${{ parameters.subid }}
          aadObjectId: ${{ parameters.objectid }}
          pepSubnetName: ${{ parameters.pepsubnet }}
          virtualNetworkRg: ${{ parameters.vnetrg }}
          virtualNetworkName: ${{ parameters.vnetname }}
          organization: ${{ steps['variablizer-repo'].output.organization }}
          templates: ${{ parameters.capability }}
          repoName: ${{ steps['variablizer-repo'].output.name }}

    - id: deserialise
      action: nestle:fs:json:parse
      name: Parse File
      input:
        path: ./tmp/request-payload.njk

    - id: create-aad
      name: Dispatch AAD group creation pipeline
      action: github:actions:dispatch-with-response
      each:
        - agentbuilder
        - projectreader
        - agentconsumer
        - agentmgr
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        workflowId: entra-id-group.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 1200
        workflowInputs:
            groupNames: AAD-SG-backstage-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}-${{ parameters.environment }}-${{ parameters.appName }}-${{ each.value }}-owner
            groupOwners: "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}"

    - id: get-aad-objectid-agentbuilder
      name: Get Agent Builder Group Object ID
      action: azure-portal:get-aad-group-id
      input:
        groupName: AAD-SG-backstage-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}-${{ parameters.environment }}-${{ parameters.appName }}-agentbuilder-owner

    - id: get-aad-objectid-projectreader
      name: Get Project Reader Group Object ID
      action: azure-portal:get-aad-group-id
      input:
        groupName: AAD-SG-backstage-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}-${{ parameters.environment }}-${{ parameters.appName }}-projectreader-owner

    - id: get-aad-objectid-agentconsumer
      name: Get Agent Consumer Group Object ID
      action: azure-portal:get-aad-group-id
      input:
        groupName: AAD-SG-backstage-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}-${{ parameters.environment }}-${{ parameters.appName }}-agentconsumer-owner

    - id: get-aad-objectid-agentmgr
      name: Get Agent Consumer Group Object ID
      action: azure-portal:get-aad-group-id
      input:
        groupName: AAD-SG-backstage-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}-${{ parameters.environment }}-${{ parameters.appName }}-agentmgr-owner

    - action: catalog:get:entity
      id: resource-group-entity-validation
      name: Validate Resource Group Entity
      input:
        ref: resource:${{ parameters.namespace }}/${{ parameters.rgname }}

    - id: create-resource-yaml
      name: Scaffold Resource YAML for Catalog
      if: ${{ true if(steps['resource-group-entity-validation'].output.exists == false) }}
      action: fetch:template:file
      input:
        url: ./content/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ parameters.rgname }}.yaml
        values:
          name: >-
            ${{ parameters.rgname }}
          description: >-
            ${{ parameters.capability }} deployment triggered from Backstage.
          visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: foundry-infrastructure
          owner: ${{ steps['system-entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: ${{ parameters.ref }}
          tags:
            - terraform
            - azure
            - foundry
            - ${{ parameters.segment }}
          annotations:
            - key: nestle.com/resource-type
              value: ${{ parameters.capability }}
            - key: nestle.com/parent-system
              value: ${{ parameters.ref }}
            - key: nestle.com/region
              value: ${{ parameters.location }}
            - key: nestle.com/environment
              value: ${{ parameters.environment }}
            - key: nestle.com/project-segment
              value: ${{ parameters.segment }}
            - key: nestle.com/deployment-capability
              value: ${{ parameters.capability }}
            - key: nestle.com/source-repo
              value: nestle-it/npet-foundry-template
            - key: nestle.com/source-workflow
              value: agent-capability-deploy.yml

    - id: publish-resource
      name: Create PR in Catalog Repo
      if: ${{ true if(steps['resource-group-entity-validation'].output.exists == false) }}
      action: publish:github:pull-request
      input:
        sourcePath: ${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources
        targetPath: ${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources
        repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-catalog
        branchName: >-
          foundry-resource-${{ parameters.segment }}-${{ parameters.environment }}-${{ parameters.capability }}-${{ parameters.request }}
        title: >-
          Register Foundry deployment - ${{ parameters.segment }} - ${{ parameters.environment }} - ${{ parameters.capability }}
        description: >-
          Backstage Resource registration for the deployment triggered from the
          npet-foundry-template infrastructure template.
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    - id: setup base line infra
      action: github:actions:dispatch-with-response
      name: Created Azure Resources in RG
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        workflowId: sharedinfra-baseline.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 1200
        workflowInputs:
          organization: ${{ steps['variablizer-repo'].output.organization }}
          variables: ${{ steps.deserialise.output.content | string }}
          environmentName: ${{ parameters.environment }}
          resourceGroupName: ${{ parameters.rgname }}
          subscriptionName: ${{ parameters.subname }}
          subscriptionId: ${{ parameters.subid }}
          systemSlug: ${{ steps['system-entity'].output.name }}
          templates: ${{ parameters.capability }}

    # - action: catalog:get:entity
    #   id: resource-group-entity-validation
    #   # if: ${{ parameters.capability == 'hostedagent' }}
    #   name: Validate Resource Group Entity
    #   input:
    #     ref: resource:${{ parameters.namespace }}/${{ parameters.rgname }}

    - id: register-catalog-resource-group
      if: ${{ true if(steps['resource-group-entity-validation'].output.exists == false) }}
      name: Register Catalog Resource Group
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/${{ steps['variablizer-repo'].output.organization }}/npet-backstage-catalog/blob/main
        catalogInfoPath: /${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ parameters.rgname  }}.yaml
        optional: true

    - action: debug:wait
      id: wait-5sec
      name: Waiting for 5 seconds
      input:
        seconds: 5

    - action: catalog:get:entity:data
      id: resource-group-entity
      name: Get ResourceGroup Entity Details
      input:
        ref: resource:${{ parameters.namespace }}/${{ parameters.rgname }}

    - action: nestle:backstage:variablizer
      id: variablizer-umi-federation
      name: Sets Variables
      each: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('umi-federation', true) }}
      input:
        variables:
          umiFederationClientId: ${{ each.value.client_id | string }}
          umiFederationName: ${{ each.value.name | string }}
          umiFederationObjectId: ${{ each.value.principal_id }}

    - id: foundry-agent-service-pipeline-run
      action: github:actions:dispatch-with-response
      name: ADI Foundry Github Action
      input:
        repoUrl: github.com?repo=adifoundry-automation&owner=nestle-it
        workflowId: agent-capability-deploy.yml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 1200
        workflowInputs:
          environment: ${{ parameters.environment }}
          capability: ${{ parameters.capability }}
          segment: ${{ parameters.segment }}
          location: ${{ parameters.location }}
          appName: ${{ parameters.appName }}
          builderAADgroup: ${{ steps['get-aad-objectid-agentbuilder'].output.groupObjectId }}
          readerAADgroup: ${{ steps['get-aad-objectid-projectreader'].output.groupObjectId }}
          consumerAADgroup: ${{ steps['get-aad-objectid-agentconsumer'].output.groupObjectId }}
          agentmgrAADgroup: ${{ steps['get-aad-objectid-agentmgr'].output.groupObjectId }}
          tagsJson: ${{ steps.deserialise.output.content | string }}
          umiObjectId: ${{ steps['variablizer-umi-federation'].output.umiFederationObjectId | string }}
          snowNumber: ${{ parameters.request }}

    - id: github-team-create
      action: github:teams:create
      if: ${{ parameters.capability == 'hostedagent' }}
      name: Create GitHub Team(s)
      each:
        [
          "${{ steps['variablizer-repo'].output.name }}-admin",
          "${{ steps['variablizer-repo'].output.name }}-write",
        ]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        maintainers:
          [
            "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}",
            "manikandan.kamaraj@xs.nestle.com",
          ]
        teamName: ${{ each.value }}

    - id: github-repo-get
      action: github:repo:get
      if: ${{ parameters.capability == 'hostedagent' }}
      name: Get GitHub Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}

    - action: fetch:template
      id: fetch-template
      if: ${{ true if(parameters.capability == 'hostedagent' and parameters.githubreporequired) }}
      name: Fetch Template Repository
      input:
        url: https://github.com/nestle-it/adifoundry-hostedagent-template/tree/main
        targetPath: content
        values:
          runner: ${{ ['self-hosted', 'Linux', 'X64'] if steps['variablizer-repo'].output.organization == 'nestle-it' else 'nams-gh-managed-linux-small' }}
          teamName: ${{ steps['variablizer-repo'].output.name | string }}
        templateFileExtension: true
        replace: true

    - id: github-repository-create
      action: publish:github
      name: Create GitHub Repository
      if: ${{ true if (steps['github-repo-get'].output.exists == false and parameters.githubreporequired and parameters.capability == 'hostedagent') }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        sourcePath: content
        defaultBranch: main
        description: Templated repository created by Backstage.
        repoVisibility: ${{ parameters.visibility }}
        customProperties:
          cost-center-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          apm-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}

    - action: github:environment:create
      name: Create Environment
      if: ${{ parameters.capability == 'hostedagent' }}
      each: ["${{ parameters.environment }}"]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        name: ${{ each.value }}

    - action: github:environment:configuration:create
      name: Create or Update Environment Configurations - Common
      if: ${{ parameters.capability == 'hostedagent' }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        environment: ${{ parameters.environment }}
        environmentVariables:
          CLIENT_ID: ${{ steps['variablizer-umi-federation'].output.umiFederationClientId | string }}
          # FOUNDRY_PROJECT_ENDPOINT: 
          SUBSCRIPTION_ID: ${{ parameters.subid }}
          TENANT_ID: ${{ parameters.tenantid }}

    - action: github:branch-protection:create
      name: Setup Branch Protection
      if: ${{ parameters.capability == 'hostedagent' }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        enforceAdmins: true
        requiredConversationResolution: true
        requireCodeOwnerReviews: true
        requiredApprovingReviewCount: 1

    - id: github-team-associate
      action: github:teams:add-team-to-repository
      if: ${{ true if(steps['github-repo-get'].output.exists == false and parameters.capability == 'hostedagent') }}
      name: Add GitHub Team(s) to Repository
      each:
        [
          "${{ steps['variablizer-repo'].output.name }}-admin",
          "${{ steps['variablizer-repo'].output.name }}-write",
        ]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        slug: ${{ steps['github-team-create'].output.slug[each.key] }}


  output:
    text:
      - title: Message
        content: |
          ## Foundry project has been created
          **Foundry Project Name:** glbl-${{ parameters.environment }}-${{ parameters.appName }}-prj-${{ (parameters.location == "europe" and "euwe") }}-cgs

          Please login to `ai.azure.com` after 5 min to use above foundry project

          **Github Repo URL(if opted to create hosted-agent capability):** github.com/${{ steps['variablizer-repo'].output.organization }}/${{ steps['variablizer-repo'].output.name }}
