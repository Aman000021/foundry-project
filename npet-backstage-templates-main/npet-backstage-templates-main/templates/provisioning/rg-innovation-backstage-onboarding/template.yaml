---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-resource-group-onboarding-innovation
  title: Create Resource Group Onboarding Innovation using Terraform
  description: |
    Execute Terraform onboarding with user inputs, no repo creation
    
    ## 📋 Documentation & Architecture
    
    **📖 Complete documentation and architecture diagrams:** [View in Confluence](https://nestle.atlassian.net/wiki/spaces/ITINN/pages/287712681/HOW-TO+Request+a+Resource+Group+Deployment+in+Azure+via+Backstage)
    
    **🌐 Network and Services Platform Hub:** [View in Confluence](https://nestle.atlassian.net/wiki/spaces/ITINN/pages/345476138/Network+and+Services+Platform)
    

  annotations:
    nestle.com/template-visibility: private
  tags:
    - terraform
    - onboarding
spec:
  owner: group:default/AAD-SG-backstage-innovation
  type: cloud-template

  parameters:
    - title: System Association
      required:
        - ref
      properties:
        ref:
          title: Parent System
          description: System to associate this Resource Group to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
              
    - title: Resource Group Configuration
      required:
        - location
        - solution
        - environment
        - owner
        - object_id
        - subnet_mask
        - create_storage
        - disclaimer_agreement
      properties:
        location:
          title: Azure Region
          type: string
          description: "Select the Azure region to deploy resources."
          enum:
            - westeurope
            - northeurope
            - eastus
            - eastus2
            - centralus
            - australiaeast
            - australiacentral
            - spaincentral
        solution:
          title: Solution Name
          type: string
          description: "Specify the solution or project name."
        context:
          title: Context
          type: string
          description: "Provide the context for the deployment (Optional)."
          default: ""
        environment:
          title: Environment
          type: string
          description: "Choose the deployment environment."
          enum:
            - data_exploration
            - development
            - innovation
            - integration
            - non_production
            - pre_production
            - production
            - sandbox
            - staging
            - test
        index:
          title: Index
          type: string
          description: "Enter a 3-digit index for identification (Optional). Example: 001."
          default: ""
        owner:
          title: Owner Email
          type: string
          description: "Enter the email of the resource group owner."
        object_id:
          title: Azure User Object ID
          type: string
          description: "Enter your Azure user object ID."
        subnet_mask:
          title: Network Size (Subnet Mask)
          type: string
          description: "Select the network size - the system will automatically assign an available CIDR block"
          enum:
            - "/16"
            - "/20"
            - "/24"
            - "/28"
        create_storage:
          title: Create Storage Account
          type: string
          description: "Create a storage account with the resource group."
          enum:
            - "true"
            - "false"
          default: "false"
          ui:options:
            enumNames:
              - "Yes"
              - "No"
        disclaimer_agreement:
          title: Important Notice - Support Agreement
          type: boolean
          description: |
            **IMPORTANT DISCLAIMER** 

            By checking this box, I acknowledge and agree that:

            • I understand that this deployment process may take up to 5 minutes to complete
            • The system will automatically assign an available CIDR block based on my selected network size
            • If I do not see my Resource Group created in the Azure Portal within 5 minutes after successful deployment, I will contact **AlexandruIonut.Stoian@nestle.com** for support
            • I have verified all the configuration parameters above are correct
            • I understand that the assigned CIDR will be registered to prevent future conflicts

            **I have read and agree to the above terms and conditions**
          default: false
          
  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - id: triggerGitHubActions
      name: Trigger Terraform GitHub Actions Workflow
      action: github:actions:dispatch-with-response
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        repoUrl: github.com?repo=itinnovation-backstage-onboarding&owner=nestle-it
        workflowId: onboarding-deployment.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 1800
        workflowInputs:
          config_as_json: |
            {
              "location": "${{ parameters.location }}",
              "solution": "${{ parameters.solution }}",
              "context": "${{ parameters.context }}",
              "environment": "${{ parameters.environment }}",
              "index": "${{ parameters.index }}",
              "owner": "${{ parameters.owner }}",
              "object_id": "${{ parameters.object_id }}",
              "subnet_mask": "${{ parameters.subnet_mask }}",
              "create_storage": "${{ parameters.create_storage }}",
              "cost center": "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}",
              "cost plan": "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-plan') }}",
              "apm id": "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}"
            }

    - id: create-resource-yaml
      name: Scaffold Resource YAML for Catalog
      action: fetch:template:file
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        url: ./content/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ parameters.ref.split('/')[1] }}/resources/glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}${{ parameters.context and "-" + parameters.context or "" }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}${{ parameters.index or "" }}-rgp.yaml
        values:
          name: >-
            glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}${{ parameters.context and "-" + parameters.context or "" }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}${{ parameters.index or "" }}-rgp
          description: "Resource Group created via Backstage Innovation Onboarding"
          visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: resource-group
          owner: ${{ steps['system-entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: ${{ parameters.ref }}
          annotations:
            - key: nestle.com/resource-type
              value: resource-group
            - key: nestle.com/parent-system
              value: ${{ parameters.ref }}
            - key: nestle.com/region
              value: ${{ parameters.location }}
            - key: nestle.com/environment
              value: ${{ parameters.environment }}
            - key: nestle.com/solution
              value: ${{ parameters.solution }}
            - key: nestle.com/subnet-mask
              value: ${{ parameters.subnet_mask }}

    - id: publish-resource
      name: Create PR in Catalog Repo
      action: publish:github:pull-request
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-catalog
        branchName: >-
          rg-innovation-${{ parameters.solution }}-${{ parameters.environment }}
        title: >-
          Resource Group - Innovation Onboarding - ${{ parameters.solution }}
        description: "Backstage Resource registration for resource group created via Terraform Innovation Onboarding."
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: See Resource Group in Azure Portal
        icon: dashboard
        url: 'https://portal.azure.com/#@nestle.com/resource/subscriptions/browse/resourcegroups/glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}${{ parameters.context and "-" + parameters.context or "" }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}${{ parameters.index or "" }}-rgp/overview'
      - title: Catalog Pull Request
        url: ${{ steps['publish-resource'].output.remoteUrl }}
      - title: Summary
        content: |
          ## ✅ Resource Group Deployment Initiated

          Your Azure Resource Group has been successfully submitted for provisioning via Terraform.

          | Field                  | Value                          |
          |------------------------|--------------------------------|
          | **Solution**           | `${{ parameters.solution }}`   |
          | **Context**            | `${{ parameters.context or "N/A" }}` |
          | **Environment**        | `${{ parameters.environment }}` (`${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}`) |
          | **Region**             | `${{ parameters.location }}` (`${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}`) |
          | **Owner**              | `${{ parameters.owner }}`      |
          | **Index**              | `${{ parameters.index or "N/A" }}` |
          | **Subnet Mask**        | `${{ parameters.subnet_mask }}` |
          | **Storage Account**    | `${{ parameters.create_storage == "true" and "Yes" or "No" }}` |
          | **System**             | `${{ parameters.ref }}`        |

          > ⏳ Deployment may take up to **5 minutes** to complete.
          > If the Resource Group does not appear in the Azure Portal after 5 minutes, please contact **AlexandruIonut.Stoian@nestle.com**.