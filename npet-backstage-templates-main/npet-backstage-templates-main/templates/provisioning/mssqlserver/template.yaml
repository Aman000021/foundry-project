---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-mssqlserver
  title: Create MSSQL Server
  description: Creates a MSSQL Server and its databases in the Backstage catalog. Provisioning is handled by Crossplane via ArgoCD.
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - mssqlserver
    - azure
    - database
    - regional
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - $yaml: ../../../parameters/provisioning/regional-system-picker.yaml

    - title: Environment
      required: [environment]
      properties:
        environment:
          title: Environment
          description: Target environment for this MSSQL Server.
          type: string
          default: dv
          enum: [dv, ts, np, pp, pr]
          enumNames:
            - Development (dv)
            - Test (ts)
            - Non-Production (np)
            - Pre-Production (pp)
            - Production (pr)

    - $yaml: ../../../parameters/provisioning/mssqlserver.yaml

  steps:
    - $yaml: ../../../steps/catalog/assert-system-techlead-create.yaml

    - id: system-entity
      name: Get System Entity
      action: catalog:get:entity:data
      input:
        ref: ${{ parameters.system }}

    - $yaml: ../../../steps/provisioning/mssqlserver/resource.yaml

    - $yaml: ../../../steps/catalog/get-entities-config.yaml

    - id: catalog-pr
      name: Catalog Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
        branchName: entity-creation-mssql-${{ steps['system-entity'].output.name }}-${{ "" | now | replace(":", "-") }}
        title: Entity Creation - MSSQL Server (${{ steps['system-entity'].output.name }})
        description: Backstage MSSQL Server entity creation for system ${{ steps['system-entity'].output.name }}
        sourcePath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}
        targetPath: ${{ steps['system-entity'].output.domain.split('/')[1] }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['catalog-pr'].output.remoteUrl }}
