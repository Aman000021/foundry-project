apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-regional-system-template
  title: Backstage Regional System Creation
  description: |
    Creates a regional System in Backstage following the nbra-style pattern:
    System entity + base/keyvault/userassignedmanagedidentity Resources +
    optional GitOps repository creation with branch protection.

    The Deployment Target input selects where the workloads run. `AKS` is the
    default. `ARO` labels the base Resource of every environment listed in ARO
    Environments with `cluster-type: aro`, so the downstream automation provisions
    it on the ARO cluster. Environments left off that list stay on AKS and are
    migrated later from the Edit Regional System template.

    Environments with `Create Resource Group` enabled get their Resource Group
    created by the Resource Group pipeline first; its name, subscription and
    private endpoint subnet are then written on the System, base and keyvault
    Resources instead of being typed in.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - entities
    - create
    - regional-admin
    - aro
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - $yaml: ../../../parameters/provisioning/system-regional/identity.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/ownership.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/compliance.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/cluster.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/team.yaml

    - $yaml: ../../../parameters/provisioning/system-regional/features.yaml

  steps:
    - $yaml: ../../../steps/catalog/get-entities-config.yaml
    - $yaml: ../../../steps/provisioning/system-regional/resource-group-create.yaml
    - $yaml: ../../../steps/provisioning/system-regional/system.yaml
    - $yaml: ../../../steps/provisioning/system-regional/resource-base.yaml
    - $yaml: ../../../steps/provisioning/system-regional/resource-keyvault.yaml
    - $yaml: ../../../steps/provisioning/system-regional/resource-managedidentity.yaml
    - $yaml: ../../../steps/provisioning/system-regional/gitops-fetch.yaml
    - $yaml: ../../../steps/provisioning/system-regional/gitops-publish.yaml
    - $yaml: ../../../steps/provisioning/system-regional/gitops-branch-protection.yaml
    - $yaml: ../../../steps/provisioning/system-regional/github-team-create.yaml
    - $yaml: ../../../steps/provisioning/system-regional/github-team-add-to-gitops.yaml
    - $yaml: ../../../steps/provisioning/system-regional/github-platform-admin-add-to-gitops.yaml
    - id: publish
      name: GitHub Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
        branchName: entity-creation-${{ parameters.name }}
        title: Entity Creation - ${{ parameters.name }}
        description: Backstage ${{ parameters.name }} Entity Creation (regional system)
        sourcePath: ./${{ parameters.domain.split('/')[1] }}
        targetPath: ${{ parameters.domain.split('/')[1] }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true
    - $yaml: ../../../steps/provisioning/system-regional/entraid-groups-create.yaml
    - $yaml: ../../../steps/provisioning/system-regional/entraid-groups-populate.yaml
  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ parameters.gitopsRepoUrl if parameters.gitopsAlreadyExists else steps['gitops-publish'].output.remoteUrl }}
