apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-api-template
  title: Backstage API Creation
  description: Creates a API in Backstage.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - entities
    - create
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - $yaml: ../../../parameters/catalog/entity-metadata-common.yaml

    - $yaml: ../../../parameters/catalog/api.yaml

    - $yaml: ../../../parameters/catalog/catalog-repository.yaml

  steps:
    - $yaml: ../../../steps/catalog/api.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
