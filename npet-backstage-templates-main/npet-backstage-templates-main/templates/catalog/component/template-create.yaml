apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-component-template
  title: Backstage Component Creation
  description: Creates a Component in Backstage.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - entities
    - create
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - $yaml: ../../../parameters/catalog/entity-metadata-common.yaml

    - $yaml: ../../../parameters/catalog/component.yaml

    - $yaml: ../../../parameters/catalog/catalog-repository.yaml

  steps:
    - $yaml: ../../../steps/catalog/component.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
