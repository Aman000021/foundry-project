apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-system-template
  title: Edit Backstage System
  description: Edits Systems in Backstage.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - entities
    - edit
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - title: Update System Parameters
      required:
        - name
        - owner
        - domain
        - ownership
      properties:
        name:
          title: Name
          type: string
          ui:disabled: true
        description:
          title: Description
          type: string
        namespace:
          title: Namespace
          type: string
          description: Namespace for your entity.
          ui:disabled: true
          ui:widget: hidden
        annotations:
          title: Annotations
          description: Annotations for your entity.
          type: array
          ui:disabled: true
          ui:widget: hidden
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                title: Key
                type: string
              value:
                title: value
                type: string
        tags:
          title: Tags
          description: Tags for your entity.
          type: array
          items:
            type: string
        visibility:
          title: Entity Visibility
          type: string
          description: Visibility of the entity inside Backstage.
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private
        owner:
          title: Owner
          type: string
          description: Owner of the Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        domain:
          title: Parent Domain
          description: Parent domain of this Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Domain]
        ownership:
          title: System Ownership
          type: string
          description: |
            End-User ownership model of the System in Backstage:

            * **Fully-Managed**: The team will only have **read** access to their resources in Azure Cloud.
            * **Self-Managed**: The team will have **read/write** aspects of their resources in Azure Cloud.
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - title: Fully-Managed
              const: fully-managed
            - title: Self-Managed
              const: self-managed
        repoUrl:
          title: Repository Location
          type: string
          ui:disabled: true
          ui:widget: hidden
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - $yaml: ../../../steps/catalog/system.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
