apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-group-template
  title: Backstage Group Creation
  description: Creates Groups in Backstage.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - entities
    - create
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - $yaml: ../../../parameters/catalog/entity-metadata-common.yaml

    - title: Parameter Input
      required:
        - type
      properties:
        type:
          title: Group Type
          type: string
          description: Label to identify the type of group.
          oneOf:
            - title: Team
              const: team
            - title: Business Unit
              const: business-unit
            - title: Product Area
              const: product-area
        parent:
          title: Parent Group
          type: string
          description: Parent group of this group
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
        children:
          title: Child Groups
          type: array
          description: Child groups of this group.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [Group]
        members:
          title: Group Members
          type: array
          description: The users that are direct members of this group.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [User]

    - $yaml: ../../../parameters/catalog/catalog-repository.yaml

  steps:
    - $yaml: ../../../steps/catalog/group.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
