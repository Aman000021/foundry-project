---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: gh-copilot-increase-user-budget
  title: GitHub Copilot raise AI Credits budget
  description: |
    Add $20 budget to a GitHub Copilot AI Credits. This template is intended only for users who **already have a GitHub Copilot** license.

    If you don't have GitHub Copilot yet, riase a [request and start using it](https://nestle.service-now.com/itsp?id=nesa_itsp_sc_cat_item&sys_id=df5459d5c3dd9650be94140ed401314e)

    If your current budget is **$100**, after running this it'll become **$120**
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - end-user
    - github
    - copilot
spec:
  owner: group:default/aad-backstage-administrators
  type: github

  parameters:
    - title: Copilot Budget Parameters
      required:
        - githubUserVerification
      properties:
        targetUserEmail:
          title: Target User Email
          type: string
          description: |
            Optional. Fill this field if you want to specify the target user by email other than yourself.
        githubUserVerification:
          title: GitHub Account Status
          type: string
          ui:field: GithubUserVerification
          ui:options:
            emailField: targetUserEmail
            preventNonNestleUsers: false

  steps:
    - id: resolveInputs
      action: nestle:backstage:variablizer
      name: Resolve target user login
      input:
        variables:
          selectedEmail: ${{ parameters.targetUserEmail if parameters.targetUserEmail and parameters.targetUserEmail.trim() else user.entity.spec.profile.email }}
          userLogin: ${{ parameters.targetUserEmail if parameters.targetUserEmail and parameters.targetUserEmail.trim() else user.entity.spec.profile.email }}

    - action: github:actions:dispatch-with-response
      id: call-ghe-governance
      name: Add Copilot Budget
      input:
        repoUrl: github.com?repo=ghe-governance&owner=nestle-it
        workflowId: add-copilot-user-budget.yml
        branchOrTagName: main
        workflowInputs:
          user_email: ${{ steps['resolveInputs'].output.userLogin }}
          add_budget_amount: '20'
        waitForActionCompletion: true
        timeout: 1800

  output:
    links:
      - title: Check your GitHub Copilot Budget increase
        url: https://github.com/settings/copilot/features
      - title: Guide for better usage of GitHub Copilot AI Credits
        url: https://glbl-pr-agiledevops-docs-euwe-app.azurewebsites.net/GitHub-Enterprise/github-copilot-new-billing-system/#the-behavior-shift
    text:
      - title: Budget raised by $20 in AI Credits
        content: |
          Added **$20** on top of the current AI Credits for the user **${{ steps['resolveInputs'].output.userLogin }}**.
          
          Read our recommendation on the best usage of GitHub Copilot AI Credits [here](https://glbl-pr-agiledevops-docs-euwe-app.azurewebsites.net/GitHub-Enterprise/github-copilot-new-billing-system/#the-behavior-shift).

          Make sure your Line Manager is aware of this change as it may impact your team's budget and billing.
          
          All expenses from GitHub are charged back to your cost center, including GitHub Copilot.
