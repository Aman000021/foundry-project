---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: publish-techdocs-directly
  title: Publish TechDocs Directly for Migrated ADO Repo
  description: Action to publish TechDocs directly for a migrated Azure DevOps repository to GitHub
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - github
    - azure
spec:
  owner: group:default/aad-backstage-administrators
  type: service

  parameters:
    - title: Azure Devops Repo Information
      ui:order:
        - backstageSystem
        - ADOOrganization
        - ADOProject
        - ADORepo
        - userEmail
        - userID
        - hash
        - includeExampleDocs
      properties:
        ADOOrganization:
          title: ADO Organization
          type: string
          description: Enter the name of your Azure DevOps organization
        ADOProject:
          title: ADO Project
          type: string
          description: Enter the name of your Azure DevOps project
        ADORepo:
          title: ADO Repository
          type: string
          description: Enter the name of the repository you want to migrate
        backstageSystem:
          title: System
          type: string
          description: Select the system you want the migrated repo to belong to
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: System
        userEmail:
          title: User Email
          type: string
          description: Enter email (DEVELOPMENT ONLY, GATHER AUTOMATICALLY IN PRODUCTION)
        userID:
          title: User ID
          type: string
          description: Enter user ID (DEVELOPMENT ONLY, GATHER AUTOMATICALLY IN PRODUCTION)
        hash:
          title: Hash
          type: string
          description: Enter the hash value for the migration (DEVELOPMENT ONLY)
        includeExampleDocs:
          title: Include sample documentation
          type: boolean
          description: Include sample documentation files to help get started (TESTING ONLY)
          default: true
      required:
        - ADOOrganization
        - ADOProject
        - ADORepo
        - backstageSystem
        - userEmail
        - userID
        - includeExampleDocs
        - hash
  steps:
    - action: nestle:backstage:variablizer
      id: variablizer-repo
      name: Sets Repository Variables
      input:
        variables:
          # example: DRY-RUN-ADLP-Starter-Kit-dashboard-app-f5ff7aa2-c4e3-4bc9-8d79-0afd3ceca1d5
          repositoryName: DRY-RUN-${{ parameters.ADOProject }}-${{ parameters.ADORepo }}-${{ parameters.hash }}
          # assume same as for ADO
          organization: ${{ parameters.ADOOrganization }}
          # format differs from needed for publish:github:pull-request
          # should be: github.com/org/repo
          # example: https://github.com/nestle-devtest/DRY-RUN-ADLP-Starter-Kit-dashboard-app-52846be3-68d8-4778-a174-9d15988f9d43.git
          repoUrl: https://github.com/${{ parameters.ADOOrganization }}/DRY-RUN-${{ parameters.ADOProject }}-${{ parameters.ADORepo }}-${{ parameters.hash }}.git
          repositoryDisplayName: DRY-RUN-${{ parameters.ADOProject }}-${{ parameters.ADORepo }}-${{ parameters.hash }}

    - id: fetch
      name: Fetch TechDocs Configuration
      action: fetch:template
      input:
        url: https://github.com/nestle-devtest/npet-backstage-templates/tree/main/templates/provisioning/onboard-techdocs/content
        targetPath: ./
        values:
          name: ${{ steps['variablizer-repo'].output.repositoryName }}
          title: ${{ steps['variablizer-repo'].output.repositoryDisplayName }}
          description: Documentation for ${{ steps['variablizer-repo'].output.repositoryDisplayName }}
          siteName: ${{ steps['variablizer-repo'].output.repositoryDisplayName }}
          siteDescription: Documentation for ${{ steps['variablizer-repo'].output.repositoryDisplayName }}
          includeExampleDocs: ${{ parameters.includeExampleDocs }}
          orgName: ${{ steps['variablizer-repo'].output.organization }}
          repoName: ${{ steps['variablizer-repo'].output.repositoryName }}
          owner: ${{ steps['system-entity'].output.owner }}
          system: ${{ parameters.systemRef }}
        templateFileExtension: true
        replace: true

    - id: github-push
      name: Push Techdocs to GitHub
      action: github:extras:push
      input:
        repoUrl: ${{ steps['variablizer-repo'].output.repoUrl }}
        workingDirectory: .
        gitCommitMessage: "🚀 Onboard TechDocs"
        gitAuthorName: Nestle Backstage
        gitAuthorEmail: backstage@nestle.com

  output:
    text:
      - title: Migration Workflow URL
        content: |
          "URL to workflow for the migration: ${{ steps.actionDispatch.output.workflowUrl }}"
                    🎉 **TechDocs Created!**
          
          Tech docs have been successfully added to the main branch of the migrated repository.