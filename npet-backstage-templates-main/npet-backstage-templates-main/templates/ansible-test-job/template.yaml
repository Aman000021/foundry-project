apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ansible-test-job
  title: Install OCP on VMware - AMS
  description: Pre-check for remote invocation in preparation for OpenShift VMware installation
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - ansible
    - end-user
    - ocp
    - vmware
spec:
  owner: group:default/aad-backstage-administrators
  type: service

  parameters:
    - title: OCP Cluster Configuration
      required:
        - ocpClusterName
      properties:
        ocpClusterName:
          title: OCP Cluster Name
          type: string
          description: Name of the OpenShift cluster (e.g., nsamsocp01)
          ui:help: Enter the OCP cluster name that will be validated

  steps:
    - id: log-start
      name: Log Template Execution Start
      action: debug:log
      input:
        message: |
          ========================================
          Starting Ansible Job Template Execution
          ========================================
          Job Template: Precheck install-OCP-on-VMware (ID: 482)
          OCP Cluster Name: ${{ parameters.ocpClusterName }}
          Timestamp: ${{ '' | now }}
          ========================================

    - id: launch-ansible-job
      name: Launch Ansible Job
      action: rhaap:launch-job-template
      input:
        values:
          template: "Install OCP on VMware - AMS"
          extraVariables:
            ocp_cluster_name: ${{ parameters.ocpClusterName }}

    - id: log-result
      name: Log Job Launch Result
      action: debug:log
      input:
        message: |
          ========================================
          Ansible Job Launched Successfully
          ========================================
          Job ID: ${{ steps['launch-ansible-job'].output.data.id }}
          Job Status: ${{ steps['launch-ansible-job'].output.data.status }}
          Job URL: ${{ steps['launch-ansible-job'].output.data.url }}
          ========================================

  output:
    links:
      - title: View Job in AAP
        url: ${{ steps['launch-ansible-job'].output.data.url }}
        icon: dashboard
    text:
      - title: Job ID
        content: ${{ steps['launch-ansible-job'].output.data.id }}
      - title: Job Status
        content: ${{ steps['launch-ansible-job'].output.data.status }}
