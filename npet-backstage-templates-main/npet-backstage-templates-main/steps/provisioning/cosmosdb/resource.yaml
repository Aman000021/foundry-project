- id: fetch-resource-cosmosdb
  action: fetch:template:file
  name: Template Resource Payload — cosmosdb
  each: ${{ parameters.environments }}
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}-${{ each.value }}-${{ steps['system-entity'].output.name }}-cdb.yaml
    values:
      name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}-${{ each.value }}-${{ steps['system-entity'].output.name }}-cdb
      namespace: ${{ steps['system-entity'].output.name }}
      description: cosmosdb-account resource owned by system ${{ steps['system-entity'].output.name }} (${{ each.value }})
      visibility: private
      type: cosmosdb-account
      owner: ${{ steps['system-entity'].output.owner }}
      domain: ${{ steps['system-entity'].output.domain }}
      system: system:${{ steps['system-entity'].output.namespace }}/${{ steps['system-entity'].output.name }}
      resourceProperties: {}
      resourceTags: {}
      annotations:
        - key: br.nestle.com/created-at
          value: ${{ "" | now }}
        - key: br.nestle.com/environment
          value: ${{ each.value }}
        - key: br.nestle.com/domain
          value: ${{ steps['system-entity'].output.name.split('-')[0] }}
        - key: nestle.com/system-type
          value: regional
        - key: br.nestle.com/children
          value: ${{ parameters.cosmosDB | dump }}
      tags: []
      links: []
      dependsOn: []
      dependencyOf: []
