- id: create-mssqlserver-yaml
  name: Scaffold MSSQL Server YAML
  action: fetch:template:file
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-usea-sqs.yaml
    values:
      name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-usea-sqs
      namespace: ${{ steps['system-entity'].output.name }}
      description: MSSQL Server for system ${{ steps['system-entity'].output.name }} (${{ parameters.environment }})
      visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
      type: mssqlserver
      owner: ${{ steps['system-entity'].output.owner }}
      domain: ${{ steps['system-entity'].output.domain }}
      system: system:${{ steps['system-entity'].output.namespace }}/${{ steps['system-entity'].output.name }}
      resourceProperties: {}
      resourceTags: {}
      annotations:
        - key: nestle.com/resource-type
          value: mssqlserver
        - key: nestle.com/scope
          value: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
        - key: nestle.com/environment
          value: ${{ parameters.environment }}
        - key: nestle.com/region
          value: usea
        - key: nestle.com/system-type
          value: regional
        - key: br.nestle.com/domain
          value: ${{ steps['system-entity'].output.name.split('-')[0] }}
        - key: br.nestle.com/environment
          value: ${{ parameters.environment }}
        - key: br.nestle.com/created-at
          value: ${{ "" | now }}
      tags: []
      links: []
      dependsOn: []
      dependencyOf: []

- id: create-mssqldatabase-yaml
  name: Scaffold MSSQL Database YAMLs
  each: ${{ parameters.mssqldatabases }}
  action: fetch:template:file
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-${{ each.value.name }}-sqd.yaml
    values:
      name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-${{ each.value.name }}-sqd
      namespace: ${{ steps['system-entity'].output.name }}
      description: MSSQL Database ${{ each.value.name }} for system ${{ steps['system-entity'].output.name }} (${{ parameters.environment }})
      visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
      type: mssqldatabase
      owner: ${{ steps['system-entity'].output.owner }}
      domain: ${{ steps['system-entity'].output.domain }}
      system: system:${{ steps['system-entity'].output.namespace }}/${{ steps['system-entity'].output.name }}
      resourceProperties: {}
      resourceTags: {}
      annotations:
        - key: nestle.com/system-type
          value: regional
        - key: br.nestle.com/domain
          value: ${{ steps['system-entity'].output.name.split('-')[0] }}
        - key: br.nestle.com/environment
          value: ${{ parameters.environment }}
        - key: br.nestle.com/sku-name
          value: GP_S_Gen5_${{ each.value.storage }}
        - key: br.nestle.com/min-capacity
          value: "0.5"
        - key: br.nestle.com/auto-pause-delay-in-minutes
          value: "60"
        - key: br.nestle.com/collation
          value: SQL_Latin1_General_CP1_CI_AS
        - key: br.nestle.com/mssqlserver
          value: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-usea-sqs
        - key: br.nestle.com/created-at
          value: ${{ "" | now }}
      tags: []
      links: []
      dependsOn:
        - resource:${{ steps['system-entity'].output.name }}/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ parameters.environment }}-${{ steps['system-entity'].output.name | replace('-', '') }}-usea-sqs
      dependencyOf: []
