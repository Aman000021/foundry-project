id: publishEntitiesPr
name: Create Promotion Pull Request
description: Open a PR with promoted entity files
action: publish:github:pull-request
input:
  repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
  branchName: promote-environment-${{ "" | now | replace(":", "-") }}
  title: "Promote system entities - ${{ parameters.systemToBePromoted.split('/')[1] }}"
  description: "Promote environment changes generated by Backstage for ${{ parameters.systemToBePromoted }}"
  sourcePath: ./entities
  targetPath: .
  gitAuthorName: ${{ user.entity.metadata.name if user.entity.metadata.name else 'backstage-bot' }}
  gitAuthorEmail: ${{ user.entity.spec.profile.email if user.entity.spec.profile.email else 'backstage-bot@nestle.com' }}
  update: true
