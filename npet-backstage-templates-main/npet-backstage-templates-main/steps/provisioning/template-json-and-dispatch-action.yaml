- id: fetch-payload
  action: fetch:template:file
  name: Template Payload
  input:
    url: ./content/request-payload.njk
    targetPath: ./tmp/request-payload.njk
    values:
      apmId: ${{ parameters.apmId }}
      teamName: ${{ parameters.teamName }}
      solutionName: ${{ parameters.solutionName }}
      context: ${{ parameters.context }}
      market: ${{ parameters.market }}
      functionalOwner: ${{ parameters.functionalOwner }}
      technicalOwner: ${{ parameters.technicalOwner }}
      region: ${{ parameters.region }}
      network: ${{ parameters.network }}
      dataClassification: ${{ parameters.dataClassification }}
      environments: ${{ parameters.environments }}

- id: write-workspace-directory
  action: debug:log
  name: List the workspace directory with file contents
  input:
    listWorkspace: with-contents

- id: deserialise
  action: nestle:fs:json:parse
  name: Parse File
  input:
    path: ./tmp/request-payload.njk

- action: github:actions:dispatch
  name: DryRun - Dispatch Github Action
  if: ${{ parameters.dryRun }}
  input:
    # Smoke Tests
    repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-validation
    branchOrTagName: main
    workflowId: provisioning_workflow.yaml
    workflowInputs:
      variables: ${{ steps.deserialise.output.content | string }}

- action: github:actions:dispatch
  name: Dispatch Github Action
  if: ${{ not parameters.dryRun }}
  input:
    # Production
    repoUrl: github.com?owner=nestle-it&repo=iac-npet
    branchOrTagName: feat/service_now_dev
    workflowId: Centralized_Provisioning_Workflow.yml
    workflowInputs:
      variables: ${{ steps.deserialise.output.content | string }}

- action: fs:delete
  name: Delete files
  input:
    files:
      - ./tmp/request-payload.njk
