# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
# and the github-team-create steps of steps/provisioning/system-core-smanager/github-team-create.yaml
- id: gitops-add-team-core
  if: ${{ parameters.createGitHubTeam }}
  name: Add Core GitHub Team to Core GitOps Repository
  description: Grant the core team write access to the core GitOps repository.
  action: github:teams:add-team-to-repository
  input:
    slug: ${{ steps['github-team-create-core'].output.slug }}
    repoUrl: github.com?owner=${{ parameters.coreGitopsRepoUrl.split('/')[3] if parameters.gitopsAlreadyExists else steps.getEntitiesConfig.output.entities.owner }}&repo=${{ (parameters.coreGitopsRepoUrl.split('/')[4] | replace('.git', '')) if parameters.gitopsAlreadyExists else (parameters.scope + '-' + parameters.name + '-core-gitops') }}
    permission: push

- id: gitops-add-team-smanager
  if: ${{ parameters.createGitHubTeam }}
  name: Add Smanager GitHub Team to Smanager GitOps Repository
  description: Grant the smanager team write access to the smanager GitOps repository.
  action: github:teams:add-team-to-repository
  input:
    slug: ${{ steps['github-team-create-smanager'].output.slug }}
    repoUrl: github.com?owner=${{ parameters.smanagerGitopsRepoUrl.split('/')[3] if parameters.gitopsAlreadyExists else steps.getEntitiesConfig.output.entities.owner }}&repo=${{ (parameters.smanagerGitopsRepoUrl.split('/')[4] | replace('.git', '')) if parameters.gitopsAlreadyExists else (parameters.scope + '-' + parameters.name + '-smanager-gitops') }}
    permission: push

- id: gitops-add-platform-admin-team-core
  name: Add Platform Admin Team to Core GitOps Repository
  description: Grant the br-nbra-platform-admin team admin access to the core GitOps repository.
  action: github:teams:add-team-to-repository
  input:
    slug: br-nbra-platform-admin
    repoUrl: github.com?owner=${{ parameters.coreGitopsRepoUrl.split('/')[3] if parameters.gitopsAlreadyExists else steps.getEntitiesConfig.output.entities.owner }}&repo=${{ (parameters.coreGitopsRepoUrl.split('/')[4] | replace('.git', '')) if parameters.gitopsAlreadyExists else (parameters.scope + '-' + parameters.name + '-core-gitops') }}
    permission: admin

- id: gitops-add-platform-admin-team-smanager
  name: Add Platform Admin Team to Smanager GitOps Repository
  description: Grant the br-nbra-platform-admin team admin access to the smanager GitOps repository.
  action: github:teams:add-team-to-repository
  input:
    slug: br-nbra-platform-admin
    repoUrl: github.com?owner=${{ parameters.smanagerGitopsRepoUrl.split('/')[3] if parameters.gitopsAlreadyExists else steps.getEntitiesConfig.output.entities.owner }}&repo=${{ (parameters.smanagerGitopsRepoUrl.split('/')[4] | replace('.git', '')) if parameters.gitopsAlreadyExists else (parameters.scope + '-' + parameters.name + '-smanager-gitops') }}
    permission: admin
