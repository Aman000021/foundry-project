- id: fetch-resource-agent-sandbox
  action: fetch:template:file
  name: Template Resource Payload — agent-sandbox
  each: ${{ parameters.environments }}
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}-${{ each.value }}-${{ steps['system-entity'].output.name | replace('-', '') }}-sbx.yaml
    values:
      name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}-${{ each.value }}-${{ steps['system-entity'].output.name | replace('-', '') }}-sbx
      namespace: ${{ steps['system-entity'].output.name }}
      description: agent sandbox resource owned by system ${{ steps['system-entity'].output.name }} (${{ each.value }})
      visibility: private
      type: agent-sandbox
      owner: ${{ steps['system-entity'].output.owner }}
      domain: ${{ steps['system-entity'].output.domain }}
      system: system:${{ steps['system-entity'].output.namespace }}/${{ steps['system-entity'].output.name }}
      resourceProperties: {}
      resourceTags: {}
      annotations:
        - key: br.nestle.com/created-at
          value: ${{ "" | now }}
        - key: br.nestle.com/environment
          value: ${{ each.value }}
        - key: br.nestle.com/domain
          value: ${{ steps['system-entity'].output.name.split('-')[0] }}
        - key: nestle.com/system-type
          value: regional
      tags:
        - sandbox
        - ai
      links: []
      dependsOn: []
      dependencyOf: []
