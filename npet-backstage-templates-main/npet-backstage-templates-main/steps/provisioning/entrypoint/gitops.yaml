# Requires a prior system-entity step in the including template (catalog:get:entity:data)
# and a cloned GitOps repository in the `gitops` working directory.
- id: write-entrypoint-gitops
  name: Create Entrypoint Manifests in GitOps
  action: roadiehq:utils:fs:write
  each: ${{ parameters.environments }}
  input:
    path: ./gitops/${{ each.value }}/${{ steps['system-entity'].output.name }}-${{ parameters.name }}.yaml
    content: |-
      name: ${{ steps['system-entity'].output.name }}-${{ parameters.name }}
      env:
        CHANGE_FOR_APP_ENV: ${{ each.value }}
