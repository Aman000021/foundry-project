title: PostgreSQL Configuration
required:
  - postgresql
properties:
  entity:
    title: PostgreSQL Resource
    description: The PostgreSQL resource being edited (set by the edit button).
    type: string
    ui:disabled: true
    ui:widget: hidden
  postgresql:
    title: PostgreSQL Settings
    type: object
    required:
      - databaseName
    properties:
      databaseName:
        title: Database Name
        description: Name of the primary PostgreSQL database to be created (e.g., myappdata).
        type: string
      plugins:
        title: Plugins
        description: Select the extensions to enable for this PostgreSQL instance.
        type: array
        items:
          type: string
          enum:
            - VECTOR
          enumNames:
            - Vector (pgvector)
        uniqueItems: true
        ui:widget: checkboxes
