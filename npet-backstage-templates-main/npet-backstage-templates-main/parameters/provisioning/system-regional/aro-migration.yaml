title: Deployment Target
required:
  - clusterType
ui:order:
  - clusterType
  - aroEnvironments
  - aroCluster
properties:
  clusterType:
    title: Deployment Target
    description: |
      Where the workloads of this System run. The deployment target is a
      per-environment fact, so environments are migrated one at a time.
      **Keep on AKS** leaves the deployment target untouched — only the features,
      tech leads and members below are updated.
      **Migrate AKS to ARO** additionally does what the creation template does for an
      ARO System: it labels the base Resource of every selected environment with
      `cluster-type: aro` and records the target ARO cluster on it.
    type: string
    default: aks
    oneOf:
      - title: Keep on AKS (no change)
        const: aks
      - title: Migrate AKS to ARO
        const: aro
dependencies:
  clusterType:
    allOf:
      - if:
          properties:
            clusterType:
              const: aro
        then:
          required:
            - aroEnvironments
            - aroCluster
          properties:
            aroEnvironments:
              title: ARO Environments
              description: |
                Environments to migrate to ARO — the base Resource of each one is labelled
                `cluster-type: aro`.
                Environments left unchecked keep running on AKS and can be migrated in a
                later run. Unchecking an already-migrated environment does not move it
                back to AKS.
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - dv
                  - ts
                  - np
                  - pp
                  - pr
                enumNames:
                  - Development (dv)
                  - Test (ts)
                  - Non-Production (np)
                  - Pre-Production (pp)
                  - Production (pr)
              ui:widget: checkboxes
            aroCluster:
              title: ARO Cluster
              description: ARO cluster the selected environments are migrated to.
              type: string
              default: nams-pr-itpsharedaro-cluster-usea-aro
              ui:disabled: true
