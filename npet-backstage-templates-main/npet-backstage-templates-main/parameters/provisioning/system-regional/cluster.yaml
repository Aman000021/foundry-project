title: Cluster, Environments and Azure Resources
required:
  - clusterType
  - cluster
  - environments
ui:order:
  - clusterType
  - cluster
  - aroCluster
  - region
  - tenant
  - environments
  - aroEnvironments
properties:
  clusterType:
    title: Deployment Target
    description: |
      Where the workloads of this System will run.
      **AKS** keeps the default behaviour — the base Resource is provisioned on the
      selected AKS cluster.
      **ARO** provisions the System on the Azure Red Hat OpenShift cluster instead:
      the base Resource of every ARO environment is labelled `cluster-type: aro`.
    type: string
    default: aks
    oneOf:
      - title: AKS (default)
        const: aks
      - title: ARO (Azure Red Hat OpenShift)
        const: aro
  cluster:
    title: Cluster
    description: |
      Kubernetes cluster where applications will be deployed.
      When the Deployment Target is **ARO** this is the fallback AKS cluster used by
      the environments that stay on AKS.
    type: string
    default: generic-ams
    enum:
      - adi
      - aimaint-core
      - connectplace-core
      - generic-ams
      - generic-sharedbr
      - innoplay-core
      - itsa-core
      - promotactic-core
      - shared-legacy
      - techprod-core
      - vsa
  region:
    title: Resource Group Region
    description: |
      Azure region the Resource Groups are created in. Only used by the environments
      below that have **Create Resource Group** enabled.
    type: string
    default: usea
    oneOf:
      - title: East US
        const: usea
      - title: West Europe
        const: euwe
      - title: SouthEast Asia
        const: asse
  tenant:
    title: Resource Group Tenant
    description: |
      Azure tenant the Resource Groups are created in. Only used by the environments
      below that have **Create Resource Group** enabled.
    type: string
    default: nestle.onmicrosoft.com
    oneOf:
      - title: NestlePROD
        const: nestle.onmicrosoft.com
      - title: NestleDEV
        const: nestlew2k.onmicrosoft.com
      - title: NestleINT
        const: nestleint.onmicrosoft.com
      - title: NestleCHINA
        const: nestlebj.partner.onmschina.cn
  environments:
    title: Environments
    description: |
      Per-environment configuration. At least one environment is required.
      Enable **Create Resource Group** to have the Resource Group created by the Resource
      Group pipeline — its name, subscription and private endpoint subnet are then filled
      in automatically. Otherwise Subscription and Resource Group are mandatory;
      AppSecurityGroup and SubnetId are optional.
      A base resource, keyvault and managed identity will be created for each configured environment.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required:
        - name
      properties:
        name:
          title: Environment
          type: string
          enum:
            - dv
            - ts
            - np
            - pp
            - pr
          enumNames:
            - Development (dv)
            - Test (ts)
            - Non-Production (np)
            - Pre-Production (pp)
            - Production (pr)
        createResourceGroup:
          title: Create Resource Group
          description: Create the Resource Group of this environment with the Resource Group pipeline.
          type: boolean
          default: false
        appSecurityGroup:
          title: App Security Group
          type: string
          description: "Azure App Security Group name (optional)"
      dependencies:
        createResourceGroup:
          allOf:
            - if:
                properties:
                  createResourceGroup:
                    const: false
              then:
                required:
                  - subscription
                  - resourceGroup
                properties:
                  subscription:
                    title: Subscription
                    type: string
                    description: "Azure subscription for this environment"
                    enum:
                      - nams-np-adi-001-sub
                      - nams-np-informationtechnology-001-sub
                      - nams-np-marketingsalesandebusiness-001-sub
                      - nams-pr-adi-001-sub
                      - nams-pr-informationtechnology-001-sub
                      - nams-pr-marketingsalesandebusiness-001-sub
                  resourceGroup:
                    title: Resource Group
                    type: string
                    description: "Azure Resource Group name (e.g., nams-dv-analytics-datalab-rg)"
                  subnetId:
                    title: Subnet ID
                    type: string
                    description: "Azure Subnet resource ID (optional, e.g., /subscriptions/<guid>/resourceGroups/<rg>/providers/Microsoft.Network/virtualNetworks/<vnet>/subnets/<subnet>)"
                    pattern: '^/subscriptions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/resourceGroups/[^/]+/providers/Microsoft\.Network/virtualNetworks/[^/]+/subnets/[^/]+$'
                    ui:options:
                      inputProps:
                        placeholder: /subscriptions/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/resourceGroups/.../providers/Microsoft.Network/virtualNetworks/.../subnets/...
                    errorMessage: "Must be a valid Azure subnet resource ID: /subscriptions/<guid>/resourceGroups/<rg>/providers/Microsoft.Network/virtualNetworks/<vnet>/subnets/<subnet>"
dependencies:
  clusterType:
    allOf:
      - if:
          properties:
            clusterType:
              const: aro
        then:
          required:
            - aroCluster
            - aroEnvironments
          properties:
            aroCluster:
              title: ARO Cluster
              description: ARO cluster where the System namespace and ArgoCD resources are created.
              type: string
              default: nams-pr-itpsharedaro-cluster-usea-aro
              ui:disabled: true
            aroEnvironments:
              title: ARO Environments
              description: |
                Environments that run on ARO — their base Resource is labelled
                `cluster-type: aro`.
                Environments configured above but left unchecked here stay on AKS and can
                be migrated later from the Edit Regional System template.
              type: array
              default:
                - dv
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - dv
                  - ts
                  - np
                  - pp
                  - pr
                enumNames:
                  - Development (dv)
                  - Test (ts)
                  - Non-Production (np)
                  - Pre-Production (pp)
                  - Production (pr)
              ui:widget: checkboxes
