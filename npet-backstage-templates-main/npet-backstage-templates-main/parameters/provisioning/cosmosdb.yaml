title: CosmosDB Account Configuration
required:
  - cosmosDB
properties:
  entity:
    title: CosmosDB Account
    description: The CosmosDB Account resource being edited (set by the edit button).
    type: string
    ui:disabled: true
    ui:widget: hidden
  cosmosDB:
    title: Databases
    description: Define the databases and collections for this CosmosDB Account.
    type: array
    minItems: 1
    items:
      type: object
      title: Database
      required:
        - name
        - maxThroughput
      properties:
        type:
          type: string
          default: mongodatabase
          ui:widget: hidden
        name:
          title: Database Name
          description: Name of the MongoDB database (e.g., myappdata, transactions).
          type: string
        maxThroughput:
          title: Max Throughput (RU/s)
          description: Maximum throughput in Request Units per second (increments of 1000 RU/s).
          type: number
          minimum: 1000
          maximum: 12000
          multipleOf: 1000
          default: 1000
        children:
          title: Collections
          description: MongoDB collections within this database.
          type: array
          minItems: 1
          items:
            title: Collection
            type: object
            required:
              - name
            properties:
              type:
                type: string
                default: mongocollection
                ui:widget: hidden
              name:
                title: Collection Name
                description: Name of the MongoDB collection (e.g., users, orders).
                type: string
              ttlSeconds:
                title: Time to Live in Seconds for collection data. -1 Defaults to no TTL.
                type: number
                default: -1
              shardKey:
                title: Shard Key
                type: string
                ui:widget: hidden
              indexes:
                title: Indexes
                description: Database indexes for this collection.
                type: array
                items:
                  title: Index
                  type: object
                  required:
                    - keys
                  properties:
                    keys:
                      title: Index Keys
                      description: Fields to index (e.g., userId, createdAt).
                      type: array
                      items:
                        title: Field Name
                        type: string
                    unique:
                      title: Unique Constraint
                      description: Enforce uniqueness on this index.
                      type: boolean
                      default: false
