title: System
required: [system]
properties:
  system:
    title: System
    description: Regional system this resource belongs to (e.g., br-mysystem).
    type: string
    # EntityPicker (not OwnedEntityPicker): OwnedEntityPicker inlines every
    # ownership ref into the catalog GET query string, which exceeds the Akamai
    # edge request-line limit (~8KB) for users with many groups -> silent 400 ->
    # empty dropdown. Per-user narrowing already happens server-side via RBAC
    # catalog read conditions; execution is enforced by nestle:assert:system-techlead.
    ui:field: EntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        - kind: System
          metadata.annotations.nestle.com/system-type: 'regional'
