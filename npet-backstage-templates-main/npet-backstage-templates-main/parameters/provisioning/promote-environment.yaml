title: Promote System Environment Parameters
required:
  - systemToBePromoted
  - promotionType
properties:
  systemToBePromoted:
    title: System to promote
    type: string
    description: Choose the System you want to promote.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: System
  promotionType:
    title: Choose which environment you want to promote
    type: number
    ui:widget: radio
    enum:
      - 0
      - 1
      - 2
      - 3
    enumNames:
      - Promote Dev (dv) to Ts/Homol (ts)
      - Promote Dev (dv) to PreProduction (pp)
      - Promote Ts/Homol (ts) to Production (pr)
      - Promote PreProduction (pp) to Production (pr)
