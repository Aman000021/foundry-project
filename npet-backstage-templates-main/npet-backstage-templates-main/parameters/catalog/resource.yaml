title: Resource Parameters
required:
  - type
  - system
properties:
  type:
    title: Type
    type: string
    description: The type of Resource.
    oneOf:
      - title: Database
        const: database
      - title: StorageAccount
        const: storageaccount
      - title: Kubernetes Cluster
        const: kubernetes-cluster
      - title: Resource Group
        const: resource-group
  system:
    title: Parent System
    description: Parent system of this Resource.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [System]
  dependsOn:
    title: Depends On
    description: Components or Resources this Component depends on.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [Component, Resource]
  dependencyOf:
    title: Dependency Of
    description: Components or Resources this Component is a dependency of.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [Component, Resource]
