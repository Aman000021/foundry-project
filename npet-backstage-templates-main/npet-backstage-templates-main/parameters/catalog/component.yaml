title: Component Parameters
required:
  - type
  - lifecycle
  - owner
  - domain
  - system
properties:
  type:
    title: Type
    type: string
    description: The type of Component.
    oneOf:
      - title: Service
        const: service
      - title: Website
        const: website
      - title: Library
        const: library
  lifecycle:
    title: Lifecycle
    type: string
    description: The lifecycle of the Component.
    oneOf:
      - title: Experimental
        const: experimental
      - title: Production
        const: production
      - title: Deprecated
        const: deprecated
  owner:
    title: Owner
    type: string
    description: Owner of the Component.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [Group, User]
  domain:
    title: Parent Domain
    description: Parent domain of this Component.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [Domain]
  system:
    title: Parent System
    description: Parent system of this Component.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [System]
  subcomponentOf:
    title: Parent Component
    description: Parent Component of this Component.
    ui:field: OwnerPicker
    ui:options:
      catalogFilter:
        kind: [Component]
  providesApis:
    title: Provides APIs
    description: APIs this Component provides.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [API]
  consumesApis:
    title: Consumes APIs
    description: APIs this Component consumes.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [API]
  dependsOn:
    title: Depends On
    description: Components or Resources this Component depends on.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [Component, Resource]
  dependencyOf:
    title: Dependency Of
    description: Components or Resources this Component is a dependency of.
    ui:field: MultiEntityPicker
    ui:options:
      allowArbitraryValues: false
      catalogFilter:
        kind: [Component, Resource]
