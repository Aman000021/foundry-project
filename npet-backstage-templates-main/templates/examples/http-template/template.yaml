---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: HTTP-testing
  title: Http testing for post/get
  description: Testing get functionality with get
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: Parameters
      required:
        - httpGetPath
      properties:
        # example: mshafrir/2646763
        httpGetPath:
          title: Get Path
          type: string
          description: The path you want to request in a gist.
          ui:autofocus: true
          ui:options:
            rows: 5

  steps:
    - id: request
      name: Request
      action: http:backstage:request
      input:
        method: "GET"
        path: "/proxy/gist/${{ parameters.httpGetPath }}"
        headers:
          content-type: "application/json"

  output:
    text:
      - title: Response Code
        content: "Response Code: ${{ steps['request'].output.code }}"
