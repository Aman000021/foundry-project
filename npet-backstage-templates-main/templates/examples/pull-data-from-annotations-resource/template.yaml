---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: data-from-entity-annotations-resource
  title: Data From Entity Annotations - Resource
  description: GETs data from a particular Entities Annotations.
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: Parameters
      required:
        - ref
      properties:
        ref:
          title: Catalog Ref
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}
    - action: debug:log
      id: write-debug-line
      name: Output Entity data
      input:
        message: |
          Kind: ${{ steps['system-entity'].output.kind }}
          Namespace: ${{ steps['system-entity'].output.namespace }}
          Name: ${{ steps['system-entity'].output.name }}
          Owner: ${{ steps['system-entity'].output.owner }}
          resource-group-name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('resource-group-name') }}
          subscription-name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('subscription-name') }}
          subscription-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('subscription-id') }}
          aad-object-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('aad-object-id') }}
          pep-subnet-name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pep-subnet-name') }}
          virtual-network-rg: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('virtual-network-rg') }}
          virtual-network-name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('virtual-network-name') }}
          subnet: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('subnet-delegation') }}
