---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: run-github-action
  title: Run an GitHub Action
  description: Action to run a GitHub Action
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: Parameters
      required:
        - repoUrl
        - workflowId
      properties:
        workflowId:
          title: Workflow Id
          type: string
          default: "deploy.yaml"
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-validation
    - title: GitHub Action Parameters
      description: Pipeline Parameters to send to the GitHub Action.
      required:
        - environmentName
      properties:
        environmentName:
          title: Environment Name
          type: string
          default: dv
          enum:
            - dv
            - pr
        imageTag:
          title: Image Tag
          type: string

  steps:
    - action: github:actions:dispatch
      name: Dispatch Github Action Workflow with inputs
      input:
        repoUrl: ${{ parameters.repoUrl }}
        workflowId: ${{ parameters.workflowId }}
        branchOrTagName: main
        workflowInputs:
          environmentName: ${{ parameters.environmentName }}
          imageTag: ${{ parameters.imageTag }}

  output:
    text:
      - title: Pipeline Url
        content: "Pipeline Url: ${{ steps['pipeline-run'].output.pipelineUrl }}"
      - title: Pipeline Result
        content: "Pipeline Result: ${{ steps['pipeline-run'].output.pipelineResult }}"
