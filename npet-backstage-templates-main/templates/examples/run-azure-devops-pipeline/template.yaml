---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: run-ado-pipeline
  title: Run an Azure DevOps Pipeline
  description: Action to run an Azure DevOps Pipeline
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: Parameters
      required:
        - organization
        - project
        - pipelineId
      properties:
        organization:
          title: Azure DevOps Organization
          type: string
          enum:
            # - nestle-it
            - nestle-devtest
          description: Azure DevOps Organization to interact with.
        project:
          title: Azure DevOps Project
          type: string
          default: npet-backstage-validation
          description: Azure DevOps Project to interact with.
        pipelineId:
          title: Azure DevOps Pipeline ID
          type: number
          default: 575
          description: Azure DevOps Pipeline ID to interact with.
        waitForPipelineCompletion:
          title: Wait for Pipeline to Complete?
          type: boolean
    - title: Azure DevOps Pipeline Parameters
      description: Pipeline Parameters to send to the Azure DevOps pipeline.
      properties:
        pipelineParameters:
          title: Pipeline Parameters
          type: object
          properties:
            beep_or_boop:
              title: Beep or Boop?
              type: string
              enum:
                - beep
                - boop
            test:
              title: Run Tests?
              type: boolean

  steps:
    - id: pipeline-run
      name: PipelineRun
      action: azure:pipeline:run
      input:
        organization: ${{ parameters.organization }}
        project: ${{ parameters.project }}
        pipelineId: ${{ parameters.pipelineId }}
        pipelineParameters: ${{ parameters.pipelineParameters }}
        waitForPipelineCompletion: ${{ parameters.waitForPipelineCompletion }}

  output:
    text:
      - title: Pipeline Url
        content: "Pipeline Url: ${{ steps['pipeline-run'].output.pipelineUrl }}"
      - title: Pipeline Result
        content: "Pipeline Result: ${{ steps['pipeline-run'].output.pipelineResult }}"
