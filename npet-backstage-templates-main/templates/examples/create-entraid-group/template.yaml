---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-entraid-group-template
  title: Create Entra ID Group for System
  description: Creates an Entra ID group for an existing system
  annotations:
    nestle.com/template-visibility: private
  tags:
    - entra-id
    - iam
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  parameters:
    - title: System Information
      required:
        - systemRef
      properties:
        systemRef:
          title: Parent System
          description: Parent System
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.systemRef }}

    - action: nestle:backstage:variablizer
      id: variablizer
      name: Sets Variables
      input:
        variables:
          argoEntraIdName: AAD-RB-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}

    - id: entraid-group-create
      action: github:actions:dispatch-with-response
      name: Create EntraID Group
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        branchOrTagName: main
        workflowId: entra-id-group.yaml
        waitForActionCompletion: true
        timeout: 360
        workflowInputs:
          groupNames: ${{ steps['variablizer'].output.argoEntraIdName }}
          groupOwners: "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}"

  outputs:
    - title: Entra ID Group Creation Pipeline
      url: ${{ steps['entraid-group-create'].output.workflowUrl }}
