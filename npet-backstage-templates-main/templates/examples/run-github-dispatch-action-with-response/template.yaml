---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: run-github-action-with-response
  title: Run an GitHub Action with Response
  description: Action to run a GitHub Action(s)
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: examples

  steps:
    - id: entraid-group-create
      action: github:actions:dispatch-with-response
      name: Create EntraID Group(s)
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        branchOrTagName: main
        workflowId: entra-id-group.yaml
        waitForActionCompletion: true
        timeout: 360
        workflowInputs:
          groupNames: AAD-devtest-backstage-glbl-backstage-internal
          groupOwners: Brandon.Adams@nestle.com

    - id: pipeline-run
      action: github:actions:dispatch-with-response
      name: Dispatch Github Action Workflow with inputs
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        workflowId: create-sonarqube-project.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 720
        workflowInputs:
          organization: "nestle-it"
          repository: "ribamarv-sonarqube-tech"
          admins: "Brandon.Adams@nestle.com"
