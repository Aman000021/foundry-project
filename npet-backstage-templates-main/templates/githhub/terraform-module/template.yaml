---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-terraform-module
  title: Create Terraform Module
  description: Create a Terraform module repository from a template
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - end-user
    - github
    - terraform
spec:
  owner: group:default/aad-backstage-administrators
  type: github

  parameters:
    - title: GitHub Parameters
      ui:order:
        - provider
        - moduleName
        - visibility
        - environments
      properties:
        provider:
          title: Terraform Provider
          type: string
          description: The Terraform provider for this module
          ui:autofocus: true
        moduleName:
          title: Module Name
          type: string
          description: The name of the Terraform module
        visibility:
          title: Repository Visibility
          type: string
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private

  steps:
    - action: nestle:backstage-hostname-lookup
      id: hostname-lookup
      name: Hostname Lookup

    - action: nestle:backstage:variablizer
      id: variablizer-repo
      name: Sets Repository Name Variable
      input:
        variables:
          name: terraform-${{ parameters.provider }}-${{ parameters.moduleName }}
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}

    - id: github-repo-get
      action: github:repo:get
      name: Get GitHub Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}

    - action: fetch:template
      id: fetch-template
      name: Fetch Template Repository
      input:
        url: https://github.com/nestle-it/terraform-azure-sample-module/tree/main
        targetPath: content
        templateFileExtension: true
        replace: true

    - id: github-repository-create
      action: publish:github
      name: Create GitHub Repository
      if: ${{ steps['github-repo-get'].output.exists == false }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        sourcePath: content
        defaultBranch: main
        description: Templated repository created by Backstage.
        repoVisibility: ${{ parameters.visibility }}

  output:
    links:
      - title: Repository URL
        url: ${{ steps['github-repository-create'].output.remoteUrl }}
