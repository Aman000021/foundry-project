---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: devtestTakeOverTeam
  title: Devtest Take Over Team
  description: |
    Add a maintainer to an existing GitHub team that is already onboarded
    in Backstage as a Resource under a System.

    Governance model:
    - If you are an owner of the System, and the GitHub team belongs to that
      System, you can manage the team by adding maintainers.

    Prerequisites:
    - The GitHub team must already be onboarded in Backstage as an entity.
    - You must belong to the Entra ID group that owns the System the team
      belongs to.

    Use the separate "Devtest Onboard Team" template when you need
    to register a new GitHub team resource under a system.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - end-user
    - github

spec:
  owner: group:default/aad-devtest-backstage-glbl-test004-marleixo
  type: github

  parameters:
    # This template performs only one action: take over an existing team
    # by adding a maintainer. There is no mode switch anymore.
    - title: Team Context
      properties:
        parentSystem:
          title: Backstage System
          type: string
          description: Select the System that owns the onboarded GitHub team. You must be part of the Entra ID group that owns this System.
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: System
      required: [parentSystem]

    - title: Team And Maintainer
      required: [teamResource, githubUserVerification]
      properties:
        teamResource:
          title: Team
          type: string
          description: Select the GitHub team entity already onboarded in Backstage under the selected System.
          ui:field: CatalogTeamPicker
          ui:options:
            systemField: parentSystem
        newMaintainer:
          title: New maintainer (Nestle email)
          description: Enter the Nestle email of the maintainer to add. Leave blank to add yourself as maintainer.
          type: string
        githubUserVerification:
          title: GitHub Account Verification
          type: string
          description: Confirms the GitHub account for the maintainer email provided above.
          ui:field: GithubUserVerification
          ui:options:
            emailField: newMaintainer

  steps:
    # Read the selected Team resource so we can use its GitHub org + slug
    # from annotations, instead of relying on user-typed values.
    - id: teamEntityInfo
      name: Get Team Resource entity
      action: catalog:get:entity:data
      input:
        ref: resource:default/${{ parameters.teamResource }}

    # Execute the team update in GitHub by reusing the discovered team slug.
    - id: addMaintainers
      name: Add maintainer to the team
      action: github:teams:create
      input:
        repoUrl: github.com?owner=${{ steps['teamEntityInfo'].output.annotations | parseEntityAnnotations('nestle.com/github-organization') }}&repo=npet-backstage-catalog
        teamName: ${{ steps['teamEntityInfo'].output.annotations | parseEntityAnnotations('nestle.com/github-team-slug') }}
        maintainers:
          - ${{ parameters.newMaintainer if parameters.newMaintainer else user.entity.spec.profile.email }}

  output:
    links:
      - title: GitHub Team
        url: https://github.com/orgs/${{ steps['teamEntityInfo'].output.annotations | parseEntityAnnotations('nestle.com/github-organization') }}/teams/${{ steps['teamEntityInfo'].output.annotations | parseEntityAnnotations('nestle.com/github-team-slug') }}
      - title: GitHub Team Entity in Backstage Catalog
        url: /catalog/default/resource/${{ parameters.teamResource }}
      - title: Parent System
        url: /catalog/${{ parameters.parentSystem.split(':')[1].split('/')[0] }}/system/${{ parameters.parentSystem.split('/')[1] }}