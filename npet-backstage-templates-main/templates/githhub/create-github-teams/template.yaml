---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-github-teams
  title: Create GitHub Team
  description: Action to create a GitHub Team
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - end-user
    - github
spec:
  owner: group:default/aad-backstage-administrators
  type: github

  parameters:
    - title: GitHub Team Parameters
      ui:order:
        - generateNameFromSystem
        - ref
        - scope
        - solution
        - context
        - email
        - teamType
      properties:
        generateNameFromSystem:
          title: Generate Team Name(s) from System?
          type: boolean
          default: true
        teamType:
          title: Team Type to Create
          type: string
          oneOf:
            - title: Both
              const: both
            - title: Write
              const: write
            - title: Admin
              const: admin
      dependencies:
        generateNameFromSystem:
          allOf:
            - if:
                properties:
                  generateNameFromSystem:
                    const: true
              then:
                properties:
                  ref:
                    title: Parent System
                    description: Parent System
                    type: string
                    ui:field: OwnedEntityPicker
                    ui:options:
                      allowArbitraryValues: false
                      catalogFilter:
                        - kind: System
                required:
                  - ref
            - if:
                properties:
                  generateNameFromSystem:
                    const: false
              then:
                properties:
                  scope:
                    title: Scope
                    description: |
                      Scopes should match the values from the [Name Generator](https://apps.powerapps.com/play/e/default-12a3af23-a769-4654-847f-958f3d479f4a/a/a0ae55ea-696d-4223-96fb-6d5aac3980ec?tenantId=12a3af23-a769-4654-847f-958f3d479f4a&sourcetime=1745339566422&source=portal)
                    type: string
                    ui:field: IaCApiFilter
                  solution:
                    title: Solution
                    type: string
                    description: |
                      Solution Name of your GitHub Team.
                  context:
                    title: Context
                    type: string
                    description: |
                      Context Name of your GitHub Team.
                  email:
                    title: Maintainer Email
                    type: string
                    description: |
                      The email of the User to add as a Team Maintainer.
                    ui:field: ValidateNestleOwners
                required:
                  - scope
                  - solution
                  - context
                  - email

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      if: ${{ parameters.generateNameFromSystem }}
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - action: nestle:backstage-hostname-lookup
      id: hostname-lookup
      name: Hostname Lookup

    - action: nestle:backstage:variablizer
      id: variablizer
      name: Sets Variables
      input:
        variables:
          nameFromSystem: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}
          nameFromParameters: ${{ parameters.scope }}-${{ parameters.solution }}-${{ parameters.context }}
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}
          team: ${{ [ 'admin', 'write' ] if parameters.teamType === 'both' else [ parameters.teamType ] }}
          maintainer: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') if parameters.generateNameFromSystem else parameters.email }}

    - id: github-team-create
      action: github:teams:create
      name: Create GitHub Team(s)
      each: ${{ steps['variablizer'].output.team }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.nameFromSystem if parameters.generateNameFromSystem else steps['variablizer'].output.nameFromParameters }}
        maintainers: ["${{ steps['variablizer'].output.maintainer }}"]
        teamName: ${{ steps['variablizer'].output.nameFromSystem if parameters.generateNameFromSystem else steps['variablizer'].output.nameFromParameters }}-${{ each.value }}

  output:
    text:
      - title: GitHub Team URL(s)
        content: "Team URL(s): ${{ steps['github-team-create'].output.teamUrl | dump(2) }}"
