---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: devtestOnboardTeam
  title: Devtest Onboard Team
  description: |
    Onboard an existing GitHub team into Backstage under a selected System.
    This creates ownership and organization links between the team, the
    System, and related repositories.

    Prerequisites:
    - You must be a maintainer of the selected GitHub team.
    - You must belong to the Entra ID group that owns the selected System.

  annotations:
    nestle.com/template-visibility: internal
  tags:
    - end-user
    - github

spec:
  owner: group:default/aad-devtest-backstage-glbl-test004-marleixo
  type: github

  parameters:
    # This template is focused on onboarding only:
    # 1) select the target system, 2) select a GitHub team, 3) create catalog PR.
    - title: Team Onboarding
      required: [parentSystem, githubTeamSlug]
      properties:
        parentSystem:
          title: Backstage System
          type: string
          description: Select the System that will own this GitHub team in Backstage. **You must be part of the Entra ID group that owns this System.**
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: System
        githubTeamSlug:
          title: Team to onboard
          type: string
          description: Select the existing GitHub team to onboard. **You must be a maintainer of the selected team.**
          ui:field: GithubTeamPicker

  steps:
    # Read system metadata (owner/domain/visibility) for the new team resource.
    - id: systemInfo
      name: Get System entity
      action: catalog:get:entity:data
      input:
        ref: ${{ parameters.parentSystem }}

    # Normalize the selected team slug for safe file/entity naming.
    - id: resolveSlug
      name: Resolve team slug
      action: nestle:backstage:variablizer
      input:
        variables:
          slug: ${{ parameters.githubTeamSlug }}

    # Verify the team actually exists on GitHub (Dataverse may contain stale entries).
    - id: checkTeamExistsOnGithub
      name: Verify team exists on GitHub
      action: github:teams:get
      input:
        repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-catalog
        teamSlug: ${{ steps['resolveSlug'].output.slug }}

    - id: failIfTeamNotOnGithub
      action: nestle:error
      if: ${{ steps['checkTeamExistsOnGithub'].output.exists == false }}
      name: Fail if team does not exist on GitHub
      input:
        error: |
          Error: The GitHub team "${{ steps['resolveSlug'].output.slug }}" was found in Dataverse but does not exist on GitHub. It may have been deleted, or the Dataverse entry was added in some unexpected way. Please verify the team exists in GitHub and try again.

    # Render the team Resource YAML that will be proposed in catalog repo.
    - id: createTeamResourceYaml
      name: Scaffold Resource YAML
      action: fetch:template:file
      input:
        url: ../../../.templateable-content/catalog/resource.yaml.njk
        targetPath: >-
          ./catalog-content-teams/${{ steps['systemInfo'].output.domain.split('/')[1] }}/systems/${{ parameters.parentSystem.split('/')[1] }}/resources/${{ steps['resolveSlug'].output.slug }}.yaml
        values:
          name: ${{ steps['resolveSlug'].output.slug }}
          description: GitHub team onboarded to Backstage.
          visibility: ${{ steps['systemInfo'].output.annotations | parseEntityAnnotations('entity-visibility') if steps['systemInfo'].output.annotations | parseEntityAnnotations('entity-visibility') else 'internal' }}
          type: team
          owner: ${{ steps['systemInfo'].output.owner }}
          domain: ${{ steps['systemInfo'].output.domain }}
          system: ${{ parameters.parentSystem }}
          annotations:
            - key: nestle.com/parent-system
              value: ${{ parameters.parentSystem }}
            - key: nestle.com/github-organization
              value: nestle-devtest
            - key: nestle.com/github-team-slug
              value: ${{ steps['resolveSlug'].output.slug }}
          links:
            - url: https://github.com/orgs/nestle-devtest/teams/${{ steps['resolveSlug'].output.slug }}
              title: GitHub Team
              icon: github
          tags: ["github", "team"]
          dependsOn: []
          dependencyOf: []
          resourceProperties: {}
          resourceTags: {}

    # Open or update a PR in the catalog repository with the new resource file.
    - id: publishTeamResource
      name: Create PR in catalog repo
      action: publish:github:pull-request
      input:
        sourcePath: ./catalog-content-teams/${{ steps['systemInfo'].output.domain.split('/')[1] }}/systems/${{ parameters.parentSystem.split('/')[1] }}/resources
        targetPath: ${{ steps['systemInfo'].output.domain.split('/')[1] }}/systems/${{ parameters.parentSystem.split('/')[1] }}/resources
        repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-catalog
        branchName: onboard-team-${{ steps['resolveSlug'].output.slug }}
        title: Onboard GitHub team ${{ steps['resolveSlug'].output.slug }}
        description: |
          Register GitHub team `${{ steps['resolveSlug'].output.slug }}`
          as a Resource under system `${{ parameters.parentSystem }}`.
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    # Keep behavior unchanged: allow a short delay before catalog registration.
    - id: waitForPrMerge
      name: Wait for PR to be Merged
      action: debug:wait
      input:
        seconds: 20

    # Register the new resource in Backstage catalog.
    - id: registerCatalogEntities
      name: Register Team Resources in Catalog
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/nestle-devtest/npet-backstage-catalog/blob/main
        catalogInfoPath: /${{ steps['systemInfo'].output.domain.split('/')[1] }}/systems/${{ parameters.parentSystem.split('/')[1] }}/resources/${{ steps['resolveSlug'].output.slug }}.yaml
        optional: false

  output:
    links:
      - title: GitHub Team
        url: https://github.com/orgs/nestle-devtest/teams/${{ steps['resolveSlug'].output.slug }}
      - title: GitHub Team Entity in Backstage Catalog
        url: /catalog/default/resource/${{ steps['resolveSlug'].output.slug }}
      - title: Parent System
        url: /catalog/${{ parameters.parentSystem.split(':')[1].split('/')[0] }}/system/${{ parameters.parentSystem.split('/')[1] }}
