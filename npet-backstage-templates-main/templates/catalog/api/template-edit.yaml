apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-api-template
  title: Edit Backstage API
  description: Edits APIs in Backstage.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - entities
    - edit
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - title: Update System Parameters
      required:
        - name
        - owner
        - domain
        - type
        - lifecycle
        - system
      properties:
        name:
          title: Name
          type: string
          ui:disabled: true
        description:
          title: Description
          type: string
        namespace:
          title: Namespace
          type: string
          description: Namespace for your entity.
          ui:disabled: true
          ui:widget: hidden
        annotations:
          title: Annotations
          description: Annotations for your entity.
          type: array
          ui:disabled: true
          ui:widget: hidden
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                title: Key
                type: string
              value:
                title: value
                type: string
        tags:
          title: Tags
          description: Tags for your entity.
          type: array
          items:
            type: string
        visibility:
          title: Entity Visibility
          type: string
          description: Visibility of the entity inside Backstage.
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private
        owner:
          title: Owner
          type: string
          description: Owner of the Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        domain:
          title: Parent Domain
          description: Parent domain of this Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Domain]
        system:
          title: Parent System
          description: Parent system of this Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [System]
        type:
          title: Type
          type: string
          description: The type of API.
          ui:disabled: true
          oneOf:
            - title: OpenAPI
              const: openapi
            - title: AsyncAPI
              const: asyncapi
            - title: GraphQL
              const: graphql
            - title: gRPC
              const: grpc
        lifecycle:
          title: Lifecycle
          type: string
          description: The lifecycle of the API.
          oneOf:
            - title: Experimental
              const: experimental
            - title: Production
              const: production
            - title: Deprecated
              const: deprecated
        definition:
          title: API Definition
          type: string
          description: The definition of the API, based on the format defined by spec.type
          ui:widget: textarea
          ui:options:
            rows: 10
          ui:help: "Change this spec to match your API type!"
          ui:placeholder: |
            openapi: 3.0.4
            info:
              title: Sample API
              ...
            servers:
              ...
            paths:
              /users:
                get:
                  summary: Returns a list of users.
                  ...
                  responses:
                    "200": # status code
                      ...
        repoUrl:
          title: Repository Location
          type: string
          ui:disabled: true
          ui:widget: hidden
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - $yaml: ../../../steps/catalog/api.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
