apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-domain-template
  title: Edit Backstage Domain
  description: Edits Domains in Backstage.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - entities
    - edit
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - title: Update Domain Parameters
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          ui:disabled: true
        description:
          title: Description
          type: string
        namespace:
          title: Namespace
          type: string
          description: Namespace for your entity.
          ui:disabled: true
          ui:widget: hidden
        annotations:
          title: Annotations
          description: Annotations for your entity.
          type: array
          ui:disabled: true
          ui:widget: hidden
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                title: Key
                type: string
              value:
                title: value
                type: string
        tags:
          title: Tags
          description: Tags for your entity.
          type: array
          items:
            type: string
        visibility:
          title: Entity Visibility
          type: string
          description: Visibility of the entity inside Backstage.
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private
        owner:
          title: Owner
          type: string
          description: Owner of the entity.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        domain:
          title: Parent Domain
          description: Parent domain of this domain.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Domain]
        repoUrl:
          title: Repository Location
          type: string
          ui:disabled: true
          ui:widget: hidden
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - $yaml: ../../../steps/catalog/domain.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
