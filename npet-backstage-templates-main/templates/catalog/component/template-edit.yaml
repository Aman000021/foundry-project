apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: edit-component-template
  title: Edit Backstage Component
  description: Edits Components in Backstage.
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - entities
    - edit
spec:
  owner: group:default/aad-backstage-administrators
  type: catalog

  parameters:
    - title: Update System Parameters
      required:
        - name
        - owner
        - domain
        - type
        - lifecycle
        - system
      properties:
        name:
          title: Name
          type: string
          ui:disabled: true
        description:
          title: Description
          type: string
        namespace:
          title: Namespace
          type: string
          description: Namespace for your entity.
          ui:disabled: true
          ui:widget: hidden
        annotations:
          title: Annotations
          description: Annotations for your entity.
          type: array
          ui:disabled: true
          ui:widget: hidden
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                title: Key
                type: string
              value:
                title: value
                type: string
        tags:
          title: Tags
          description: Tags for your entity.
          type: array
          items:
            type: string
        visibility:
          title: Entity Visibility
          type: string
          description: Visibility of the entity inside Backstage.
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private
        owner:
          title: Owner
          type: string
          description: Owner of the Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        domain:
          title: Parent Domain
          description: Parent domain of this Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Domain]
        system:
          title: Parent System
          description: Parent system of this Resource.
          ui:disabled: true
          ui:widget: hidden
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [System]
        type:
          title: Type
          type: string
          description: The type of Component.
          ui:disabled: true
          oneOf:
            - title: Service
              const: service
            - title: Website
              const: website
            - title: Library
              const: library
        lifecycle:
          title: Lifecycle
          type: string
          description: The lifecycle of the Component.
          oneOf:
            - title: Experimental
              const: experimental
            - title: Production
              const: production
            - title: Deprecated
              const: deprecated
        subcomponentOf:
          title: Parent Component
          description: Parent Component of this Component.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Component]
        providesApis:
          title: Provides APIs
          description: APIs this Component provides.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [API]
        consumesApis:
          title: Consumes APIs
          description: APIs this Component consumes.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [API]
        dependsOn:
          title: Depends On
          description: Components or Resources this Component depends on.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [Component, Resource]
        dependencyOf:
          title: Dependency Of
          description: Components or Resources this Component is a dependency of.
          ui:field: MultiEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: [Component, Resource]
        repoUrl:
          title: Repository Location
          type: string
          ui:disabled: true
          ui:widget: hidden
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - $yaml: ../../../steps/catalog/component.yaml
    - $yaml: ../../../steps/github/publish.yaml

  output:
    links:
      - $yaml: ../../../outputs/github-repository.yaml
