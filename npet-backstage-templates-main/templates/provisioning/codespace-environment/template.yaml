---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-codespace-environment
  title: Codespace Development Environment
  description: |
    Scaffolds a GitHub Codespace-ready repository with Docker Compose orchestration.
    Dynamically clones any set of service repositories and wires them up with
    optional infrastructure (Redis, Azurite, PostgreSQL).

    This template:
    - Creates a GitHub repository seeded from the standard Codespace template
    - Grants the system admin/write teams and the platform teams access to the repository
    - Sets up branch protection on main
    - Stores the Azure DevOps artifact token as a Codespace secret on the repository
    - Opens a PR adding the repository Resource to the catalog
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - end-user
    - codespace
    - docker
    - environment
    - regional

spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - $yaml: ../../../parameters/provisioning/regional-system-picker.yaml

    - title: Service Repositories
      description: |
        Define the repositories to clone into the Codespace.
        Each entry becomes a service in Docker Compose.
      required:
        - repos
      properties:
        repos:
          title: Repositories
          type: array
          minItems: 1
          ui:options:
            orderable: true
          items:
            type: object
            required:
              - repoName
              - branch
              - localDir
              - language
            properties:
              repoName:
                title: Repository Name
                type: string
                description: |
                  Full repository name (e.g. nestle-it/nbra-vendeai-vendeai-myapi).
                  Only repositories the Codespace user can read are cloned.
                pattern: "^([A-Za-z0-9._-]+/)?[A-Za-z0-9._-]+$"
                errorMessage:
                  pattern: "Use the org/repo format (e.g. nestle-it/my-service)"
              branch:
                title: Branch
                type: string
                default: main
              localDir:
                title: Local Directory
                type: string
                description: Folder name in the workspace (e.g. my-service).
                pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
                errorMessage:
                  pattern: "Lowercase letters, numbers and hyphens only"
              language:
                title: Repository Programming Language
                type: string
                description: |
                  Drives the Dockerfile and the port mapping generated for this service.
                enum:
                  - nodejs
                  - python
                  - go
                  - react

    - title: Infrastructure & Settings
      properties:
        includeRedis:
          title: Include Redis
          type: boolean
          default: true
        includeAzurite:
          title: Include Azurite (Azure Blob Storage Emulator)
          type: boolean
          default: false
        includePostgresql:
          title: Include PostgreSQL
          type: boolean
          default: false
        environment:
          title: Environment Label
          type: string
          default: dev
          enum:
            - dev
            - staging
          enumNames:
            - Development
            - Staging

  steps:
    - $yaml: ../../../steps/catalog/assert-system-techlead-create.yaml

    - id: hostname-lookup
      action: nestle:backstage-hostname-lookup
      name: Hostname Lookup

    - id: system-entity
      action: catalog:get:entity:data
      name: Get System Entity
      input:
        ref: ${{ parameters.system }}

    - id: variablizer
      action: nestle:backstage:variablizer
      name: Build Variables
      input:
        variables:
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}
          repoName: >-
            ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}-${{ steps['system-entity'].output.domain.split('/')[1] | replace('-', '') }}-${{ steps['system-entity'].output.name | replace('-', '') }}-codespace
          domain: ${{ steps['system-entity'].output.domain.split('/')[1] }}
          githubAdminTeam: >-
            ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('br.nestle.com/githubAdminTeam') if steps['system-entity'].output.annotations | parseEntityAnnotations('br.nestle.com/githubAdminTeam') else steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') ~ '-' ~ steps['system-entity'].output.name ~ '-admin' }}
          githubWriteTeam: >-
            ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('br.nestle.com/githubTeam') if steps['system-entity'].output.annotations | parseEntityAnnotations('br.nestle.com/githubTeam') else steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') ~ '-' ~ steps['system-entity'].output.name ~ '-write' }}

    - id: fetch-codespace-template
      action: fetch:template
      name: Fetch Codespace Template
      input:
        url: https://github.com/nestle-it/nams-platform-backstage-scaffolder-system-codespace/tree/main/skeleton
        targetPath: ./codespace
        values:
          name: ${{ steps['variablizer'].output.repoName }}
          description: Codespace repository for system ${{ steps['system-entity'].output.name }}
          namespace: ${{ steps['system-entity'].output.namespace }}
          owner: ${{ steps['system-entity'].output.owner }}
          system: ${{ parameters.system }}
          project: ${{ steps['variablizer'].output.domain }}
          githubOrg: ${{ steps['variablizer'].output.organization }}
          githubAdminTeam: ${{ steps['variablizer'].output.githubAdminTeam }}
          environment: ${{ parameters.environment }}
          repos: ${{ parameters.repos }}
          includeRedis: ${{ parameters.includeRedis }}
          includeAzurite: ${{ parameters.includeAzurite }}
          includePostgresql: ${{ parameters.includePostgresql }}

    - id: publish-codespace
      action: publish:github
      name: Create Codespace Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.repoName }}
        sourcePath: ./codespace
        defaultBranch: main
        description: Codespace repository for system ${{ steps['system-entity'].output.name }}
        repoVisibility: internal
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        gitCommitMessage: '[Backstage] Initial commit'

    - id: github-team-associate-write
      action: github:teams:add-team-to-repository
      name: Add Write Team to Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.repoName }}
        slug: ${{ steps['variablizer'].output.githubWriteTeam }}
        permission: push

    - id: github-team-associate-platform-admin
      action: github:teams:add-team-to-repository
      name: Add Platform Admin Team to Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.repoName }}
        slug: br-nbra-platform-admin
        permission: admin

    - id: branch-protection
      action: github:branch-protection:create
      name: Setup Branch Protection
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.repoName }}
        branch: main
        requiredApprovingReviewCount: 1

    - id: codespace-azdevops-secret
      action: github:extras:create:codespace:secret
      name: Save Azure DevOps Artifact Token in Codespace Secrets
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=${{ steps['variablizer'].output.repoName }}
        useToken: true

    - id: catalog-repository-resource
      action: roadiehq:utils:fs:write
      name: Write Repository Resource Entity
      input:
        path: ./catalog-content/${{ steps['variablizer'].output.domain }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['variablizer'].output.repoName }}-repo.yaml
        content: |-
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ steps['variablizer'].output.repoName }}-repo
            namespace: ${{ steps['system-entity'].output.namespace }}
            description: Codespace repository for ${{ steps['system-entity'].output.name }}
            annotations:
              nestle.com/entity-visibility: internal
              nestle.com/domain: ${{ steps['variablizer'].output.domain }}
              nestle.com/system-type: regional
              nestle.com/repo-url: git@github.com:${{ steps['variablizer'].output.organization }}/${{ steps['variablizer'].output.repoName }}.git
              br.nestle.com/domain: ${{ steps['variablizer'].output.domain }}
              br.nestle.com/repoUrl: git@github.com:${{ steps['variablizer'].output.organization }}/${{ steps['variablizer'].output.repoName }}.git
            tags:
              - codespace
          spec:
            type: repository
            owner: ${{ steps['system-entity'].output.owner }}
            system: ${{ parameters.system }}

    - id: publish-catalog
      action: publish:github:pull-request
      name: Create Catalog Pull Request
      input:
        repoUrl: github.com?owner=${{ steps['variablizer'].output.organization }}&repo=npet-backstage-catalog
        sourcePath: ./catalog-content/${{ steps['variablizer'].output.domain }}
        targetPath: ${{ steps['variablizer'].output.domain }}
        branchName: codespace-${{ steps['variablizer'].output.repoName }}
        title: "Codespace Environment - ${{ steps['variablizer'].output.repoName }}"
        description: "Add repository Resource for Codespace environment ${{ steps['variablizer'].output.repoName }}"
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: Codespace Repository
        url: ${{ steps['publish-codespace'].output.remoteUrl }}
      - title: Open in Codespace
        url: https://github.com/${{ steps['variablizer'].output.organization }}/${{ steps['variablizer'].output.repoName }}/codespaces
      - title: Catalog Pull Request
        url: ${{ steps['publish-catalog'].output.remoteUrl }}
