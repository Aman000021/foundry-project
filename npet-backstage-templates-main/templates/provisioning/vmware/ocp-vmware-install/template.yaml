apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-vmware-install
  title: OpenShift VMware Full Provisioning
  description: |
    End-to-end provisioning of an OpenShift cluster on VMware.
    Select the provisioning site System entity — all cluster parameters are read
    from its annotations (populated by a ServiceNow request).
    Discovers VMware infrastructure from vCenter, generates the Ansible inventory,
    publishes it to GitHub, and triggers the Ansible Automation Platform playbook
    that installs the cluster. Waits for the installation to complete (~3h).
  annotations:
    nestle.com/template-visibility: internal
  tags:
    - vmware
    - openshift
    - ansible
    - provisioning
spec:
  owner: group:default/aad-backstage-administrators
  type: service

  parameters:
    - title: Select Provisioning Site
      required:
        - systemRef
        - aapJobTemplate
      properties:
        systemRef:
          title: OCP Provisioning Site
          type: string
          description: >
            Select the System entity representing the VMware location where OCP will be installed.
            Cluster name, base domain, and machine CIDR are read from its annotations.
            In production, this entity is created automatically by a ServiceNow request.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.annotations.nestle.com/factory-site: 'true'
        aapJobTemplate:
          title: AAP Job Template
          type: string
          description: Ansible Automation Platform job template to use for the OCP installation.
          default: 'Install OCP on VMware - AMS'
          enum:
            - 'Install OCP on VMware - AMS'
            - 'Install OCP on VMware - EUR'
            - 'Install OCP on VMware - AOA'
          enumNames:
            - 'AMS (Americas)'
            - 'EUR (Europe)'
            - 'AOA (Asia-Oceania-Africa)'

    - title: Worker Pool Networks
      description: Select the vCenter networks for worker pool nodes. Leave empty to auto-discover all available networks.
      properties:
        selectedNetworks:
          title: Worker Pool Networks
          type: array
          description: Networks from vCenter to assign as worker pools (optional — leave empty to use all available networks)
          ui:field: VmwareNetworkPicker
          items:
            type: object

  steps:
    # Step 1: Fetch all provisioning parameters from the System entity annotations
    - id: ocp-system
      name: Read Provisioning Parameters from System Entity
      action: catalog:get:entity:data
      input:
        ref: ${{ parameters.systemRef }}

    # Step 2: Determine GitHub org based on environment (prod vs dev)
    - action: nestle:backstage-hostname-lookup
      id: hostname-lookup
      name: Hostname Lookup

    - action: nestle:backstage:variablizer
      id: variablizer-repo
      name: Set Repository Variables
      input:
        variables:
          clusterName: ${{ steps['ocp-system'].output.annotations | parseEntityAnnotations('nestle.com/ocp-cluster-name') }}
          clusterBaseDomain: ${{ steps['ocp-system'].output.annotations | parseEntityAnnotations('nestle.com/ocp-base-domain') }}
          machineNetworkCidr: ${{ steps['ocp-system'].output.annotations | parseEntityAnnotations('nestle.com/ocp-machine-network-cidr') }}
          aapJobTemplate: ${{ parameters.aapJobTemplate }}
          name: ${{ (steps['ocp-system'].output.annotations | parseEntityAnnotations('nestle.com/ocp-cluster-name')) }}-vmware-config
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}

    # Step 3: Discover VMware resources and resolve paths
    - id: resolve-paths
      name: Discover & Resolve VMware Paths
      action: vmware:resource:resolve-paths
      input:
        templatePattern: rhcos
        ocpClusterName: ${{ steps['variablizer-repo'].output.clusterName }}
        baseDomain: ${{ steps['variablizer-repo'].output.clusterBaseDomain }}
        selectedNetworks: ${{ parameters.selectedNetworks }}

    # Step 4: Log what was discovered
    - id: log-resolved
      name: Log Resolved Configuration
      action: debug:log
      input:
        message: |
          Provisioning Site: ${{ parameters.systemRef }}
          Cluster Name: ${{ steps['variablizer-repo'].output.clusterName }}
          Base Domain: ${{ steps['variablizer-repo'].output.clusterBaseDomain }}
          Machine CIDR: ${{ steps['variablizer-repo'].output.machineNetworkCidr }}
          AAP Job Template: ${{ steps['variablizer-repo'].output.aapJobTemplate }}

          VMware Resource Resolution:
          - vCenter: ${{ steps['resolve-paths'].output.vcenterHostname }}
          - Datacenter: ${{ steps['resolve-paths'].output.datacenterPath }}
          - Cluster: ${{ steps['resolve-paths'].output.clusterPath }}
          - Datastore: ${{ steps['resolve-paths'].output.datastorePath }}
          - VM Folder: ${{ steps['resolve-paths'].output.vmFolderPath }}
          - Template: ${{ steps['resolve-paths'].output.templateName }} (found: ${{ steps['resolve-paths'].output.templateFound }})
          - Control Plane Network: ${{ steps['resolve-paths'].output.controlplaneNetworkName }}
          - Worker Pools: ${{ steps['resolve-paths'].output.workerPools | length }} networks
          - Zone: ${{ steps['resolve-paths'].output.zone }}
          - API IP: ${{ steps['resolve-paths'].output.clusterApiIp }} (DNS resolved: ${{ steps['resolve-paths'].output.dnsResolved }})
          - Ingress IP: ${{ steps['resolve-paths'].output.clusterIngressIp }}

    # Step 5: Generate Ansible inventory file from Nunjucks template
    - id: generate-config
      name: Generate Ansible Inventory Variables
      action: fetch:template
      input:
        url: ./content
        templateFileExtension: true
        values:
          clusterName: ${{ steps['variablizer-repo'].output.clusterName }}
          # Static values
          kvVaultUri: "https://glblprdccacmglobalhubkey.vault.azure.net/"
          kvPullsecret: hqvev-pull-secret
          kvSshPublicKey: hqvevocp-ssh-public-key
          ocpOsImageUrl: "https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.18/latest/rhcos-4.18.27-x86_64-vmware.x86_64.ova"
          # Zone-based KeyVault secrets (derived from datacenter path)
          kvVcenterUsername: ${{ steps['resolve-paths'].output.kvVcenterUsername }}
          kvVcenterPassword: ${{ steps['resolve-paths'].output.kvVcenterPassword }}
          # DNS-resolved IPs
          clusterApiIp: ${{ steps['resolve-paths'].output.clusterApiIp }}
          clusterIngressIp: ${{ steps['resolve-paths'].output.clusterIngressIp }}
          dnsResolved: ${{ steps['resolve-paths'].output.dnsResolved }}
          # vCenter auto-discovered
          vcenterHostname: ${{ steps['resolve-paths'].output.vcenterHostname }}
          datacenterPath: ${{ steps['resolve-paths'].output.datacenterPath }}
          clusterPath: ${{ steps['resolve-paths'].output.clusterPath }}
          datastorePath: ${{ steps['resolve-paths'].output.datastorePath }}
          vmFolderPath: ${{ steps['resolve-paths'].output.vmFolderPath }}
          templateName: ${{ steps['resolve-paths'].output.templateName }}
          templateFound: ${{ steps['resolve-paths'].output.templateFound }}
          templatePattern: rhcos
          controlplaneNetworkName: ${{ steps['resolve-paths'].output.controlplaneNetworkName }}
          workerPools: ${{ steps['resolve-paths'].output.workerPools }}
          # From entity annotations
          clusterBaseDomain: ${{ steps['variablizer-repo'].output.clusterBaseDomain }}
          machineNetworkCidr: ${{ steps['variablizer-repo'].output.machineNetworkCidr }}

    # Step 6: Check if config repo already exists
    - id: github-repo-get
      action: github:repo:get
      name: Check if Repository Exists
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}

    # Step 7a: Create new repository if it doesn't exist
    - id: github-repository-create
      action: publish:github
      name: Create GitHub Repository
      if: ${{ steps['github-repo-get'].output.exists == false }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        defaultBranch: main
        description: "OpenShift VMware Ansible inventory for cluster ${{ steps['variablizer-repo'].output.clusterName }}"
        repoVisibility: internal

    # Step 7b: Update existing repository via Pull Request
    - id: github-repository-update
      action: publish:github:pull-request
      name: Update GitHub Repository
      if: ${{ steps['github-repo-get'].output.exists }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        branchName: update-${{ steps['variablizer-repo'].output.clusterName }}-config
        title: "Update VMware config for ${{ steps['variablizer-repo'].output.clusterName }}"
        description: "Ansible inventory variables updated by Backstage scaffolder."
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    # Step 8: Launch the Ansible Automation Platform playbook
    # DISABLED for testing — uncomment when ready to trigger production AAP
    # - id: launch-ocp-install
    #   name: Launch OCP Installation Playbook
    #   action: rhaap:launch-job-template
    #   input:
    #     values:
    #       template: ${{ steps['variablizer-repo'].output.aapJobTemplate }}
    #       extraVariables:
    #         ocp_cluster_name: ${{ steps['variablizer-repo'].output.clusterName }}
    #         ocp_base_domain: ${{ steps['variablizer-repo'].output.clusterBaseDomain }}
    #         vcenter_hostname: ${{ steps['resolve-paths'].output.vcenterHostname }}
    #         vsphere_datacenter: ${{ steps['resolve-paths'].output.datacenterPath }}

    # Step 9: Wait for OCP installation to complete (up to 3h)
    # DISABLED for testing — uncomment when ready to trigger production AAP
    # - id: wait-for-install
    #   name: Wait for OCP Installation (~3h)
    #   action: rhaap:wait-for-job
    #   input:
    #     values:
    #       jobId: ${{ steps['launch-ocp-install'].output.data.id }}
    #       pollIntervalSeconds: 300
    #       timeoutSeconds: 10800

    # Step 10: Log final result
    - id: log-install-result
      name: Log Installation Result
      action: debug:log
      input:
        message: |
          ============================================================
          OCP Installation Complete
          ============================================================
          Cluster: ${{ steps['variablizer-repo'].output.clusterName }}.${{ steps['variablizer-repo'].output.clusterBaseDomain }}
          AAP Job ID: ${{ steps['launch-ocp-install'].output.data.id }}
          Final Status: ${{ steps['wait-for-install'].output.data.status }}
          Succeeded: ${{ steps['wait-for-install'].output.data.succeeded }}
          Job URL: ${{ steps['wait-for-install'].output.data.url }}
          ============================================================

  output:
    links:
      - title: Ansible Inventory Repository
        url: ${{ steps['github-repository-create'].output.remoteUrl }}
        if: ${{ steps['github-repo-get'].output.exists == false }}
        icon: github

      - title: Ansible Inventory Pull Request
        url: ${{ steps['github-repository-update'].output.remoteUrl }}
        if: ${{ steps['github-repo-get'].output.exists }}
        icon: github

      - title: AAP Installation Job
        url: ${{ steps['launch-ocp-install'].output.data.url }}
        icon: dashboard

    text:
      - title: Provisioning Summary
        content: |
          ## OpenShift Cluster `${{ steps['variablizer-repo'].output.clusterName }}` Provisioned

          **Provisioning Site:** `${{ parameters.systemRef }}`

          **VMware Infrastructure (auto-discovered from vCenter):**
          - vCenter: `${{ steps['resolve-paths'].output.vcenterHostname }}`
          - Datacenter: `${{ steps['resolve-paths'].output.datacenterPath }}`
          - Compute Resource: `${{ steps['resolve-paths'].output.clusterPath }}`
          - Datastore: `${{ steps['resolve-paths'].output.datastorePath }}`
          - VM Folder: `${{ steps['resolve-paths'].output.vmFolderPath }}`
          - RHCOS Template: `${{ steps['resolve-paths'].output.templateName }}`
          - Control Plane Network: `${{ steps['resolve-paths'].output.controlplaneNetworkName }}`
          - Worker Pools: ${{ steps['resolve-paths'].output.workerPools | length }} networks
          - Zone: `${{ steps['resolve-paths'].output.zone }}`

          **Cluster Networking:**
          - API VIP: `${{ steps['resolve-paths'].output.clusterApiIp }}`
          - Ingress VIP: `${{ steps['resolve-paths'].output.clusterIngressIp }}`
          - Base Domain: `${{ steps['variablizer-repo'].output.clusterBaseDomain }}`
          - Machine Network: `${{ steps['variablizer-repo'].output.machineNetworkCidr }}`

          **Installation:**
          - AAP Job: `${{ steps['launch-ocp-install'].output.data.id }}`
          - Status: `${{ steps['wait-for-install'].output.data.status }}`
