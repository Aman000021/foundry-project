---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-resource-group-debug
  title: Create a ResourceGroup - DEBUG
  description: Debug creating a ResourceGroup with the Provisioning Process.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - cpw
    - azure
    - resourcegroup
    - debug
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: Parameters
      required:
        - ref
      properties:
        ref:
          title: Parent System
          description: System to associate this ResourceGroup to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
        pipelineParameters:
          title: Environment Specific Parameters
          description: Environment specific parameters to send to the Azure DevOps pipeline.
          type: object
          properties:
            region:
              title: Region
              type: string
              default: euwe
            tenant:
              title: Tenant
              type: string
              oneOf:
                - title: NestlePROD
                  const: nestle.onmicrosoft.com
                - title: NestleDEV
                  const: nestlew2k.onmicrosoft.com
                - title: NestleINT
                  const: nestleint.onmicrosoft.com
                - title: NestleCHINA
                  const: nestlebj.partner.onmschina.cn
            environment:
              title: Environment
              type: string
              description: Choose exactly one environment flag to set "true"
              oneOf:
                - const: development
                - const: test
                - const: preproduction
                - const: production
                - const: innovation
                - const: integration
                - const: runtime
                - const: sandbox
                - const: staging
                - const: exploration
                - const: nonproduction

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - id: pipeline-run
      name: PipelineRun
      action: azure:pipeline:run:resource-group
      input:
        organization: nestle-it
        project: STIG
        branch: master
        pipelineId: 147
        pipelineParameters:
          apm-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billing_contact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}
          cost_center: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          data_classification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financial_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functional_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          shared_cost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solution_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technical_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          location_full_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}
          region: ${{ parameters.pipelineParameters.region }}
          tenant: ${{ parameters.pipelineParameters.tenant }}
          u_requester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          development: ${{ parameters.pipelineParameters.environment == 'development' }}
          test: ${{ parameters.pipelineParameters.environment == 'test' }}
          preproduction: ${{ parameters.pipelineParameters.environment == 'preproduction' }}
          production: ${{ parameters.pipelineParameters.environment == 'production' }}
          innovation: ${{ parameters.pipelineParameters.environment == 'innovation' }}
          integration: ${{ parameters.pipelineParameters.environment == 'integration' }}
          runtime: ${{ parameters.pipelineParameters.environment == 'runtime' }}
          sandbox: ${{ parameters.pipelineParameters.environment == 'sandbox' }}
          staging: ${{ parameters.pipelineParameters.environment == 'staging' }}
          exploration: ${{ parameters.pipelineParameters.environment == 'exploration' }}
          nonproduction: ${{ parameters.pipelineParameters.environment == 'nonproduction' }}
        waitForPipelineCompletion: true
        debug:
          skipQueue: true
          buildId: 3232608
        artifact:
          artifactName: "ResourceGroupTemplatesFinal"
          fileNamePattern: "-roles-parameters.json"

    - action: debug:log
      id: write-debug-line
      name: Output Entity data
      input:
        message: |
          ResourceGroupName: ${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          SubscriptionName: ${{ steps['pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
          AADObjectId: ${{ steps['pipeline-run'].output.artifactOutput | pick('aadObjectId') }}
          PepSubnetName: ${{ steps['pipeline-run'].output.artifactOutput | pick('pepSubnetName') }}
          environmentName: ${{ steps['pipeline-run'].output.artifactOutput | pick('environmentName') }}

    - id: vnet-lookup-api
      action: nestle:vnet-lookup
      name: VNET Lookup API
      input:
        subscription: ${{ steps['pipeline-run'].output.artifactOutput | pick('subscriptionName') }}

    - id: write-debug-line
      action: debug:log
      name: Output Entity data
      input:
        message: |
          ResourceGroup: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
          VNET: ${{ steps['vnet-lookup-api'].output.vnet }}
          SubscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}

  output:
    links:
      - title: Pipeline Url
        url: ${{ steps['pipeline-run'].output.pipelineUrl }}
