---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-resource-group
  title: Create a ResourceGroup
  description: Creates a ResourceGroup with the Provisioning Process.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - cpw
    - azure
    - resourcegroup
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: Parameters
      required:
        - ref
      properties:
        ref:
          title: Parent System
          description: System to associate this ResourceGroup to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
        pipelineParameters:
          title: Environment Specific Parameters
          description: Environment specific parameters to send to the Azure DevOps pipeline.
          type: object
          properties:
            region:
              title: Region
              type: string
              default: euwe
            tenant:
              title: Tenant
              type: string
              oneOf:
                - title: NestlePROD
                  const: nestle.onmicrosoft.com
                - title: NestleDEV
                  const: nestlew2k.onmicrosoft.com
                - title: NestleINT
                  const: nestleint.onmicrosoft.com
                - title: NestleCHINA
                  const: nestlebj.partner.onmschina.cn
            environment:
              title: Environment
              type: string
              description: Choose exactly one environment flag to set "true"
              oneOf:
                - const: development
                - const: test
                - const: preproduction
                - const: production
                - const: innovation
                - const: integration
                - const: runtime
                - const: sandbox
                - const: staging
                - const: exploration
                - const: nonproduction

    - title: Catalog Repository Parameters
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - id: pipeline-run
      name: PipelineRun
      action: azure:pipeline:run:resource-group
      input:
        organization: nestle-it
        project: STIG
        branch: master
        pipelineId: 147
        pipelineParameters:
          apm-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billing_contact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}
          cost_center: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          data_classification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financial_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functional_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          shared_cost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solution_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technical_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          location_full_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}
          region: ${{ parameters.pipelineParameters.region }}
          tenant: ${{ parameters.pipelineParameters.tenant }}
          u_requester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          development: ${{ parameters.pipelineParameters.environment == 'development' }}
          test: ${{ parameters.pipelineParameters.environment == 'test' }}
          preproduction: ${{ parameters.pipelineParameters.environment == 'preproduction' }}
          production: ${{ parameters.pipelineParameters.environment == 'production' }}
          innovation: ${{ parameters.pipelineParameters.environment == 'innovation' }}
          integration: ${{ parameters.pipelineParameters.environment == 'integration' }}
          runtime: ${{ parameters.pipelineParameters.environment == 'runtime' }}
          sandbox: ${{ parameters.pipelineParameters.environment == 'sandbox' }}
          staging: ${{ parameters.pipelineParameters.environment == 'staging' }}
          exploration: ${{ parameters.pipelineParameters.environment == 'exploration' }}
          nonproduction: ${{ parameters.pipelineParameters.environment == 'nonproduction' }}
        waitForPipelineCompletion: true
        artifact:
          artifactName: "ResourceGroupTemplatesFinal"
          fileNamePattern: "-roles-parameters.json"

    - id: vnet-lookup-api
      action: nestle:vnet-lookup
      name: VNET Lookup API
      input:
        subscription: ${{ steps['pipeline-run'].output.artifactOutput | pick('subscriptionName') }}

    - id: create-resource-yaml
      name: Scaffold Resource YAML
      action: fetch:template:file
      input:
        url: ./content/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ parameters.ref.split('/')[1] }}/resources/${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}.yaml
        values:
          name: ${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: resource-group
          owner: ${{ steps['system-entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: ${{ parameters.ref }}
          annotations:
            - key: nestle.com/resource-type
              value: resource-group
            - key: nestle.com/parent-system
              value: ${{ parameters.ref }}
            - key: nestle.com/region
              value: ${{ parameters.pipelineParameters.region }}
            - key: nestle.com/tenant
              value: ${{ parameters.pipelineParameters.tenant }}
            - key: nestle.com/resource-group-name
              value: ${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
            - key: nestle.com/subscription-name
              value: ${{ steps['pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
            - key: nestle.com/subscription-id
              value: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
            - key: nestle.com/virtual-network-rg
              value: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
            - key: nestle.com/virtual-network-name
              value: ${{ steps['vnet-lookup-api'].output.vnet }}
            - key: nestle.com/aad-object-id
              value: ${{ steps['pipeline-run'].output.artifactOutput | pick('aadObjectId') }}
            - key: nestle.com/pep-subnet-name
              value: ${{ steps['pipeline-run'].output.artifactOutput | pick('pepSubnetName') }}
            - key: nestle.com/environment-name
              value: ${{ steps['pipeline-run'].output.artifactOutput | pick('environmentName') }}

    - id: publish-resource
      name: Create PR in catalog repo
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: rg-creation-${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
        title: "Resource Group - ${{ steps['pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}"
        description: "Backstage Resource ${{ parameters.name }} creation"
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: Pipeline Url
        url: ${{ steps['pipeline-run'].output.pipelineUrl }}
      - title: Catalog Pull Request
        url: ${{ steps['publish-resource'].output.remoteUrl }}
