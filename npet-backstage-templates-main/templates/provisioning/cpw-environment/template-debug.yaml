---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cpw-environment-template-debug
  title: Cloud Application Template - DEBUG
  description: Creates an Application Template based off of the CPW.
  annotations:
    nestle.com/template-visibility: private
  tags:
    - cpw
    - azure
    - debug
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: Template Parameters
      ui:order:
        - addEnvironmentToExistingRepo
        - existingCloudTemplateRepo
        - systemRef
        - templates
        - appName
        - environments
        - region
        - visibility
        - tenant
        - namespace
      properties:
        addEnvironmentToExistingRepo:
          title: Add a new environment for an existing cloud template?
          type: boolean
          default: false
        tenant:
          title: Tenant
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - title: NestlePROD
              const: nestle.onmicrosoft.com
        namespace:
          title: Namespace
          type: string
          ui:disabled: true
          ui:widget: hidden
          oneOf:
            - const: default
      dependencies:
        addEnvironmentToExistingRepo:
          allOf:
            - if:
                properties:
                  addEnvironmentToExistingRepo:
                    const: false
              then:
                properties:
                  templates:
                    title: Template Type
                    description: Template type to provision.
                    type: string
                    enum:
                      - npet-empty-template
                      - npet-webapp-template
                      - npet-webapp-postgres-template
                      - npet-ragai-template
                      - npet-aks-template
                  systemRef:
                    title: Parent System
                    description: Parent System
                    type: string
                    ui:field: OwnedEntityPicker
                    ui:options:
                      allowArbitraryValues: false
                      catalogFilter:
                        - kind: System
                  appName:
                    title: Application Name
                    type: string
                    description: Application name (used as context in repo naming)
                    pattern: "^([a-zA-Z][a-zA-Z0-9]*)(-[a-zA-Z0-9]+)*$"
                  environments:
                    title: Environment
                    type: string
                    description: Choose an environment.
                    oneOf:
                      - title: Development
                        const: dv
                      - title: Test
                        const: ts
                      - title: Pre-Production
                        const: pp
                      - title: Production
                        const: pr
                      - title: Run-Time
                        const: rt
                      - title: Staging
                        const: st
                      - title: Exploration
                        const: ex
                      - title: Non-Production
                        const: np
                  region:
                    title: Region
                    type: string
                    description: Choose a region.
                    oneOf:
                      - title: East US
                        const: usea
                      - title: West Europe
                        const: euwe
                      - title: SouthEast Asia
                        const: asse
                  visibility:
                    title: GitHub Repository Visibility
                    type: string
                    oneOf:
                      - title: Internal
                        const: internal
                      - title: Private
                        const: private
                required:
                  - templates
                  - systemRef
                  - appName
                  - environments
                  - region
                  - visibility
            - if:
                properties:
                  addEnvironmentToExistingRepo:
                    const: true
              then:
                properties:
                  existingCloudTemplateRepo:
                    title: Existing Cloud Template Repository
                    description: Select an existing cloud template repository to add an environment to
                    type: string
                    ui:field: EntityPicker
                    ui:options:
                      catalogFilter:
                        - kind: Component
                          metadata.annotations.nestle.com/parent-process: "cpw"
                  environments:
                    title: Environment to Add
                    type: string
                    description: Choose an environment to add.
                    oneOf:
                      - title: Development
                        const: dv
                      - title: Test
                        const: ts
                      - title: Pre-Production
                        const: pp
                      - title: Production
                        const: pr
                      - title: Run-Time
                        const: rt
                      - title: Staging
                        const: st
                      - title: Exploration
                        const: ex
                      - title: Non-Production
                        const: np
                required:
                  - existingCloudTemplateRepo
                  - environments
  steps:
    - action: nestle:backstage-hostname-lookup
      id: hostname-lookup
      name: Hostname Lookup

    - action: catalog:get:entity:data
      id: component-entity
      if: ${{ parameters.addEnvironmentToExistingRepo }}
      name: Get Component Entity
      input:
        ref: ${{ parameters.existingCloudTemplateRepo }}

    - action: nestle:error
      id: fail-if-environment-exists
      if: ${{ parameters.environments in steps['component-entity'].output.annotations | parseEntityAnnotations('nestle.com/environments') }}
      name: Fail If Environment Already Exists
      input:
        error: |
          Error: Environment Already Exists! Please select a new Environment and try again.

    - action: nestle:backstage:variablizer
      id: variablizer-dynamic-entities
      name: Sets Template Type Variable
      input:
        variables:
          templateType: ${{ steps['component-entity'].output.annotations | parseEntityAnnotations('nestle.com/template-type') if parameters.addEnvironmentToExistingRepo else parameters.templates }}
          region: ${{ steps['component-entity'].output.annotations | parseEntityAnnotations('nestle.com/region') if parameters.addEnvironmentToExistingRepo else parameters.region }}
          parentSystem: ${{ steps['component-entity'].output.system if parameters.addEnvironmentToExistingRepo else parameters.systemRef }}
          appName: ${{ steps['component-entity'].output.annotations | parseEntityAnnotations('nestle.com/application-name') if parameters.addEnvironmentToExistingRepo else parameters.appName }}
          environmentJson: ${{ steps['component-entity'].output.annotations | parseEntityAnnotations('nestle.com/environments') if parameters.addEnvironmentToExistingRepo else '[]' }}

    - action: nestle:json:add:environment
      id: json-add-environment
      name: Add environment to JSON
      input:
        environmentJson: ${{ steps['variablizer-dynamic-entities'].output.environmentJson }}
        environment: ${{ parameters.environments }}

    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ steps['variablizer-dynamic-entities'].output.parentSystem }}

    - action: debug:log
      id: debug-variablizer-dynamic-entities
      name: Debug Variablizer Dynamic Entities
      input:
        message: |
          Variablizer Dynamic Entities:
          - Template Type: ${{ steps['variablizer-dynamic-entities'].output.templateType }}
          - Region: ${{ steps['variablizer-dynamic-entities'].output.region }}
          - parent-system: ${{ steps['variablizer-dynamic-entities'].output.parentSystem }}
          - Application Name: ${{ steps['variablizer-dynamic-entities'].output.appName }}
          - Environment JSON: ${{ steps['variablizer-dynamic-entities'].output.environmentJson }}

    - action: nestle:backstage:variablizer
      id: variablizer-repo
      name: Sets Repository Name Variable
      input:
        variables:
          name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['variablizer-dynamic-entities'].output.appName }}
          organization: ${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}
          createdSourceRepo: https://github.com/${{ 'nestle-it' if 'idp.nestle.com' in steps['hostname-lookup'].output.hostname else 'nestle-devtest' }}/${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}-${{ steps['variablizer-dynamic-entities'].output.appName }}

    - action: catalog:get:entity
      id: repository-entity
      if: ${{ parameters.addEnvironmentToExistingRepo == false }}
      name: Get Repository Entity
      input:
        ref: component:${{ parameters.namespace }}/${{ steps['variablizer-repo'].output.name }}

    - action: debug:log
      name: Debug Repository Exists
      input:
        message: |
          Debug Repository Exists:
          - Ref: component:${{ parameters.namespace }}/${{ steps['variablizer-repo'].output.name }}
          - Repository Exists: ${{ steps['repository-entity'].output.exists }}

    - action: nestle:error
      id: fail-if-repository-does-not-exist
      if: ${{ steps['repository-entity'].output.exists }}
      name: Fail If Repository Exists
      input:
        error: |
          Error: Repository already exists! Please start over and select 'Add a new environment for an existing cloud template?' to add an environment to your repository.

    # Debug System Entity
    - action: debug:log
      id: debug-system-entity
      name: Debug System Entity
      input:
        message: |
          System Entity Information:
          - Kind: ${{ steps['system-entity'].output.kind }}
          - Name: ${{ steps['system-entity'].output.name }}
          - Owner: ${{ steps['system-entity'].output.owner }}
          - Domain: ${{ steps['system-entity'].output.domain }}

          System Entity Annotations:
          apm-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billing_contact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('context') }}
          cost_center: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          data_classification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financial_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functional_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          shared_cost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solution_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technical_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          location_full_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}

          # Variabilzer Output
          Repository Name: ${{ steps['variablizer-repo'].output.name }}
          Repository Owner: ${{ steps['variablizer-repo'].output.organization }}

    # RESOURCE GROUP CREATION
    - id: resource-group-azdo-pipeline-run
      name: Resource Group Azure DevOps Pipeline Run
      action: azure:pipeline:run:resource-group
      input:
        organization: nestle-it
        project: STIG
        branch: master
        pipelineId: 147
        pipelineParameters:
          apm_id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billing_contact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ steps['variablizer-dynamic-entities'].output.appName }}
          cost_center: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          data_classification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financial_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functional_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          shared_cost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solution_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technical_owner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          location_full_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}
          region: ${{ steps['variablizer-dynamic-entities'].output.region }}
          tenant: ${{ parameters.tenant }}
          u_requester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          development: ${{ parameters.environments == 'dv' }}
          test: ${{ parameters.environments == 'ts' }}
          preproduction: ${{ parameters.environments == 'pp' }}
          production: ${{ parameters.environments == 'pr' }}
          runtime: ${{ parameters.environments == 'rt' }}
          staging: ${{ parameters.environments == 'st' }}
          exploration: ${{ parameters.environments == 'ex' }}
          nonproduction: ${{ parameters.environments == 'np' }}
          # The below are disabled as they aren't utilized in the CPW Request.
          # innovation: ${{ parameters.environments == 'in' }}
          # integration: ${{ parameters.environments == 'it' }}
          # sandbox: ${{ parameters.environments == 'sb' }}
        waitForPipelineCompletion: true
        artifact:
          artifactName: "ResourceGroupTemplatesFinal"
          fileNamePattern: "-roles-parameters.json"
        debug:
          skipQueue: true
          # buildId: 3390031
          buildId: 3443289 # IDP-devops
          # buildId: 3301272 AKS TEMPLATE

    - action: debug:log
      id: debug-resource-group
      name: Debug Resource Group
      input:
        message: |
          Resource Group Created:
          - Name: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          - Subscription: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
          - Environment: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('environmentName') }}
          - market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          - location_full_name: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}

    - id: vnet-lookup-api
      action: nestle:vnet-lookup
      name: VNET Lookup API
      input:
        subscription: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('subscriptionName') }}

    - action: debug:log
      id: debug-vnet
      name: Debug VNET Lookup
      input:
        message: |
          VNET Lookup Results:
          - Resource Group: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
          - VNET: ${{ steps['vnet-lookup-api'].output.vnet }}
          - Subscription ID: ${{ steps['vnet-lookup-api'].output.subscriptionId }}

    - id: create-resource-yaml
      name: Scaffold Resource YAML
      action: fetch:template:file
      input:
        url: ./content/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}.yaml
        values:
          name: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: resource-group
          owner: ${{ steps['system-entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: ${{ steps['variablizer-dynamic-entities'].output.parentSystem }}
          annotations:
            - key: nestle.com/resource-type
              value: resource-group
            - key: nestle.com/region
              value: ${{ steps['variablizer-dynamic-entities'].output.region }}
            - key: nestle.com/tenant
              value: ${{ parameters.tenant }}
            - key: nestle.com/resource-group-name
              value: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
            - key: nestle.com/subscription-name
              value: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
            - key: nestle.com/subscription-id
              value: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
            - key: nestle.com/virtual-network-rg
              value: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
            - key: nestle.com/virtual-network-name
              value: ${{ steps['vnet-lookup-api'].output.vnet }}
            - key: nestle.com/aad-object-id
              value: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('aadObjectId') }}
            - key: nestle.com/pep-subnet-name
              value: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('pepSubnetName') }}
            - key: nestle.com/environment-name
              value: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('environmentName') }}
          dependencyOf:
            - component:${{ parameters.namespace }}/${{ steps['variablizer-repo'].output.name }}

    - id: publish-resource
      name: Create PR in catalog repo
      action: publish:github:pull-request
      input:
        sourcePath: ${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources
        targetPath: ${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=npet-backstage-catalog
        branchName: rg-creation-${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
        title: "Resource Group - ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}"
        description: "Backstage Resource ${{ parameters.name }} creation"
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    - id: fetch-payload
      action: fetch:template:file
      name: Template Payload
      input:
        url: ./content/request-payload.njk
        targetPath: ./tmp/request-payload.njk
        values:
          apmId: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}
          billingContact: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('billing-contact') }}
          context: ${{ steps['variablizer-dynamic-entities'].output.appName }}
          costCenter: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          dataClassification: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('data-classification') }}
          department: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('department') }}
          financialOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('financial-owner') }}
          functionalOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('functional-owner') }}
          market: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/market') }}
          network: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('network') }}
          pii: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('pii') }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          sharedCost: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('shared-cost') }}
          solutionName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          technicalOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          locationFullName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('market-full-name') }}
          region: ${{ steps['variablizer-dynamic-entities'].output.region }}
          tenant: ${{ parameters.tenant }}
          uRequester: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          environmentName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('environmentName') }}
          resourceGroupName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          subscriptionName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
          subscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
          aadObjectId: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('aadObjectId') }}
          pepSubnetName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('pepSubnetName') }}
          virtualNetworkRg: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
          virtualNetworkName: ${{ steps['vnet-lookup-api'].output.vnet }}
          organization: ${{ steps['variablizer-repo'].output.organization }}
          templates: ${{ steps['variablizer-dynamic-entities'].output.templateType }}
          repoName: ${{ steps['variablizer-repo'].output.name | string }}

    - id: deserialise
      action: nestle:fs:json:parse
      name: Parse File
      input:
        path: ./tmp/request-payload.njk

    # - id: sharedinfra-baseline-pipeline-run-gha
    #   action: github:actions:dispatch-with-response
    #   name: SharedInfra GitHub Action
    #   input:
    #     repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
    #     workflowId: sharedinfra-baseline.yaml
    #     branchOrTagName: main
    #     waitForActionCompletion: true
    #     timeout: 1200
    #     workflowInputs:
    #       organization: ${{ steps['variablizer-repo'].output.organization }}
    #       variables: ${{ steps.deserialise.output.content | string }}
    #       environmentName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('environmentName') }}
    #       resourceGroupName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
    #       subscriptionName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('subscriptionName') }}
    #       subscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
    #       systemSlug: ${{ steps['system-entity'].output.name }}
    #       templates: ${{ steps['variablizer-dynamic-entities'].output.templateType }}

    - action: catalog:get:entity
      id: resource-group-entity-validation
      name: Validate Resource Group Entity
      input:
        ref: resource:${{ parameters.namespace }}/${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}

    - action: debug:log
      id: debug-resource-group-exists
      name: Debug Resource Group Exists
      input:
        message: |
          Debug Repository Exists:
          - ref: resource:${{ parameters.namespace }}/${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}
          - Resource Group Exists: ${{ steps['resource-group-entity-validation'].output.exists }}


    - id: register-catalog-resource-group
      if: ${{ steps['resource-group-entity-validation'].output.exists == false }}
      name: Register Catalog Resource Group
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/${{ steps['variablizer-repo'].output.organization }}/npet-backstage-catalog/blob/main
        catalogInfoPath: /${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['system-entity'].output.name }}/resources/${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}.yaml

    - action: debug:wait
      id: wait-5sec
      name: Waiting for 5 seconds
      input:
        seconds: 5

    - action: catalog:get:entity:data
      id: resource-group-entity
      name: Get ResourceGroup Entity Details
      input:
        ref: resource:${{ parameters.namespace }}/${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}

    - action: debug:log
      id: debug-resource-group-entity
      name: Debug Resource Group Entity
      input:
        message: |
          Resource Group Entity Information:
          - Kind: ${{ steps['resource-group-entity'].output.kind }}
          - Name: ${{ steps['resource-group-entity'].output.name }}
          - Owner: ${{ steps['resource-group-entity'].output.owner }}
          - Domain: ${{ steps['resource-group-entity'].output.domain }}

          Resource Group Entity Annotations:
          environmentName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('environment-name') }}
          resourceGroupName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('resource-group-name') }}
          subscriptionName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subscription-name') }}
          subscriptionId: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subscription-id') }}
          aadObjectId: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('aad-object-id') }}
          pepSubnetName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('pep-subnet-name') }}
          virtualNetworkRg: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('virtual-network-rg') }}
          virtualNetworkName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('virtual-network-name') }}

    - id: subnet-creation-azdo-pipeline-run
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType != 'npet-empty-template' }}
      name: Subnet Creation Pipeline Run
      action: azure:pipeline:run:subnet
      each: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subnet-delegation', true) }}
      input:
        organization: nestle-it
        project: STIG
        branch: main
        pipelineId: 1581
        pipelineParameters:
          no_subnet_req: 1
          ServiceEndpoints_1: "False" # TODO
          solution_resource_group_1: ${{ steps['resource-group-entity'].output.name }}
          subnetdelegation_1: ${{ each.value.subnet_delegation }}
          subnetprefix_1: ${{ each.value.subnet_prefix }}
          subscriptionname_1: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subscription-name') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
        waitForPipelineCompletion: true
        artifact:
          artifactName: "TerraformScripts"
          fileNamePattern: ".snt1.tf"
        debug:
          skipQueue: true
          # buildId: 3390123
          buildId: 3443337 # IDP-devops
          # buildId: 3301390 # AKS TEMPLATE

    - action: debug:log
      id: write-debug-line
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType != 'npet-empty-template' }}
      name: Output Entity data
      each: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('subnet-delegation', true) }}
      input:
        message: |
          resourceGroupName: ${{ steps['subnet-creation-azdo-pipeline-run'].output.artifactOutput[each.key] | pick('resourceGroupName') }}
          delegatedSubnetName: ${{ steps['subnet-creation-azdo-pipeline-run'].output.artifactOutput[each.key] | pick('delegatedSubnetName') }}
