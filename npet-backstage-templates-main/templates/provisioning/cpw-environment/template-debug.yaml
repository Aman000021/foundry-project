          solutionName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          context: ${{ steps['variablizer-dynamic-entities'].output.appName }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          region: ${{ steps['variablizer-dynamic-entities'].output.region }}
          subscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
          umiFederationClientId: ${{ steps['variablizer-umi-federation'].output.umiFederationClientId | string }}
          teamName: ${{ steps['variablizer-repo'].output.name | string }}
        templateFileExtension: true
        replace: true

    - action: fetch:template:file
      id: fetch-template-terraform
      name: Fetch Template Terraform
      each: ["${{ parameters.environments }}"]
      input:
        url: https://github.com/nestle-it/npet-backstage-repository-templates/tree/main/${{ steps['variablizer-dynamic-entities'].output.templateType }}/environments/env/backend-config.tfvars.njk
        targetPath: content/environments/${{ each.value }}/backend-config.tfvars
        values:
          resourceGroupName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('resource-group-name') }}
          terraformStorageAccountName: ${{ steps['variablizer-terraform-storageaccount-container'].output.terraformStorageAccountName | string }}
          terraformStorageAccountContainer: ${{ steps['variablizer-terraform-storageaccount-container'].output.terraformStorageAccountContainer | string }}
        replace: true

    - action: fetch:template:file
      id: fetch-template-terraform
      name: Fetch Template Terraform
      each: ["${{ parameters.environments }}"]
      input:
        url: https://github.com/nestle-it/npet-backstage-repository-templates/tree/main/${{ steps['variablizer-dynamic-entities'].output.templateType }}/environments/env/env.tfvars.njk
        targetPath: content/environments/${{ each.value }}/${{ each.value }}.tfvars
        values:
          repository: ${{ steps['variablizer-repo'].output.name }}
          templateType: ${{ steps['variablizer-dynamic-entities'].output.templateType }}
          technicalOwner: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          solutionName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') }}
          context: ${{ steps['variablizer-dynamic-entities'].output.appName }}
          scope: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('scope') }}
          region: ${{ steps['variablizer-dynamic-entities'].output.region }}
          resourceGroupName: ${{ steps['resource-group-entity'].output.annotations | parseEntityAnnotations('resource-group-name') }}
          terraformStorageAccountName: ${{ steps['variablizer-terraform-storageaccount-container'].output.terraformStorageAccountName | string }}
          terraformStorageAccountContainer: ${{ steps['variablizer-terraform-storageaccount-container'].output.terraformStorageAccountContainer | string }}
          virtualNetworkName: ${{ steps['vnet-lookup-api'].output.vnet }}
          virtualNetworkRg: ${{ steps['vnet-lookup-api'].output.resourceGroup }}
          pepSubnetName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('pepSubnetName') }}
          environmentName: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('environmentName') }}
          delegatedSubnetName: ${{ steps['variablizer-subnet-delegation'].output.delegatedSubnetName }}
          umiFederationClientId: ${{ steps['variablizer-umi-federation'].output.umiFederationClientId | string }}
          subscriptionId: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
          appSsoClientId: ${{ steps['variablizer-app-sso'].output.appSsoClientId | string }}
          appSsoWebAppName: ${{ steps['variablizer-app-sso'].output.appSsoWebAppName | string }}
          dbaEntraGrpObjectId: ${{ steps['variablizer-dba-entra-grp'].output.dbaEntraGrpObjectId | string }}
          dbaEntraGrpDisplayName: ${{ steps['variablizer-dba-entra-grp'].output.dbaEntraGrpDisplayName| string }}
          umiPaasSqlName: ${{ steps['variablizer-umi-paas-sql'].output.umiPaasSqlName | string }}
          keyName: ${{ steps['variablizer-env-names'].output.keyName | string }}
          sqlServerName: ${{ steps['variablizer-env-names'].output.sqlServerName | string }}
          webappUmiName: ${{ steps['variablizer-env-names'].output.webappUmiName | string }}
          mssqlPep: ${{ steps['variablizer-env-names'].output.mssqlPep | string }}
          webappPep: ${{ steps['variablizer-env-names'].output.webappPep | string }}
          keyPep: ${{ steps['variablizer-env-names'].output.keyPep | string }}
          aksName: ${{ steps['variablizer-env-names'].output.aksName | string }}
          umiName: ${{ steps['variablizer-env-names'].output.umiName | string }}
          acrPep: ${{ steps['variablizer-env-names'].output.acrPep | string }}
          aiSearchPep: ${{ steps['variablizer-env-names'].output.aiSearchPep | string }}
          backendFncPep: ${{ steps['variablizer-env-names'].output.backendFncPep | string }}
          storageFncPep: ${{ steps['variablizer-env-names'].output.storageFncPep | string }}
          sharepointFncPep: ${{ steps['variablizer-env-names'].output.sharepointFncPep | string }}
          staPep: ${{ steps['variablizer-env-names'].output.staPep | string }}
          aiSearchName: ${{ steps['variablizer-env-names'].output.aiSearchName | string }}
          backendFncName: ${{ steps['variablizer-env-names'].output.backendFncName | string }}
          storageFncName: ${{ steps['variablizer-env-names'].output.storageFncName | string }}
          sharepointFncName: ${{ steps['variablizer-env-names'].output.sharepointFncName | string }}
          staName: ${{ steps['variablizer-env-names'].output.staName | string }}
          pqlName: ${{ steps['variablizer-env-names'].output.pqlName | string }}
          pqlPep: ${{ steps['variablizer-env-names'].output.pqlPep | string }}
          aadObjectId: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('aadObjectId') }}
          umiFederationName: ${{ steps['variablizer-umi-federation'].output.umiFederationName | string }}
        replace: true

    - id: fetch-template-environment-file
      action: fetch:template:file
      name: Fetch Template - Catalog Info
      input:
        url: ./content/catalog-info.yaml.njk
        targetPath: content/.backstage/catalog-info.yaml
        values:
          name: ${{ steps['variablizer-repo'].output.name }}
          owner: ${{ steps['system-entity'].output.owner }}
          system: ${{ steps['variablizer-dynamic-entities'].output.parentSystem }}
          annotations:
            - key: nestle.com/application-name
              value: ${{ steps['variablizer-dynamic-entities'].output.appName }}
            - key: nestle.com/parent-process
              value: cpw
            - key: nestle.com/region
              value: ${{ steps['variablizer-dynamic-entities'].output.region }}
            - key: nestle.com/template-type
              value: ${{ steps['variablizer-dynamic-entities'].output.templateType }}
            - key: nestle.com/environments
              value: |
                '${{ steps['json-add-environment'].output.environments }}'
          github:
            url: ${{ steps['variablizer-repo'].output.createdSourceRepo }}
        replace: true

    - action: fetch:template:file
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType == 'npet-aks-template' }}
      id: fetch-template-workflows-tf-apply
      name: Fetch Template Workflows - tf-apply
      each: ["${{ parameters.environments }}"]
      input:
        url: https://github.com/nestle-it/npet-backstage-repository-templates/tree/main/npet-aks-template/.github/workflows/env/tf-apply.yml.njk
        targetPath: content/.github/workflows/${{ each.value }}-tf-apply.yml
        values:
          environment: ${{ each.value }}
        replace: true

    - action: fetch:template:file
      id: fetch-template-workflows-tf-destroy
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType == 'npet-aks-template' }}
      name: Fetch Template Workflows - tf-destroy
      each: ["${{ parameters.environments }}"]
      input:
        url: https://github.com/nestle-it/npet-backstage-repository-templates/tree/main/npet-aks-template/.github/workflows/env/tf-destroy.yml.njk
        targetPath: content/.github/workflows/${{ each.value }}-tf-destroy.yml
        values:
          environment: ${{ each.value }}
        replace: true

    - action: fetch:template:file
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType == 'npet-aks-template' }}
      id: fetch-template-workflows-tf-plan
      name: Fetch Template Workflows - tf-plan
      each: ["${{ parameters.environments }}"]
      input:
        url: https://github.com/nestle-it/npet-backstage-repository-templates/tree/main/npet-aks-template/.github/workflows/env/tf-plan.yml.njk
        targetPath: content/.github/workflows/${{ each.value }}-tf-plan.yml
        values:
          environment: ${{ each.value }}
        replace: true

    - action: fs:delete
      id: deleteFiles
      if: ${{ parameters.addEnvironmentToExistingRepo == false }}
      name: Cleanup Env Directories
      input:
        files:
          - content/.github/workflows/env
          - content/environments/env

    - id: github-team-create
      action: github:teams:create
      name: Create GitHub Team(s)
      each:
        [
          "${{ steps['variablizer-repo'].output.name }}-admin",
          "${{ steps['variablizer-repo'].output.name }}-write",
        ]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        maintainers:
          [
            "${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}",
          ]
        teamName: ${{ each.value }}

    - id: github-repo-get
      action: github:repo:get
      name: Get GitHub Repository
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}

    - id: github-repository-create
      action: publish:github
      name: Create GitHub Repository
      if: ${{ steps['github-repo-get'].output.exists == false }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        sourcePath: content
        defaultBranch: main
        description: Templated repository created by Backstage.
        repoVisibility: ${{ parameters.visibility }}
        customProperties:
          cost-center-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('cost-center') }}
          apm-id: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('apm-id') }}

    - id: github-repository-update
      action: publish:github:pull-request
      name: Update GitHub Repository
      if: ${{ steps['github-repo-get'].output.exists }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        sourcePath: content
        branchName: update-${{ steps['variablizer-repo'].output.name }}
        title: "Update from Backstage - ${{ steps['variablizer-repo'].output.name }}"
        description: "Backstage template updates of ${{ steps['variablizer-repo'].output.name }}."
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    - action: github:environment:create
      name: Create Environment
      each: ["${{ parameters.environments }}"]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        name: ${{ each.value }}

    - action: github:environment:configuration:create
      name: Create or Update Environment Configurations - Common
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        environment: ${{ parameters.environments }}
        environmentVariables:
          CLIENT_ID: ${{ steps['variablizer-umi-federation'].output.umiFederationClientId | string }}
          SUBSCRIPTION_ID: ${{ steps['vnet-lookup-api'].output.subscriptionId }}
          TENANT_ID: ${{ steps['vnet-lookup-api'].output.tenantId }}

    - action: github:environment:configuration:create
      name: Create or Update Environment Configurations - WebApp PostGres
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType == 'npet-webapp-postgres-template' }}
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        environment: ${{ parameters.environments }}
        environmentVariables:
          RESOURCE_GROUP_NAME: ${{ steps['resource-group-azdo-pipeline-run'].output.artifactOutput | pick('resourceGroupName') }}

    - action: github:branch-protection:create
      name: Setup Branch Protection
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        enforceAdmins: true
        requiredConversationResolution: true
        requireCodeOwnerReviews: true
        requiredApprovingReviewCount: 1

    - id: github-team-associate
      action: github:teams:add-team-to-repository
      name: Add GitHub Team(s) to Repository
      each:
        [
          "${{ steps['variablizer-repo'].output.name }}-admin",
          "${{ steps['variablizer-repo'].output.name }}-write",
        ]
      input:
        repoUrl: github.com?owner=${{ steps['variablizer-repo'].output.organization }}&repo=${{ steps['variablizer-repo'].output.name }}
        slug: ${{ steps['github-team-create'].output.slug[each.key] }}

    - id: debug-register-catalog-info
      action: debug:log
      name: Debug Register Catalog Info
      input:
        message: |
          Registering catalog info for repository ${{ steps['variablizer-repo'].output.name }}
          Repository URL:  ${{ steps['variablizer-repo'].output.createdSourceRepo }}
          Catalog Info Path: /.backstage/catalog-info.yaml
          parent-system: ${{ steps['variablizer-dynamic-entities'].output.parentSystem }}

    - id: register-catalog-entities
      name: Register Catalog Entities
      action: catalog:register
      if: ${{ steps['github-repo-get'].output.exists == false }}
      input:
        repoContentsUrl: ${{ steps['variablizer-repo'].output.createdSourceRepo }}/blob/main
        catalogInfoPath: "/.backstage/catalog-info.yaml"

    - id: sonarqube-project-create-gha
      action: github:actions:dispatch-with-response
      if: ${{ steps['variablizer-repo'].output.organization == 'nestle-it' }}
      name: Create Sonar Qube Project - Github Action
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        workflowId: create-sonarqube-project.yaml
        branchOrTagName: main
        waitForActionCompletion: false
        timeout: 1500
        workflowInputs:
          organization: ${{ steps['variablizer-repo'].output.organization }}
          repository: ${{ steps['variablizer-repo'].output.name }}
          admins: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('technical-owner') }}

    - id: dns-run
      name: Trigger DNS Creation
      if: ${{ steps['variablizer-dynamic-entities'].output.templateType == 'npet-aks-template' }}
      action: azure:pipeline:run
      input:
        organization: nestle-it
        project: STIG
        pipelineId: 1336
        branch: feat/NPET_dev
        waitForPipelineCompletion: true
        pipelineParameters:
          dns_records: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('solution-name') | string }}${{ steps['resource-group-cidr'].output.annotations | parseEntityAnnotations('environment-name') | string }}${{ steps['variablizer-dynamic-entities'].output.appName }}
          dns_values: ${{ steps['resource-group-cidr'].output.annotations | parseEntityAnnotations('CIDR') | calculateDnsIp }}
          ticket: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('ticket') }}
          u_requestor: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('requester') }}
          req_type: Create
          branchName: feat/NPET_dev
          record_type: A
          dns_zones: nestle.com

    - action: debug:log
      name: Support Links
      input:
        message: |
          Support Links:
          - SonarQube Workflow Url: ${{ steps['sonarqube-project-create-gha'].output.workflowUrl }}
          - Resource Group Azure DevOps Pipeline: ${{ steps['resource-group-azdo-pipeline-run'].output.pipelineUrl }}
          - SharedInfra Baseline Pipeline: ${{ steps['sharedinfra-baseline-pipeline-run-gha'].output.workflowUrl }}
          - Subnet Creation Pipeline: ${{ steps['subnet-creation-azdo-pipeline-run'].output.pipelineUrl }}
          - DNS Creation Pipeline: ${{ steps['dns-run'].output.pipelineUrl }}
          - Certificate Creation Pipeline: ${{ steps['certificate-run'].output.pipelineUrl }}

  output:
    text:
      - title: Message
        content: "Please **merge** your Pull Request if adding a new environment before submitting another Environment Request."
    links:
      - title: Repository URL
        url: ${{ steps['github-repository-create'].output.remoteUrl }}
      - title: Repository Pull Request
        url: ${{ steps['github-repository-update'].output.remoteUrl }}
      - title: Catalog Entity
        url: ${{ steps['hostname-lookup'].output.hostname }}/catalog/${{ parameters.namespace }}/component/${{ steps['variablizer-repo'].output.name }}
