---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aifoundry-backstage-deployment
  title: Create AI Foundry projects using Terraform
  description: |
    Deploy Azure AI Foundry projects using Terraform with automated infrastructure provisioning.
    This template executes Terraform deployment via GitHub Actions workflow to create AI Foundry project infrastructure.

  annotations:
    nestle.com/template-visibility: internal
  tags:
    - terraform
    - aifoundry
spec:
  owner: group:default/AAD-SG-backstage-innovation
  type: cloud-template

  parameters:
    - title: System Association
      required:
        - ref
      properties:
        ref:
          title: Parent System
          description: System to associate this Resource Group to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
              
    - title: AI Foundry Project Configuration
      required:
        - solution
        - environment
        - owner
        - location
        - model_deployment_name
        - model_name
        - model_version
        - model_format
        - model_sku
        - model_capacity
      properties:
        location:
          title: Azure Region
          type: string
          description: "Select the Azure region to deploy resources."
          default: westeurope
          enum:
            - westeurope
            - northeurope
            - eastus
            - eastus2
            - centralus
            - australiaeast
            - australiacentral
            - spaincentral
            - swedencentral
        solution:
          title: Solution Name
          type: string
          description: "Specify the solution or project name."
          pattern: '^[a-z0-9-]+$'
          ui:help: 'Only lowercase letters, numbers, and hyphens allowed'
        environment:
          title: Environment
          type: string
          description: "Choose the deployment environment."
          default: innovation
          enum:
            - data_exploration
            - development
            - innovation
            - integration
            - non_production
            - pre_production
            - production
            - sandbox
            - staging
            - test
        owner:
          title: Owner Email
          type: string
          description: "Enter the email of the AI Foundry project owner."
          format: email
        index:
          title: Index (Optional)
          type: string
          description: "Optional index suffix for multiple deployments of the same solution"
          pattern: '^[0-9]*$'
        ttl_days:
          title: Time to Live (Days)
          type: string
          description: "Number of days before the project expires (default: 90)"
          default: "90"
          pattern: '^[0-9]+$'
          ui:help: 'Enter a number between 1 and 365'
        create_ai_foundry:
          title: Create New AI Foundry Hub
          type: boolean
          description: |
            ⚠️ **NOTICE — Extraordinary use only**

            This option creates a **new AI Foundry Hub** in Azure.
            It should remain **disabled** by default, as projects are created on top of existing hubs.

            Enable it **only** if the creation of a new hub has been explicitly authorized and no existing hub is available to associate the project with.

            If in doubt, contact the platform team before proceeding.
          default: false
        model_deployment_name:
          title: Model Deployment Name
          type: string
          description: "Name for the model deployment."
          default: gpt-5-4-deployment
        model_name:
          title: Model Name
          type: string
          description: |
            Enter the AI model name to deploy. Available models:

            | Model Name         | Version    | Format    |
            |--------------------|------------|-----------|
            | gpt-5.4            | 2026-03-05 | OpenAI    |
            | gpt-5.4-nano       | 2026-03-17 | OpenAI    |
            | gpt-5.4-mini       | 2026-03-17 | OpenAI    |
            | claude-sonnet-4-6  | 1          | Anthropic |
            | claude-opus-4-6    | 1          | Anthropic |

            📖 **Documentation:**
            - [GPT Model Catalog (Azure OpenAI in Foundry)](https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?tabs=global-standard-aoai%2Cglobal-standard&pivots=azure-openai#azure-openai-in-microsoft-foundry-models)
            - [Claude Model Catalog (Foundry)](https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-claude?tabs=python)
          default: gpt-5.4
        model_version:
          title: Model Version
          type: string
          description: "Enter the version of the AI model."
          default: "2026-03-05"
        model_format:
          title: Model Format
          type: string
          description: "Enter the format of the AI model."
          default: OpenAI
        model_sku:
          title: Model SKU
          type: string
          description: "SKU for the model deployment."
          default: GlobalStandard
        model_capacity:
          title: Model Capacity
          type: integer
          description: "Capacity units for the model deployment."
          default: 1

        disclaimer_agreement:
          title: Important Notice - Support Agreement
          type: boolean
          description: |
            **IMPORTANT DISCLAIMER** 

            By checking this box, I acknowledge and agree that:

            • I understand that this deployment process may take up to 5 minutes to complete
            • If I do not see my Ai Foundry project created in the Azure Portal within 5 minutes after successful deployment, I will contact **alexandruionut.stoian@nestle.com** for support
            • I have verified all the configuration parameters above are correct
            **I have read and agree to the above terms and conditions**
          default: false
      dependencies:
        create_ai_foundry:
          allOf:
            - if:
                properties:
                  create_ai_foundry:
                    const: false
              then:
                properties:
                  ai_hub_name:
                    title: AI Hub Name
                    type: string
                    description: ✨ "Name of the existing AI Hub to associate the project with."
                    default: glbl-in-nextai-pilothub-swce-resource
                  ai_hub_resource_group:
                    title: AI Hub Resource Group
                    type: string
                    description: |
                      **IMPORTANT** 
                      📎**The resource group must be exempt from the AI Foundry creation policy**
                      ✨Resource group where the existing AI Hub is located.
                    default: glbl-in-nextai-pilothub-euwe-rgp
                required:
                  - ai_hub_name
                  - ai_hub_resource_group

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - id: triggerGitHubActions
      name: Trigger Terraform GitHub Actions Workflow
      action: github:actions:dispatch-with-response
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        repoUrl: github.com?repo=ai-foundry-backstage-deployment&owner=nestle-it
        workflowId: ai-foundry-deployment.yaml
        branchOrTagName: main
        waitForActionCompletion: true
        timeout: 1800
        workflowInputs:
          config_as_json: |
            {
              "location": "${{ parameters.location }}",
              "solution": "${{ parameters.solution }}",
              "environment": "${{ parameters.environment }}",
              "owner": "${{ parameters.owner }}",
              "create_ai_foundry": ${{ parameters.create_ai_foundry }},
              "model_deployment_name": "${{ parameters.model_deployment_name }}",
              "model_name": "${{ parameters.model_name }}",
              "model_version": "${{ parameters.model_version }}",
              "model_format": "${{ parameters.model_format }}",
              "model_sku": "${{ parameters.model_sku }}",
              "model_capacity": ${{ parameters.model_capacity }}${{ parameters.index and ', "index": "' + parameters.index + '"' or '' }}${{ parameters.ttl_days and ', "ttl_days": ' + parameters.ttl_days or '' }}${{ parameters.create_ai_foundry == false and ', "ai_hub_name": "' + parameters.ai_hub_name + '", "ai_hub_resource_group": "' + parameters.ai_hub_resource_group + '"' or '' }}
            }

    - id: create-resource-yaml
      name: Scaffold Resource YAML for Catalog
      action: fetch:template:file
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        url: ./content/resource.yaml.njk
        targetPath: >-
          ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ parameters.ref.split('/')[1] }}/resources/glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}${{ parameters.index and "-" + parameters.index or "" }}-ai.yaml
        values:
          name: >-
            glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}${{ parameters.index and "-" + parameters.index or "" }}-ai
          description: "AI Foundry project created via Backstage"
          visibility: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('entity-visibility') }}
          type: ai-foundry-project
          owner: ${{ steps['system-entity'].output.owner }}
          domain: ${{ steps['system-entity'].output.domain }}
          system: ${{ parameters.ref }}
          annotations:
            - key: nestle.com/resource-type
              value: ai-foundry-project
            - key: nestle.com/parent-system
              value: ${{ parameters.ref }}
            - key: nestle.com/region
              value: ${{ parameters.location }}
            - key: nestle.com/environment
              value: ${{ parameters.environment }}
            - key: nestle.com/solution
              value: ${{ parameters.solution }}
            - key: nestle.com/owner-email
              value: ${{ parameters.owner }}
            - key: nestle.com/ttl-days
              value: "${{ parameters.ttl_days }}"

    - id: publish-resource
      name: Create PR in Catalog Repo
      action: publish:github:pull-request
      if: ${{ parameters.disclaimer_agreement == true }}
      input:
        repoUrl: github.com?owner=nestle-devtest&repo=npet-backstage-catalog
        branchName: >-
          ai-foundry-${{ parameters.solution }}-${{ parameters.environment }}
        title: >-
          AI Foundry Project - ${{ parameters.solution }}
        description: "Backstage Resource registration for AI Foundry project created via Terraform."
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

  output:
    links:
      - title: See project dashboard 
        icon: dashboard
        url: 'https://ai.azure.com/nextgen/r/efm9gXPzTKiZ-7D9R5h28g,${{ parameters.create_ai_foundry == false and parameters.ai_hub_resource_group or "glbl-in-nextai-pilothub-euwe-rgp" }},,${{ parameters.create_ai_foundry == false and parameters.ai_hub_name or "glbl-" + ((parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts")) + "-" + parameters.solution + "-" + ((parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") or (parameters.location == "swedencentral" and "swce")) + "-resource" }},glbl-${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}-${{ parameters.solution }}-${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") or (parameters.location == "swedencentral" and "swce") }}${{ parameters.index and "-" + parameters.index or "" }}-ai/home'
      - title: Catalog Pull Request
        url: ${{ steps['publish-resource'].output.remoteUrl }}
    text:
      - title: Summary
        content: |
          ## ✅ AI Foundry Project Deployment Initiated

          Your Azure AI Foundry project has been successfully submitted for provisioning via Terraform.

          | Field            | Value                          |
          |------------------|--------------------------------|
          | **Solution**     | `${{ parameters.solution }}`   |
          | **Environment**  | `${{ parameters.environment }}` (`${{ (parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts") }}`) |
          | **Region**       | `${{ parameters.location }}` (`${{ (parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") }}`) |
          | **Rsource Group**| `${{ parameters.create_ai_foundry == false and parameters.ai_hub_resource_group or "glbl-in-nextai-pilothub-euwe-rgp" }}` |
          | **AI Foundry Name**| `${{ parameters.create_ai_foundry == false and parameters.ai_hub_name or "glbl-" + ((parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts")) + "-" + parameters.solution + "-" + ((parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") or (parameters.location == "swedencentral" and "swce")) + "-resource" }}`      |
          | **AI Foundry Project**  | `${{ "glbl-" + ((parameters.environment == "data_exploration" and "ex") or (parameters.environment == "development" and "dv") or (parameters.environment == "innovation" and "in") or (parameters.environment == "integration" and "it") or (parameters.environment == "non_production" and "np") or (parameters.environment == "pre_production" and "pp") or (parameters.environment == "production" and "pr") or (parameters.environment == "sandbox" and "sb") or (parameters.environment == "staging" and "st") or (parameters.environment == "test" and "ts")) + "-" + parameters.solution + "-" + ((parameters.location == "westeurope" and "euwe") or (parameters.location == "northeurope" and "euno") or (parameters.location == "eastus" and "usea") or (parameters.location == "eastus2" and "use2") or (parameters.location == "centralus" and "cus") or (parameters.location == "australiaeast" and "auea") or (parameters.location == "australiacentral" and "auce") or (parameters.location == "spaincentral" and "spce") or (parameters.location == "swedencentral" and "swce")) + (parameters.index and "-" + parameters.index or "") + "-ai" }}`      |
          | **Owner**        | `${{ parameters.owner }}`      |
          | **TTL (Days)**   | `${{ parameters.ttl_days }}`   |
          | **System**       | `${{ parameters.ref }}`        |
          | **Model**        | `${{ parameters.model_name }}` |
          | **Model Version**| `${{ parameters.model_version }}` |
          | **Model Format** | `${{ parameters.model_format }}` |

          > ⏳ Deployment may take up to **5 minutes** to complete.
          > If the project does not appear in the Azure Portal after 5 minutes, please contact **AlexandruIonut.Stoian@nestle.com**.
