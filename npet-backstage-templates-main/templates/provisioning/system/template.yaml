---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-create-system
  title: Create a System
  description: Creates a System with the Provisioning Process.
  annotations:
    nestle.com/template-visibility: private
spec:
  owner: group:default/aad-backstage-administrators
  type: cloud-template

  parameters:
    - title: System Parameters
      ui:order:
        - dryRun
        - createEntraIdGroup
        - groupNames
        - groupOwners
        - servicenow
      properties:
        dryRun:
          title: Dry Run Creation?
          type: boolean
          default: false
        createEntraIdGroup:
          title: Create a New EntraID Group?
          type: boolean
          default: false
        servicenow:
          title: ServiceNow
          type: object
          required:
            - ticket
            - uribase
            - environment
          properties:
            ticket:
              type: string
            uribase:
              type: string
            environment:
              type: string
            worknotes:
              type: string
      dependencies:
        createEntraIdGroup:
          allOf:
            - if:
                properties:
                  createEntraIdGroup:
                    const: true
              then:
                properties:
                  groupNames:
                    title: EntraID Group Names
                    type: array
                    minItems: 1
                    items:
                      type: string
                  groupOwners:
                    title: EntraID Group Owners
                    type: array
                    minItems: 1
                    items:
                      type: string
                # You can use additional fields of parameters within conditional parameters such as required.
                required:
                  - groupNames
                  - groupOwners

    - title: Catalog Entity Metadata Parameters
      required:
        - name
      properties:
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        namespace:
          title: Namespace
          type: string
          description: Namespace for your entity.
        annotations:
          title: Annotations
          description: Annotations for your entity.
          type: array
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                title: Key
                type: string
              value:
                title: value
                type: string
        tags:
          title: Tags
          description: Tags for your entity.
          type: array
          items:
            type: string
        visibility:
          title: Entity Visibility
          type: string
          description: Visibility of the entity inside Backstage.
          oneOf:
            - title: Internal
              const: internal
            - title: Private
              const: private

    - title: System Parameters
      required:
        - owner
        - domain
        - ownership
      properties:
        owner:
          title: Owner
          type: string
          description: Owner of the Resource.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        domain:
          title: Parent Domain
          description: Parent domain of this Resource.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Domain]
        ownership:
          title: System Ownership
          type: string
          description: |
            End-User ownership model of the System in Backstage:

            * **Fully-Managed**: The team will only have **read** access to their resources in Azure Cloud.
            * **Self-Managed**: The team will have **read/write** aspects of their resources in Azure Cloud.
          oneOf:
            - title: Fully-Managed
              const: fully-managed
            - title: Self-Managed
              const: self-managed

    - title: Catalog Repository Parameters
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nestle-devtest
              - nestle-it
            allowedRepos:
              - npet-backstage-catalog

  steps:
    - id: fetch
      action: fetch:template:file
      name: Template Payload
      input:
        url: ./content/system.yaml.njk
        targetPath: ./${{ parameters.domain.split('/')[1] }}/systems/${{ parameters.name }}/system.yaml
        values:
          # Metadata
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          description: ${{ parameters.description }}
          visibility: ${{ parameters.visibility }}
          ownership: ${{ parameters.ownership }}
          annotations: ${{ parameters.annotations }}
          tags: ${{ parameters.tags }}
          # System
          owner: ${{ parameters.owner }}
          domain:
            name: ${{ parameters.domain }}

    - id: publish
      action: publish:github:pull-request
      name: GitHub Pull Request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: entity-creation-${{ parameters.name }}
        title: Entity Creation - ${{ parameters.name }}
        description: Backstage ${{ parameters.name }} Entity Creation
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        update: true

    - id: entraid-group-create
      action: github:actions:dispatch-with-response
      name: Create EntraID Group(s)
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        branchOrTagName: main
        workflowId: entra-id-group.yaml
        waitForActionCompletion: true
        timeout: 360
        workflowInputs:
          groupNames: ${{ parameters.groupNames | string }}
          groupOwners: ${{ parameters.groupOwners | string }}
          dryRun: ${{ parameters.dryRun }}

    - id: update-servicenow-request
      action: github:actions:dispatch-with-response
      name: Update ServiceNow Request
      input:
        repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
        branchOrTagName: main
        workflowId: update-servicenow-request.yaml
        waitForActionCompletion: true
        timeout: 360
        workflowInputs:
          ticket: ${{ parameters.servicenow.ticket }}
          uribase: ${{ parameters.servicenow.uribase }}
          environment: ${{ parameters.servicenow.environment }}
          worknotes: ${{ parameters.servicenow.worknotes }}

  output:
    links:
      - title: Catalog Pull Request
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: EntraID Group Workflow Url
        url: ${{ steps['entraid-group-create'].output.workflowUrl }}
      - title: Update ServiceNow Workflow Url
        url: ${{ steps['update-servicenow-request'].output.workflowUrl }}
