---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-quay-robot-token
  title: Quay Robot Token
  description: |
    Creates the Quay robot account of a regional System and publishes its token.

    There is one robot per System, named `{scope}_{system}`, living in the
    `idp_devops` organization of the ARO Quay instance — the same registry the
    ARO Application template uses.

    This template:
    - Looks up the Key Vault Resource of every environment of the System in the
      catalog, and stops before creating anything if one is missing
    - Creates the robot, or returns the existing one when it has already been created
    - Stores its pull secret as `quay-robot-token` in the Key Vault of every
      environment of the System, in the docker `auths` format the ARO image pull
      secrets expect
    - Publishes the robot token as a GitHub organization Actions secret

    The organization secret is created with `selected` visibility and **no
    repositories granted yet** — grant the repositories that push images to Quay
    from the GitHub Secrets page in Backstage.

    Re-running the template is safe: Quay returns the existing robot and its token,
    so the Key Vault and organization secrets are simply rewritten with the same
    value.
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - end-user
    - regional
    - aro
    - quay
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: cloud-template

  parameters:
    - $yaml: ../../../parameters/provisioning/regional-system-picker.yaml

  steps:
    - $yaml: ../../../steps/catalog/assert-system-techlead-create.yaml


    - id: hostname-lookup
      action: nestle:backstage-hostname-lookup
      name: Hostname Lookup

    - id: system-entity
      action: catalog:get:entity:data
      name: Get System Entity
      input:
        ref: ${{ parameters.system }}

    - $yaml: ../../../steps/catalog/get-entities-config.yaml

    - id: variablizer-quay
      action: nestle:backstage:variablizer
      name: Build Quay Variables
      input:
        variables:
          host: quay.apps.ektnlbrn.westeurope.aroapp.io
          organization: idp_devops
          # One robot per System. The Quay action turns dashes into underscores,
          # so the robot shows up as `idp_devops+{scope}_{solution}_{context}`.
          quayRobotName: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope') }}_${{ steps['system-entity'].output.name | replace('-', '_') }}
          # Organization secrets share one namespace across the whole GitHub
          # organization, so the name carries the System it belongs to.
          orgSecretName: ${{ ('QUAY_ROBOT_TOKEN_' ~ (steps['system-entity'].output.annotations | parseEntityAnnotations('nestle.com/scope')) ~ '_' ~ steps['system-entity'].output.name) | upper | replace('-', '_') }}
          # Environments configured on the System — one Key Vault exists per entry.
          environments: ${{ steps['system-entity'].output.annotations | parseEntityAnnotations('br.nestle.com/environments', true) }}

    # Key Vault names are not derived from the System name: `-core`/`-smanager`
    # Systems follow their own conventions and names are shortened to fit Azure's
    # 24-character limit. Read the real name from the key-vault Resource of each
    # environment, which is part of the System in the catalog.
    - id: keyvault-lookup
      action: http:backstage:request
      name: Look Up System Key Vaults
      each: ${{ steps['variablizer-quay'].output.environments }}
      input:
        method: GET
        path: /catalog/entities/by-query?filter=kind=resource,spec.type=key-vault,relations.partOf=${{ parameters.system | lower }},metadata.annotations.br.nestle.com/environment=${{ each.value.name }}
        headers:
          content-type: application/json

    - id: fail-if-keyvault-not-found
      action: nestle:error
      name: Fail if a Key Vault Is Missing
      each: ${{ steps['variablizer-quay'].output.environments }}
      if: ${{ (steps['keyvault-lookup'].output.body[each.key].items | length) != 1 }}
      input:
        error: |
          Error: expected exactly one key-vault Resource for the `${{ each.value.name }}` environment of `${{ parameters.system }}`, found ${{ steps['keyvault-lookup'].output.body[each.key].items | length }}. Check the System's Resources in the catalog.

    - id: variablizer-quay-env
      action: nestle:backstage:variablizer
      name: Build System Key Vault URIs
      each: ${{ steps['variablizer-quay'].output.environments }}
      input:
        variables:
          keyVaultName: ${{ steps['keyvault-lookup'].output.body[each.key].items[0].metadata.name }}
          keyVaultUri: https://${{ steps['keyvault-lookup'].output.body[each.key].items[0].metadata.name }}.vault.azure.net/

    - id: quay-create-robot
      action: redhat-quay:create-robot
      name: Create Quay Robot
      input:
        name: ${{ steps['variablizer-quay'].output.quayRobotName }}
        namespace: ${{ steps['variablizer-quay'].output.organization }}

    - id: store-quay-token-keyvault
      action: azure-portal:create-keyvault-secret
      name: Store Quay Robot Token in the System Key Vault
      each: ${{ steps['variablizer-quay'].output.environments }}
      input:
        keyVaultUri: ${{ steps['variablizer-quay-env'].output.keyVaultUri[each.key] }}
        secretName: quay-robot-token
        secretValue: |
          {"auths":{"${{ steps['variablizer-quay'].output.host }}":{"username":"${{ steps['quay-create-robot'].output.name }}","password":"${{ steps['quay-create-robot'].output.token }}"}}}

    # Only the owner of `repoUrl` is used — the action reads it to resolve the
    # GitHub organization the secret is created in.
    #
    # `selectedRepositoryIds` is deliberately empty: the secret is created with no
    # repository able to read it, and repositories are granted afterwards from the
    # GitHub Secrets page in Backstage. None of the scaffolder actions available
    # here can resolve a repository name to the numeric id this input expects, and
    # `all`/`private` visibility would expose the System's robot token to every
    # repository in the organization.
    - id: quay-org-secret
      action: github:org:secret:create-or-update
      name: Publish Quay Robot Token as an Organization Secret
      input:
        repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=npet-backstage-catalog
        secretName: ${{ steps['variablizer-quay'].output.orgSecretName }}
        secretValue: ${{ steps['quay-create-robot'].output.token }}
        visibility: selected
        selectedRepositoryIds: []

  output:
    text:
      - title: Quay Robot Token Published
        content: |
          **Robot:** `${{ steps['quay-create-robot'].output.name }}`

          **Registry:** `${{ steps['variablizer-quay'].output.host }}`

          **Key Vault secret:** `quay-robot-token`, written to the Key Vault of every
          environment of `${{ steps['system-entity'].output.name }}`
          (`${{ steps['variablizer-quay-env'].output.keyVaultName | join('`, `') }}`).

          **Organization secret:** `${{ steps['quay-org-secret'].output.secretName }}`
          in `${{ steps.getEntitiesConfig.output.entities.owner }}`, with
          `${{ steps['quay-org-secret'].output.visibility }}` visibility and no
          repositories granted yet — grant the repositories that push images to Quay
          from the GitHub Secrets page in Backstage.
    links:
      - title: Quay Organization
        url: https://quay.apps.ektnlbrn.westeurope.aroapp.io/organization/idp_devops
      - title: Parent System
        url: /catalog/${{ steps['system-entity'].output.namespace }}/system/${{ steps['system-entity'].output.name }}
