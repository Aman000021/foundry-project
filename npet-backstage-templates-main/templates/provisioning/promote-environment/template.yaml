---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provisioning-promote-environment
  title: Promote System Environment
  description: |
    This template facilitates the promotion of resources from one environment to another,
    ensuring a streamlined process for deploying changes across test, production,
    or other environments. It helps maintain consistency and reduces the risk associated
    with manual promotions.
  annotations:
    nestle.com/template-visibility: private
    nestle.com/template-scope: regional
  tags:
    - promoteenvironment
    - system
    - components
spec:
  owner: group:default/aad-sg-backstage-ams-admins
  type: service

  parameters:
    - $yaml: ../../../parameters/provisioning/promote-environment.yaml

  steps:
    - $yaml: ../../../steps/catalog/get-entities-config.yaml
    - $yaml: ../../../steps/provisioning/promote-environment/clone.yaml
    - $yaml: ../../../steps/provisioning/promote-environment/promote.yaml
    - $yaml: ../../../steps/provisioning/promote-environment/push.yaml

  output:
    links:
      - title: Promotion Pull Request
        url: ${{ steps['publishEntitiesPr'].output.remoteUrl }}
