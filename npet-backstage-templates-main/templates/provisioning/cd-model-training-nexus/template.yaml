apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nexus-cd-pipeline-run
  title: "Nexus CD Pipeline - Azure DevOps"
  description: >
    Launches the Nexus CD pipeline in Azure DevOps. Allows configuring
    model deployment to batch and managed endpoints, model governance,
    data drift checks, and Bento packaging directly from Backstage.
  
  annotations:
    nestle.com/template-visibility: internal
    github.com/project-slug: nestle-it/roasterdeszw-argocd
  tags:
    - azure-devops
    - mlops
    - nexus
    - data-ingestion
spec:
  owner: group:default/AAD-SG-backstage-innovation
  type: cd-pipeline

  parameters:
    - title: Azure DevOps Pipeline branch
      description: Select the Azure DevOps branch to run the pipeline against.
      required:
        - branch
      properties:
        branch:
          title: Branch
          type: string
          enum: ["PRD", "PPD", "dev"]
          description: Branch to run the pipeline against.
          default: PRD


    - title: Model Selection
      description: Select the model type, name, and version to deploy.
      required:
        - pipelineId
        - ref
      properties:

        ref:
          title: Parent System
          default: system:default/itinnovation-global
          ui:widget: hidden
          description: System to associate this Resource Group to.
          type: string
          ui:field: OwnedEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
              
        organization:
          title: Organization
          type: string
          description: Azure DevOps organization name.
          default: nestle-it
          ui:widget: hidden

        project:
          title: Project
          type: string
          description: Azure DevOps project name.
          ui:widget: hidden
          default: aipcroasterdeszw

        pipelineId:
          title: Pipeline ID
          type: number
          default: 14167
          ui:widget: hidden
          description: >
            Numeric ID of the CD pipeline in Azure DevOps.
            You can find it in the URL of the pipeline page.


        model_type:
          title: Model Type
          type: string
          default: "Codebase"
          enum:
            - "Codebase"
            - "AutoML"
          description: Type of model to deploy.

        model_name:
          title: Model Name
          type: string
          default: "not set"
          description: >
            Model name to deploy, overrides .azure-pipelines/variables/config-aml-*.yml. 
            Must be a valid model name. Default 'not set' which uses config-aml-*.yml value.

        model_version:
          title: Model Version
          type: string
          default: "not set"
          description: >
            Model version to deploy, overrides .azure-pipelines/variables/config-aml-*.yml.
            Can be a number, "latest", or "latestDeployed".
            Default 'not set' which uses config-aml-*.yml value.

    - title: Endpoint Deployment
      description: Configure batch and managed endpoint deployment options.
      properties:
        run_batch_endpoint:
          title: Run Batch Endpoint
          type: string
          default: "False"
          enum: ["True", "False"]
          description: Deploy the model to a batch endpoint.

        batch_endpoint_name:
          title: Batch Endpoint Name
          type: string
          default: "not set"
          description: >
            Name of the batch endpoint, overrides .azure-pipelines/variables/config-aml-*.yml.
            Must be a valid batch endpoint name.
            Default 'not set' which uses config-aml-*.yml value.

        run_managed_endpoint:
          title: Run Managed Endpoint
          type: string
          default: "False"
          enum: ["True", "False"]
          description: Deploy the model to a managed online endpoint.

        managed_endpoint_name:
          title: Managed Endpoint Name
          type: string
          default: "not set"
          description: >
            Name of the managed endpoint, overrides .azure-pipelines/variables/config-aml-*.yml.
            Must be a valid managed endpoint name.
            Default 'not set' which uses config-aml-*.yml value.

        delete_endpoints:
          title: Delete Endpoints
          type: string
          default: "False"
          enum: ["True", "False"]
          description: >
            Delete the specified endpoints after the CD pipeline finishes.

    - title: Governance & Monitoring
      description: Configure model governance and data drift checks.
      properties:
        run_model_governance:
          title: Run Model Governance
          type: string
          default: "False"
          enum: ["True", "False"]
          description: Execute model governance checks.

        check_data_drift:
          title: Check Data Drift
          type: string
          default: "False"
          enum: ["True", "False"]
          description: Run data drift detection analysis.

    - title: Advanced Options
      description: Additional pipeline configuration. All fields are optional.
      properties:
        bento:
          title: Bento Packaging
          type: string
          default: "True"
          enum: ["True", "False"]
          description: >
            Create Bento Model — push inference image to ACR (BentoML).

        use_job_container:
          title: Use Private Pool
          type: string
          default: "False"
          enum: ["True", "False"]
          description: >
            Run the pipeline in a private pool.
            If False, uses the global AKS pool.

        waitForCompletion:
          title: Wait for Pipeline to Complete?
          type: boolean
          default: false
          description: >
            If true, Backstage will wait for the pipeline to finish and show
            the result. This may take a long time for full CD runs.

  steps:
    - action: catalog:get:entity:data
      id: system-entity
      name: Get System Entity
      input:
        ref: ${{ parameters.ref }}

    - id: run-azure-pipeline
      name: Run Nexus CD Pipeline
      action: azure:pipeline:run
      input:
        organization: ${{ parameters.organization }}
        project: ${{ parameters.project }}
        pipelineId: ${{ parameters.pipelineId }}
        branch: ${{ parameters.branch }}
        waitForPipelineCompletion: ${{ parameters.waitForCompletion }}
        templateParameters:
          model_type:             ${{ parameters.model_type }}
          model_name:             ${{ parameters.model_name }}
          model_version:          ${{ parameters.model_version }}
          use_job_container:      ${{ parameters.use_job_container }}
          run_model_governance:   ${{ parameters.run_model_governance }}
          run_batch_endpoint:     ${{ parameters.run_batch_endpoint }}
          batch_endpoint_name:    ${{ parameters.batch_endpoint_name }}
          run_managed_endpoint:   ${{ parameters.run_managed_endpoint }}
          managed_endpoint_name:  ${{ parameters.managed_endpoint_name }}
          delete_endpoints:       ${{ parameters.delete_endpoints }}
          check_data_drift:       ${{ parameters.check_data_drift }}
          bento:                  ${{ parameters.bento }}

  output:
    links:
      - title: View Pipeline Run in Azure DevOps
        url: ${{ steps['run-azure-pipeline'].output.pipelineUrl }}
        icon: dashboard
    text:
      - title: Pipeline Result
        icon: list
        content: ${{ steps['run-azure-pipeline'].output.pipelineResult }}
      - title: Request Approval
        icon: person
        content: "Please request approval to deploy the model to gerard.campanya@es.nestle.com"
