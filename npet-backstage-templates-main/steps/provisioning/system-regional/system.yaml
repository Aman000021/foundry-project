# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
# and resolve-environments (steps/provisioning/system-regional/resource-group-create.yaml)
- id: fetch-system
  action: fetch:template:file
  name: Template System Payload
  input:
    url: ../../../.templateable-content/provisioning/system-regional.yaml.njk
    targetPath: ./${{ parameters.domain.split('/')[1] }}/systems/${{ parameters.name }}/system.yaml
    values:
      # Identity
      name: ${{ parameters.name }}
      namespace: ${{ parameters.name.split('-')[0] }}
      solutionName: ${{ parameters.name.split('-')[0] }}
      context: ${{ parameters.name.split('-')[1] }}
      description: ${{ parameters.description }}
      scope: ${{ parameters.scope }}
      domain:
        name: ${{ parameters.domain }}
      visibility: private
      owner: group:default/${{ ('aad-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'aad-backstage-') + parameters.scope + '-' + parameters.name + '-members' }}
      ownership: fully-managed
      generateDomain: ${{ parameters.generateDomain }}
      # Ownership
      requester: ${{ parameters.requester }}
      technicalOwner: ${{ parameters.technicalOwner }}
      functionalOwner: ${{ parameters.functionalOwner }}
      financialOwner: ${{ parameters.financialOwner }}
      billingContact: ${{ parameters.billingContact }}
      # Compliance
      department: ${{ parameters.department }}
      apmId: ${{ parameters.apmId }}
      market: ${{ parameters.market }}
      marketFullName: ${{ parameters.marketFullName }}
      costCenter: ${{ parameters.costCenter }}
      costPlan: ${{ parameters.costPlan }}
      dataClassification: ${{ parameters.dataClassification }}
      pii: ${{ parameters.pii }}
      network: ${{ parameters.network }}
      sharedCost: ${{ parameters.sharedCost }}
      ticket: ${{ parameters.ticket }}
      # Cluster
      # The deployment target is not recorded here: it is a per-environment fact,
      # annotated on each base Resource by resource-base.yaml.
      clusterType: ${{ 'aro' if parameters.clusterType == 'aro' and each.value.name in parameters.aroEnvironments else '' }}
      cluster: ${{ parameters.cluster }}
      # Subscriptions of created Resource Groups come from the Resource Group pipeline.
      environments: ${{ steps['resolve-environments'].output.environment }}
      # Technical Team
      techleads: ${{ parameters.techleads }}
      members: ${{ parameters.members }}
      # Features
      features: ${{ parameters.features }}
      # Computed
      createdAt: ${{ "" | now }}
      updatedAt: ${{ "" | now }}
      gitOpsRepoUrl: ${{ parameters.gitopsRepoUrl if parameters.gitopsAlreadyExists else "https://github.com/" + steps.getEntitiesConfig.output.entities.owner + "/" + parameters.scope + "-" + parameters.name + "-gitops.git" }}
      githubTeam: ${{ parameters.scope }}-${{ parameters.name }}-write
