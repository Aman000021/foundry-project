# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
#
# The cto-token secret the smanager application authenticates with. The Resource
# is named `{env}-cto-token` — it is unique inside the `{name}-smanager` namespace.
- id: fetch-resource-strongpassword
  action: fetch:template:file
  name: Template Resource Payload — smanager cto-token
  each: ${{ parameters.environments }}
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ parameters.domain.split('/')[1] }}/systems/${{ parameters.name }}-smanager/resources/${{ each.value.name }}-cto-token.yaml
    values:
      name: ${{ each.value.name }}-cto-token
      namespace: ${{ parameters.name }}-smanager
      description: strong password owned by the system ${{ parameters.name }}-smanager (${{ each.value.name }})
      visibility: private
      type: strongpassword
      owner: group:default/${{ ('aad-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'aad-backstage-') + parameters.scope + '-' + parameters.name + '-smanager-members' }}
      domain: ${{ parameters.domain }}
      system: system:${{ parameters.name }}-smanager/${{ parameters.name }}-smanager
      annotations:
        - key: nestle.com/system-type
          value: regional
        - key: br.nestle.com/created-at
          value: ${{ "" | now }}
        - key: br.nestle.com/environment
          value: ${{ each.value.name }}
        - key: br.nestle.com/domain
          value: ${{ parameters.name }}
        - key: br.nestle.com/secret-name
          value: cto-token
      tags: []
      dependsOn: []
      dependencyOf: []
