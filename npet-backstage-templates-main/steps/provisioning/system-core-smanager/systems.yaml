# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
#
# Both Systems share the organization, compliance, ownership and team data of the
# request. They differ in name, namespace, context, description, features, GitOps
# repository and GitHub team. `br.nestle.com/cluster` points at `<name>-core` on
# both, because the AKS cluster is created on the core System and the smanager
# workloads run on it.
- id: fetch-system-core
  action: fetch:template:file
  name: Template System Payload — core
  input:
    url: ../../../.templateable-content/provisioning/system-regional.yaml.njk
    targetPath: ./${{ parameters.domain.split('/')[1] }}/systems/${{ parameters.name }}-core/system.yaml
    values:
      # Identity
      name: ${{ parameters.name }}-core
      namespace: ${{ parameters.name }}-core
      solutionName: ${{ parameters.name }}
      context: core
      description: ${{ parameters.coreDescription }}
      scope: ${{ parameters.scope }}
      domain:
        name: ${{ parameters.domain }}
      visibility: private
      owner: group:default/${{ ('aad-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'aad-backstage-') + parameters.scope + '-' + parameters.name + '-core-members' }}
      ownership: fully-managed
      generateDomain: ${{ parameters.generateDomain }}
      # Ownership
      requester: ${{ parameters.requester }}
      technicalOwner: ${{ parameters.technicalOwner }}
      functionalOwner: ${{ parameters.functionalOwner }}
      financialOwner: ${{ parameters.financialOwner }}
      billingContact: ${{ parameters.billingContact }}
      # Compliance
      department: ${{ parameters.department }}
      apmId: ${{ parameters.apmId }}
      market: ${{ parameters.market }}
      marketFullName: ${{ parameters.marketFullName }}
      costCenter: ${{ parameters.costCenter }}
      costPlan: ${{ parameters.costPlan }}
      dataClassification: ${{ parameters.dataClassification }}
      pii: ${{ parameters.pii }}
      network: ${{ parameters.network }}
      sharedCost: ${{ parameters.sharedCost }}
      ticket: ${{ parameters.ticket }}
      # Cluster — the AKS cluster created on this System
      cluster: ${{ parameters.name }}-core
      environments: ${{ parameters.environments }}
      # Technical Team
      techleads: ${{ parameters.techleads }}
      members: ${{ parameters.members }}
      # Features
      features: ${{ parameters.coreFeatures }}
      # Computed
      createdAt: ${{ "" | now }}
      updatedAt: ${{ "" | now }}
      gitOpsRepoUrl: ${{ parameters.coreGitopsRepoUrl if parameters.gitopsAlreadyExists else "https://github.com/" + steps.getEntitiesConfig.output.entities.owner + "/" + parameters.scope + "-" + parameters.name + "-core-gitops.git" }}
      githubTeam: ${{ parameters.scope }}-${{ parameters.name }}-core-write

- id: fetch-system-smanager
  action: fetch:template:file
  name: Template System Payload — smanager
  input:
    url: ../../../.templateable-content/provisioning/system-regional.yaml.njk
    targetPath: ./${{ parameters.domain.split('/')[1] }}/systems/${{ parameters.name }}-smanager/system.yaml
    values:
      # Identity
      name: ${{ parameters.name }}-smanager
      namespace: ${{ parameters.name }}-smanager
      solutionName: ${{ parameters.name }}
      context: smanager
      description: ${{ parameters.smanagerDescription }}
      scope: ${{ parameters.scope }}
      domain:
        name: ${{ parameters.domain }}
      visibility: private
      owner: group:default/${{ ('aad-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'aad-backstage-') + parameters.scope + '-' + parameters.name + '-smanager-members' }}
      ownership: fully-managed
      generateDomain: ${{ parameters.generateDomain }}
      # Ownership
      requester: ${{ parameters.requester }}
      technicalOwner: ${{ parameters.technicalOwner }}
      functionalOwner: ${{ parameters.functionalOwner }}
      financialOwner: ${{ parameters.financialOwner }}
      billingContact: ${{ parameters.billingContact }}
      # Compliance
      department: ${{ parameters.department }}
      apmId: ${{ parameters.apmId }}
      market: ${{ parameters.market }}
      marketFullName: ${{ parameters.marketFullName }}
      costCenter: ${{ parameters.costCenter }}
      costPlan: ${{ parameters.costPlan }}
      dataClassification: ${{ parameters.dataClassification }}
      pii: ${{ parameters.pii }}
      network: ${{ parameters.network }}
      sharedCost: ${{ parameters.sharedCost }}
      ticket: ${{ parameters.ticket }}
      # Cluster — the smanager workloads run on the cluster of the core System
      cluster: ${{ parameters.name }}-core
      environments: ${{ parameters.environments }}
      # Technical Team
      techleads: ${{ parameters.techleads }}
      members: ${{ parameters.members }}
      # Features
      features: ${{ parameters.smanagerFeatures }}
      # Computed
      createdAt: ${{ "" | now }}
      updatedAt: ${{ "" | now }}
      gitOpsRepoUrl: ${{ parameters.smanagerGitopsRepoUrl if parameters.gitopsAlreadyExists else "https://github.com/" + steps.getEntitiesConfig.output.entities.owner + "/" + parameters.scope + "-" + parameters.name + "-smanager-gitops.git" }}
      githubTeam: ${{ parameters.scope }}-${{ parameters.name }}-smanager-write
