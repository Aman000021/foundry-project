# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
- id: entraid-populate-techleads
  if: ${{ parameters.techleads.length > 0 }}
  name: Populate Tech Leads EntraID Groups
  description: Sync the -techleads EntraID group membership of both Systems to the tech leads list.
  each: ${{ ['core', 'smanager'] }}
  action: github:actions:dispatch-with-response
  input:
    repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
    branchOrTagName: main
    workflowId: entra-id-group-members.yaml
    waitForActionCompletion: true
    timeout: 360
    workflowInputs:
      groupName: ${{ ('AAD-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'AAD-backstage-') + parameters.scope + '-' + parameters.name + '-' + each.value + '-techleads' }}
      members: ${{ parameters.techleads | join(',') }}
      mode: sync
      dryRun: false

- id: entraid-populate-members
  if: ${{ parameters.members.length + parameters.techleads.length > 0 }}
  name: Populate Members EntraID Groups
  description: Sync the -members EntraID group membership of both Systems to members plus tech leads.
  each: ${{ ['core', 'smanager'] }}
  action: github:actions:dispatch-with-response
  input:
    repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
    branchOrTagName: main
    workflowId: entra-id-group-members.yaml
    waitForActionCompletion: true
    timeout: 360
    workflowInputs:
      groupName: ${{ ('AAD-devtest-backstage-' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'AAD-backstage-') + parameters.scope + '-' + parameters.name + '-' + each.value + '-members' }}
      members: ${{ parameters.members.concat(parameters.techleads) | join(',') }}
      mode: sync
      dryRun: false

- id: entraid-populate-umbrella
  if: ${{ parameters.techleads.length > 0 }}
  name: Add Tech Leads to Regional Umbrella Group
  description: Add the tech leads to the regional techleads umbrella EntraID group (additive only — removals are handled by the scheduled reconcile).
  action: github:actions:dispatch-with-response
  input:
    repoUrl: github.com?owner=nestle-it&repo=npet-backstage-automation
    branchOrTagName: main
    workflowId: entra-id-group-members.yaml
    waitForActionCompletion: true
    timeout: 360
    workflowInputs:
      groupName: ${{ 'AAD-devtest-backstage-regional-techleads' if steps.getEntitiesConfig.output.entities.owner == 'nestle-devtest' else 'AAD-backstage-regional-techleads' }}
      members: ${{ parameters.techleads | join(',') }}
      mode: add
      dryRun: false
