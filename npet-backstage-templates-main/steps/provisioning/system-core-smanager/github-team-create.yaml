# Requires a prior getEntitiesConfig step in the including template (steps/catalog/get-entities-config.yaml)
- id: github-team-create-core
  if: ${{ parameters.createGitHubTeam }}
  name: Create Core GitHub Team
  description: Create the GitHub team of the core System.
  action: github:teams:create
  input:
    repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
    teamName: ${{ parameters.scope }}-${{ parameters.name }}-core-write
    maintainers: []
    members: ${{ parameters.members.concat(parameters.techleads) }}

- id: github-team-create-smanager
  if: ${{ parameters.createGitHubTeam }}
  name: Create Smanager GitHub Team
  description: Create the GitHub team of the smanager System.
  action: github:teams:create
  input:
    repoUrl: github.com?owner=${{ steps.getEntitiesConfig.output.entities.owner }}&repo=${{ steps.getEntitiesConfig.output.entities.repoName }}
    teamName: ${{ parameters.scope }}-${{ parameters.name }}-smanager-write
    maintainers: []
    members: ${{ parameters.members.concat(parameters.techleads) }}
