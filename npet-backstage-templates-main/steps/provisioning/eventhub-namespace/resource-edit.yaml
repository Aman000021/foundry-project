- id: fetch-resource-eventhub-namespace-edit
  action: fetch:template:file
  name: Template Resource Payload — eventhub-namespace (updated)
  input:
    url: ../../../.templateable-content/catalog/resource.yaml.njk
    targetPath: ./${{ steps['system-entity'].output.domain.split('/')[1] }}/systems/${{ steps['entity'].output.namespace }}/resources/${{ steps['entity'].output.name }}.yaml
    values:
      name: ${{ steps['entity'].output.name }}
      namespace: ${{ steps['entity'].output.namespace }}
      description: ${{ steps['entity'].output.description if steps['entity'].output.description else 'eventhub-namespace resource owned by system ' + steps['entity'].output.namespace + ' (' + (steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/environment')) + ')' }}
      visibility: ${{ steps['entity'].output.annotations | parseEntityAnnotations('nestle.com/entity-visibility') }}
      type: eventhub-namespace
      owner: ${{ steps['entity'].output.owner }}
      domain: ${{ steps['system-entity'].output.domain }}
      system: ${{ steps['entity'].output.system }}
      resourceProperties: {}
      resourceTags: {}
      annotations:
        - key: br.nestle.com/created-at
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/created-at') }}
        - key: br.nestle.com/updated-at
          value: ${{ "" | now }}
        - key: br.nestle.com/environment
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/environment') }}
        - key: br.nestle.com/domain
          value: ${{ steps['entity'].output.namespace.split('-')[0] }}
        - key: nestle.com/system-type
          value: regional
        - key: br.nestle.com/sku
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/sku') }}
        - key: br.nestle.com/capacity
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/capacity') }}
        - key: br.nestle.com/specific-ip-ranges
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/specific-ip-ranges') }}
        - key: br.nestle.com/specific-subnets
          value: ${{ steps['entity'].output.annotations | parseEntityAnnotations('br.nestle.com/specific-subnets') }}
        - key: br.nestle.com/children
          value: ${{ parameters.eventHubs | dump }}
      tags:
        - eventhub
      links: []
      dependsOn: []
      dependencyOf: []
