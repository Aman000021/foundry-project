name: Foundry Agent Service and Hosted Agent Deployment
run-name: MS Foundry Project Creation [${{ inputs.UUID }}]

on:
  workflow_dispatch:
    inputs:
      environment: { type: string, required: true }
      capability: { type: string, required: true }
      segment: { type: string, required: true }
      location: { type: string, required: true }
      appName: { type: string, required: true }
      builderAADgroup: { type: string, required: true }
      readerAADgroup: { type: string, required: true }
      consumerAADgroup: { type: string, required: true }
      agentmgrAADgroup: { type: string, required: true }
      snowNumber: { type: string, required: true }
      umiObjectId: { type: string, required: false }
      tagsJson: { type: string, required: false }
      UUID: { description: 'UUID for Backstage dispatch-with-response tracking', required: false, default: '' }
        
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      capability: { type: string, required: true }
      segment: { type: string, required: true }
      location: { type: string, required: true }
      appName: { type: string, required: true }
      builderAADgroup: { type: string, required: true }
      readerAADgroup: { type: string, required: true }
      consumerAADgroup: { type: string, required: true }
      agentmgrAADgroup: { type: string, required: true }
      snowNumber: { type: string, required: true }
      umiObjectId: { type: string, required: false }
      tagsJson: { type: string, required: false }

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  Deploy-Agent-Service:
         if: ${{ github.event.inputs.capability == 'agentservice' }}
         uses: ./.github/workflows/agent-service-deploy.yml
         with: 
             environment: 'dv'
             segment: ${{ github.event.inputs.segment }}
             location: ${{ github.event.inputs.location }}
             appName: ${{ github.event.inputs.appName }}
             builderAADgroup: ${{ github.event.inputs.builderAADgroup }}
             readerAADgroup: ${{ github.event.inputs.readerAADgroup }}
             snowNumber: ${{ github.event.inputs.snowNumber }}
            #  branch: ${{ github.ref_name }}
         secrets: inherit

  Deploy-Hosted-Agent-Service:
         if: ${{ github.event.inputs.capability == 'hostedagent' }}
         uses: ./.github/workflows/hosted-agent-deploy.yml
         with: 
             environment: ${{ github.event.inputs.environment }}
             segment: ${{ github.event.inputs.segment }}
             location: ${{ github.event.inputs.location }}
             appName: ${{ github.event.inputs.appName }}
             builderAADgroup: ${{ github.event.inputs.builderAADgroup }}
             readerAADgroup: ${{ github.event.inputs.readerAADgroup }}
             consumerAADgroup: ${{ github.event.inputs.consumerAADgroup }}
             agentmgrAADgroup: ${{ github.event.inputs.agentmgrAADgroup }}
             snowNumber: ${{ github.event.inputs.snowNumber }}
             umiObjectId: ${{ github.event.inputs.umiObjectId }}
             tagsJson: ${{ github.event.inputs.tagsJson }}
         secrets: inherit