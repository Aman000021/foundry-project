# This is a sample on how to deploy both infrastructure as well as code.  This workflow calls a separate workflow from a different repository
# To make sure you deploy the correct environments change the default environments to your personal environments
# For example if you have environments (dv, np, pr) change the environment: 'ts' to 'np' as well as 'pp' to 'pr'

name: Trigger Foundry Setup

on:
 workflow_dispatch:
   inputs:
     choice:
       description: 'Environments'
       required: false
       type: choice
       default: 'DV only'
       options:
         - Deploy Dev Platform
         - Deploy Dev Agent Service
         - Deploy PP Platform
         - Deploy PP Agent Service         
         - Deploy Prod Platform
         - Deploy Prod Agent Service
     segment:
       description: 'Project Segment'
       required: true
       type: choice
       options:
         - marketing
         - finance
         - operations
         - dev01
         - dev02
         - it
     location:
       description: 'Project Location'
       required: true
       type: choice
       options:
         - europe
  
permissions:
    id-token: write
    contents: read
    issues: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
     Deploy-Dev-Platform:
         if: ${{ github.event.inputs.choice == 'Deploy Dev Platform' }}
         uses: ./.github/workflows/platform-deploy.yml
         with: 
             environment: 'dv'
             segment: ${{ github.event.inputs.segment }}
             location: ${{ github.event.inputs.location }}
            #  branch: ${{ github.ref_name }}
         secrets: inherit

