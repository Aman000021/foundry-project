name: Foundry Hosted Agent Project Deployment
run-name: MS Foundry Hosted Agent Project Creation [${{ inputs.UUID }}]

on:
  workflow_dispatch:
    inputs:
      environment: { type: string, required: true }
      segment: { type: string, required: true }
      location: { type: string, required: true }
      appName: { type: string, required: true }
      builderAADgroup: { type: string, required: true }
      readerAADgroup: { type: string, required: true }
      # projectTags: { type: string, required: true }
      snowNumber: { type: string, required: true }
      # umiObjectId: { type: string, required: true }
      tagsJson: { type: string, required: true }
      UUID: { description: 'UUID for Backstage dispatch-with-response tracking', required: false, default: '' }
        
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      segment: { type: string, required: true }
      location: { type: string, required: true }
      appName: { type: string, required: true }
      builderAADgroup: { type: string, required: true }
      readerAADgroup: { type: string, required: true }
      snowNumber: { type: string, required: true }
      # umiObjectId: { type: string, required: true }
      tagsJson: { type: string, required: true }
      # projectTags: { type: string, required: true }

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ inputs.environment }}
    env:
      ENV_PATH: "${{github.workspace}}/environments/${{ inputs.environment }}/${{ inputs.location }}"
      ARM_TENANT_ID: ${{ vars.TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: iac/capability/hosted-agent-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Generate a token
        id: generate_token_for_accessing_modules
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NPET_REGISTRY_APPID }}
          private-key: ${{ secrets.NPET_REGISTRY_PRIVATE_KEY }}
          owner: "nestle-it"

      - name: Setup Tags as JSON
        shell: bash
        run: |
          echo '${{ inputs.tagsJson }}' > tf_tags.json

      - name: Set foundry index
        id: index
        env:
          MARKETING_INDEX: ${{ vars.mkt_foundry_index }}
          FINANCE_INDEX: ${{ vars.fin_foundry_index }}
          INNOVATION_INDEX: ${{ vars.inn_foundry_index }}
          HUMAN_RESOURCE: ${{ vars.hrs_foundry_index }}
          SUPPLY_CHAIN: ${{ vars.sch_foundry_index }}
          TECHNICAL_PRODUCTION: ${{ vars.tec_foundry_index }}
          DEV_INDEX: ${{ vars.dev01_foundry_index }}
          IT_INDEX: ${{ vars.it_foundry_index }}
          OPERATIONS_INDEX: ${{ vars.ops_foundry_index }}
        run: |
          if [ ${{ inputs.segment }} = "marketing" ]; then
            echo "foundry_index=$MARKETING_INDEX" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "finance" ]; then
            echo "foundry_index=$FINANCE_INDEX" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "humanResource" ]; then
            echo "foundry_index=$HUMAN_RESOURCE" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "innovation" ]; then
            echo "foundry_index=$INNOVATION_INDEX" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "supplyChain" ]; then
            echo "foundry_index=$SUPPLY_CHAIN" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "technicalProduction" ]; then
            echo "foundry_index=$TECHNICAL_PRODUCTION" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "dev01" ]; then
            echo "foundry_index=$DEV_INDEX" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "it" ]; then
            echo "foundry_index=$IT_INDEX" >> "$GITHUB_ENV"
          elif [ ${{ inputs.segment }} = "operations" ]; then
            if [ -z "$OPERATIONS_INDEX" ]; then
              echo "::error::Set the ops_foundry_index variable in the dv GitHub Environment before deploying operations."
              exit 1
            fi
            echo "foundry_index=$OPERATIONS_INDEX" >> "$GITHUB_ENV"
          fi
          echo $foundry_index

      - name: Terraform init
        run: |
          # this ugly command will instruct git to use non-default token we retrieved above to access any git repo:
          git config --global url."https://x-access-token:${{ steps.generate_token_for_accessing_modules.outputs.token }}@github.com/nestle-it".insteadOf "https://github.com/nestle-it"
          terraform init \
          -backend-config="${{ env.ENV_PATH }}/${{ inputs.segment }}/backend-config-project.tfvars" \
          -backend-config="key=backend-${{ inputs.segment }}-${{ inputs.appName }}-${{ inputs.snowNumber }}.tfstate"
        
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
          -var-file="${{ env.ENV_PATH }}/${{ inputs.segment }}/hosted-agent-service.tfvars" \
          -var="tags=tf_tags.json" \
          -var="project_segment=${{ inputs.segment }}" \
          -var="foundry_location=${{ inputs.location }}" \
          -var="project_name=${{ inputs.appName }}" \
          -var="agent_builder_group_id=${{ inputs.builderAADgroup }}" \
          -var="account_reader_group_id=${{ inputs.readerAADgroup }}" \
          -var="foundry_index=${foundry_index}" \
          -out=hostedagenttfplan
# -var="umi_object_id=${{ inputs.umiObjectId }}" \
          
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-hosted-agent
          path: iac/capability/hosted-agent-service/hostedagenttfplan

  manual-approval-agent-deployment:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ inputs.environment }}-agent-approval
    needs: [plan]
    steps:
      - uses: actions/checkout@v4

  apply:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ inputs.environment }}
    needs: [plan,manual-approval-agent-deployment]
    env:
      ENV_PATH: "${{github.workspace}}/environments/${{ inputs.environment }}/${{ inputs.location }}"
      ARM_TENANT_ID: ${{ vars.TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: iac/capability/hosted-agent-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-hosted-agent
          path: iac/capability/hosted-agent-service

      - name: Login to Azure (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}
      
      - name: Setup Tags as JSON
        shell: bash
        run: |
          echo '${{ inputs.tagsJson }}' > tf_tags.json

      - name: Terraform init
        run: |
          # this ugly command will instruct git to use non-default token we retrieved above to access any git repo:
          terraform init \
          -backend-config="${{ env.ENV_PATH }}/${{ inputs.segment }}/backend-config-project.tfvars" \
          -backend-config="key=backend-${{ inputs.segment }}-${{ inputs.appName }}-${{ inputs.snowNumber }}.tfstate"
            
      - name: Terraform apply
        run: |
          terraform apply hostedagenttfplan

      - name: Update usecase reader AAD group
        id: ad-group-update
        continue-on-error: true
        shell: bash
        run: |
          az ad group member add \
            --group ${{ vars.USECASE_READER_AAD_GROUP }} \
            --member-id ${{ inputs.readerAADgroup }}
      
      - name: Check if AD group added
        run: |
         echo "Outcome: ${{ steps.ad-group-update.outcome }}"
